<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Connect</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --blue:#007aff;
  --blue2:#006ee6;
  --black:#0a0a0b;
  --text:#101114;
  --muted:#667085;
  --bg:#f5f7fb;
  --white:#fff;
  --line:rgba(15,23,42,.09);
  --glass:rgba(255,255,255,.72);
  --red:#ff3b30;
  --green:#22c55e;
  --shadow:0 18px 55px rgba(15,23,42,.10);
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(
      circle at 10% 0%,
      rgba(0,122,255,.14),
      transparent 28%
    ),
    radial-gradient(
      circle at 100% 20%,
      rgba(0,86,214,.08),
      transparent 28%
    ),
    #f5f7fb;
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;
  letter-spacing:-.015em;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.hidden{
  display:none!important;
}

/* =========================
   GENERAL
========================= */

.primary{
  border:0;
  border-radius:14px;
  padding:12px 17px;
  color:white;
  font-weight:700;
  background:linear-gradient(
    180deg,
    #168bff,
    #0071e3
  );
  box-shadow:
    0 8px 22px rgba(0,122,255,.22);
}

.primary:hover{
  transform:translateY(-1px);
  box-shadow:
    0 12px 28px rgba(0,122,255,.28);
}

.secondary{
  border:1px solid var(--line);
  border-radius:14px;
  padding:11px 15px;
  background:rgba(255,255,255,.75);
  color:#111318;
}

.secondary:hover{
  background:#fff;
  border-color:rgba(0,122,255,.25);
}

.danger{
  border:1px solid rgba(255,59,48,.15);
  border-radius:14px;
  padding:11px 15px;
  background:rgba(255,59,48,.08);
  color:#d92d20;
}

.toast{
  position:fixed;
  z-index:9999;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  width:max-content;
  max-width:90vw;
  padding:13px 17px;
  border-radius:16px;
  color:white;
  background:rgba(25,27,31,.94);
  box-shadow:0 18px 50px rgba(0,0,0,.25);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  font-size:14px;
}

.toast.error{
  box-shadow:
    0 18px 50px rgba(255,59,48,.18);
}

.toast.success{
  box-shadow:
    0 18px 50px rgba(34,197,94,.18);
}

/* =========================
   LANDING
========================= */

.landing{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:25px;
  background:
    radial-gradient(
      circle at 15% 15%,
      rgba(0,122,255,.18),
      transparent 30%
    ),
    radial-gradient(
      circle at 90% 30%,
      rgba(0,80,190,.10),
      transparent 25%
    ),
    linear-gradient(
      135deg,
      #ffffff,
      #edf4fc 55%,
      #ffffff
    );
}

.hero{
  width:min(760px,100%);
  text-align:center;
}

.logo{
  width:70px;
  height:70px;
  display:grid;
  place-items:center;
  margin:0 auto 22px;
  border-radius:23px;
  color:#fff;
  font-size:29px;
  font-weight:900;
  background:
    linear-gradient(
      145deg,
      #1a92ff,
      #0057d9
    );
  box-shadow:
    0 20px 45px rgba(0,122,255,.30);
}

.hero h1{
  margin:0;
  font-size:clamp(42px,8vw,74px);
  line-height:.98;
  letter-spacing:-.065em;
  font-weight:850;
}

.hero p{
  max-width:600px;
  margin:22px auto 30px;
  color:var(--muted);
  font-size:18px;
  line-height:1.55;
}

.hero-buttons{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
}

/* =========================
   AUTH
========================= */

.auth{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
}

.auth-card{
  width:min(430px,100%);
  padding:27px;
  border:1px solid rgba(255,255,255,.9);
  border-radius:28px;
  background:rgba(255,255,255,.76);
  box-shadow:var(--shadow);
  backdrop-filter:blur(30px);
  -webkit-backdrop-filter:blur(30px);
}

.back{
  border:0;
  padding:0;
  margin-bottom:22px;
  color:var(--muted);
  background:transparent;
}

.auth-card h2{
  margin:0 0 7px;
  font-size:29px;
  letter-spacing:-.045em;
}

.auth-card>p{
  color:var(--muted);
  line-height:1.5;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  margin-bottom:7px;
  font-size:13px;
  font-weight:700;
}

.field input,
.field textarea{
  width:100%;
  border:1px solid var(--line);
  outline:0;
  border-radius:14px;
  padding:13px;
  background:rgba(248,250,252,.9);
}

.field input:focus,
.field textarea:focus{

    0 0 0 4px rgba(0,122,255,.10);

}

.field textarea{

}

.form-error{
  min-height:20px;
  margin:5px 0 10px;
  color:#d92d20;
  font-size:13px;
}

/* =========================
   MAIN APP
========================= */

.layout{
  min-height:100vh;
  display:grid;
  grid-template-columns:285px 1fr;
}

.sidebar{
  display:flex;
  flex-direction:column;
  gap:16px;
  padding:18px;
  background:rgba(255,255,255,.67);
  border-right:1px solid var(--line);
  backdrop-filter:blur(30px);
  -webkit-backdrop-filter:blur(30px);
}

.brand{
  padding:5px;
  font-size:23px;
  font-weight:900;
  letter-spacing:-.045em;
}

.my-profile{
  display:flex;
  align-items:center;
  gap:11px;
  padding:10px;
  border:1px solid var(--line);
  border-radius:18px;
  background:rgba(255,255,255,.75);
  box-shadow:
    0 8px 25px rgba(15,23,42,.05);
}

.my-info{
  min-width:0;
}

.my-info b,
.my-info span{
  display:block;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.avatar{
  width:43px;
  height:43px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  overflow:hidden;
  border-radius:50%;
  background:
    linear-gradient(
      145deg,
      #dbeafe,
      #bfdbfe
    );
  color:#0757b8;
  font-weight:800;
}

.avatar img,
img.avatar{

  height:100%;

}

.big-avatar{

  height:90px;
  display:grid;
  place-items:center;
  overflow:hidden;
  border-radius:50%;

  font-size:29px;
  font-weight:800;
}

.big-avatar img{

  height:100%;

}

.nav{

  gap:5px;
}

.nav button{

}

.nav button:hover,
.nav button.active{

  background:rgba(0,122,255,.09);
}

.badge{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);

  padding:2px 6px;
  border-radius:99px;
  background:var(--blue);
  color:white;
  font-size:11px;

}

.sidebar-bottom{

}

.main{

.topbar{

.topbar h2{

  font-weight:800;

}

.content{

.grid{

.card{

.card h3{

  color:var(--muted);

.empty{

.small{

/* =========================
   USER LIST
========================= */

.search{
  display:flex;
  gap:9px;
  margin-bottom:17px;
}

.search input{
  flex:1;
  min-width:0;
  border:1px solid var(--line);
  outline:0;
  border-radius:14px;
  padding:13px;
  background:rgba(248,250,252,.9);
}

.search input:focus{
  background:#fff;

  box-shadow:
    0 0 0 4px rgba(0,122,255,.10);
}

.user-list{
  display:grid;
  gap:9px;
}

.user-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  border:1px solid var(--line);
  border-radius:18px;
  background:rgba(255,255,255,.70);
}

.user-info{
  flex:1;
  min-width:0;
}

.user-info b,
.user-info span{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;

}

.user-actions{
  display:flex;

  flex-wrap:wrap;
}

.status{
  color:var(--muted);
  font-size:12px;
}

.status.online{
  color:#16a34a;
}

.status.online::before{
  content:"";
  display:inline-block;
  width:7px;
  height:7px;
  margin-right:5px;
  border-radius:50%;
  background:#22c55e;
}

/* =========================
   CHAT
========================= */

.chat-shell{
  height:calc(100vh - 74px);
  display:grid;
  grid-template-columns:310px 1fr;
  background:rgba(255,255,255,.27);
}

.chat-list{
  overflow:auto;
  padding:12px;

  background:rgba(255,255,255,.43);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
}

.chat-item{

  display:flex;
  align-items:center;
  gap:10px;
  border:0;
  border-radius:17px;

  background:transparent;
  text-align:left;
}

.chat-item:hover,
.chat-item.active{

}

.chat-preview{
  min-width:0;

}

.chat-preview b,
.chat-preview span{
  display:block;
  overflow:hidden;

}

.chat-window{
  min-width:0;
  display:flex;
  flex-direction:column;
  background:rgba(248,250,253,.48);
}

.chat-header{

  display:flex;
  align-items:center;
  gap:11px;
  padding:10px 16px;
  border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.65);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
}

.chat-header-info{
  min-width:0;
}

.chat-header-info b{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.chat-messages{

  display:flex;
  flex-direction:column;

.message{

}

.message.mine{

.bubble{

    0 5px 18px rgba(15,23,42,.055);

  overflow-wrap:anywhere;
}

.message.mine .bubble{

  border-radius:

  background:

      #0071e3
    );
  box-shadow:

}

.message-meta{
  margin:4px 6px;
  color:var(--muted);

.message.mine .message-meta{

}

.chat-input{
  display:flex;
  gap:9px;
  padding:12px;
  border-top:1px solid var(--line);
  background:rgba(255,255,255,.75);
  backdrop-filter:blur(25px);

}

.chat-input textarea{
  flex:1;
  height:46px;
  max-height:120px;
  resize:none;
  border:1px solid var(--line);

  border-radius:14px;

  background:rgba(248,250,252,.9);
}

.chat-input textarea:focus{
  background:#fff;
  border-color:rgba(0,122,255,.55);
  box-shadow:
    0 0 0 4px rgba(0,122,255,.10);
}

.mobile-back{
  display:none;
  border:0;
  background:transparent;
  font-size:30px;
  color:#111;

/* =========================
   PROFILE
========================= */

.profile-grid{
  display:grid;
  grid-template-columns:

.profile-head{

  align-items:center;

.file-button{

/* =========================

========================= */

.mobile-nav{

/* =========================
   MOBILE
========================= */

@media(max-width:800px){

  .layout{

  }

  }

  .mobile-nav span{

  .chat-shell{

  .chat-list{

  .chat-window{

    font-size:43px;
  }

  .hero p{
    font-size:16px;
  }

  .auth-card{
    padding:23px;
  }

}
</style>
</head>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://cfcwsazbnsklqgsgdwea.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_e2qODCX9-2UILTL5ibZ8Lg_NGtR8-t8";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
      }
    }
  );


/* =========================================================
   STATE
========================================================= */

const state = {

  session:null,
  user:null,
  profile:null,

  page:"home",

  friends:[],
  requests:[],
  notifications:[],
  chats:[],

  activeChat:null,
  activeConversation:null,

  activeChatProfile:null,

  messageChannel:null,
  requestChannel:null,
  notificationChannel:null

};


/* =========================================================
   HELPERS
========================================================= */

function $(selector){
  return document.querySelector(selector);
}

function escapeHTML(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      character => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[character])
    );

}

function initials(profile){

  return escapeHTML(
    (
      profile?.display_name ||
      profile?.username ||
      "?"
    )
    .trim()
    .charAt(0)
    .toUpperCase()
  );

}

function avatar(profile,className="avatar"){

  if(profile?.avatar_url){

    return `
      <img
        class="${className}"
        src="${escapeHTML(profile.avatar_url)}"
        alt="">
    `;

  }

  return `
    <div class="${className}">
      ${initials(profile)}
    </div>
  `;

}

function timeAgo(date){

  if(!date)
    return "";

  const seconds =
    Math.floor(
      (
        Date.now() -
        new Date(date).getTime()
      ) / 1000
    );

  if(seconds < 60)
    return "just now";

  if(seconds < 3600)
    return (
      Math.floor(seconds / 60) +
      "m ago"
    );

  if(seconds < 86400)
    return (
      Math.floor(seconds / 3600) +
      "h ago"
    );

  if(seconds < 604800)
    return (
      Math.floor(seconds / 86400) +
      "d ago"
    );

  return new Date(date)
    .toLocaleDateString();

}

function timeText(date){

  return new Date(date)
    .toLocaleTimeString(
      [],
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

}

function toast(message,type=""){

  const element =
    $("#toast");

  element.textContent =
    message;

  element.className =
    "toast " + type;

  clearTimeout(
    window.toastTimer
  );

  window.toastTimer =
    setTimeout(
      () => {
        element.classList.add(
          "hidden"
        );
      },
      3500
    );

}

function friendlyError(error){

  const message =
    error?.message ||
    String(
      error ||
      "Something went wrong."
    );

  if(
    /duplicate key|unique constraint/i
      .test(message)
  ){
    return "That username is already taken.";
  }

  if(
    /users must be friends/i
      .test(message)
  ){
    return "You must be friends before starting a chat.";
  }

  if(
    /blocked/i.test(message)
  ){
    return "This conversation is unavailable because one user has blocked the other.";
  }

  if(
    /authentication required/i
      .test(message)
  ){
    return "Please log in again.";
  }

  if(
    /row-level security|permission denied/i
      .test(message)
  ){
    return "Supabase security rules rejected this action.";
  }

  return message;

}

function authEmail(username){

  return (
    username.toLowerCase() +
    "@auth.shinannuneenkutty.in"
  );

}


/* =========================================================
   LANDING
========================================================= */

function renderLanding(){

  $("#app").innerHTML = `

    <div class="landing">

      <div class="hero">

        <div class="logo">
          C
        </div>

        <h1>
          Chat with anyone.<br>
          Connect with everyone.
        </h1>

        <p>
          Create your username, find people,
          become friends and chat privately in real time.
        </p>

        <div class="hero-buttons">

          <button
            class="primary"
            onclick="showAuth('register')">

            Create Account

          </button>

          <button
            class="secondary"
            onclick="showAuth('login')">

            Login

              margin:0 0 0 5px;
              color:#007aff"
            onclick="
              showAuth('${

                ? "register"
                : "login"
              }')
            ">

            ${
              mode === "login"
              ? "Create account"
              : "Login"
            }

          </button>

        </p>

    </div>

  `;

  $("#authForm").addEventListener(

      )
  );

async function submitAuth(event,mode){

  event.preventDefault();

  const button =
    $("#authButton");

  const errorBox =
    $("#authError");

  const username =
    $("#username")
      .value
      .trim()
      .toLowerCase();

  const password =
    $("#password")
      .value;

  errorBox.textContent =
    "";

  if(
    !/^[a-z0-9_.]{3,20}$/
      .test(username)
  ){

    errorBox.textContent =
      "Username must be 3–20 characters and contain only letters, numbers, underscores or periods.";

    return;

  }

  if(password.length < 8){

    errorBox.textContent =
      "Password must contain at least 8 characters.";

    return;

  }

  button.disabled =
    true;

  button.textContent =
    "Please wait…";

  try{

    if(mode === "register"){

      /*
        The validate_username function created
        by the database setup is used here.
      */

      const {
        data:available,
        error:usernameError
      } =
        await supabaseClient.rpc(
          "validate_username",
          {
            requested_username:
              username
          }
        );

      if(usernameError)
        throw usernameError;

      if(!available){

        throw new Error(
          "Username is already taken or unavailable."
        );

      }

      const {
        data,
        error
      } =
        await supabaseClient.auth
          .signUp({

            email:
              authEmail(
                username
              ),

            password,

            options:{
              data:{
                username
              }
            }

          });

      if(error)
        throw error;

      if(!data.user)
        throw new Error(
          "Account could not be created."
        );

      if(!data.session){

        throw new Error(
          "Account created, but Supabase email confirmation is enabled. Disable Confirm email in Supabase Authentication settings."
        );

      }

      await startApp(
        data.session
      );

    }else{

      const {
        data,
        error
      } =
        await supabaseClient.auth
          .signInWithPassword({

            email:
              authEmail(
                username
              ),

            password

          });

      if(error)
        throw error;

      await startApp(
        data.session
      );

    }

  }catch(error){

    console.error(
      "AUTH ERROR:",
      error
    );

    errorBox.textContent =
      friendlyError(error);

  }finally{

    button.disabled =
      false;

    button.textContent =
      mode === "login"
      ? "Login"
      : "Create Account";

  }

}


/* =========================================================
   SESSION
========================================================= */

async function startApp(session){

  state.session =
    session;

  state.user =
    session.user;

  await loadProfile();

  if(!state.profile){

    throw new Error(
      "Your account exists, but your profile could not be loaded."
    );

  }

  await setPresence(
    true
  );

  await loadData();

  subscribeRealtime();

  renderApp();

}

async function loadProfile(){

  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq(
        "id",
        state.user.id
      )
      .single();

  if(error)
    throw error;

  state.profile =
    data;

}

async function setPresence(online){

  if(!state.user)
    return;

  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .update({

        online_status:
          online,

        last_seen:
          new Date().toISOString()

      })
      .eq(
        "id",
        state.user.id
      )
      .select()
      .single();

  if(!error && data){

    state.profile =
      data;

  }

}


/* =========================================================
   LOAD DATA
========================================================= */

async function loadData(){

  await Promise.all([
    loadFriends(),
    loadRequests(),
    loadNotifications()
  ]);

  await loadChats();

}

async function loadFriends(){

  const {
    data,
    error
  } =
    await supabaseClient
      .from("friendships")
      .select(
        "id,user_id,friend_id,created_at"
      )
      .or(
        `user_id.eq.${state.user.id},friend_id.eq.${state.user.id}`
      );

  if(error)
    throw error;

  const ids =
    (data || [])
      .map(
        row =>
          row.user_id ===
          state.user.id
          ? row.friend_id
          : row.user_id
      );

  if(!ids.length){

    state.friends = [];

    return;

  }

  const {
    data:profiles,
    error:profileError
  } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .in(
        "id",
        ids
      );

  if(profileError)
    throw profileError;

  state.friends =
    profiles || [];

}

async function loadRequests(){

  const {
    data,
    error
  } =
    await supabaseClient
      .from("friend_requests")
      .select("*")
      .or(
        `sender_id.eq.${state.user.id},receiver_id.eq.${state.user.id}`
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );

  if(error)
    throw error;

  state.requests =
    data || [];

}

async function loadNotifications(){

  const {
    data,
    error
  } =
    await supabaseClient
      .from("notifications")
      .select("*")
      .eq(
        "user_id",
        state.user.id
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      )
      .limit(50);

  if(error){

    /*
      If notifications aren't available yet,
      don't prevent the rest of the application
      from loading.
    */

    console.warn(
      "Notifications:",
      error.message
    );

    state.notifications = [];

    return;

  }

  state.notifications =
    data || [];

}


/* =========================================================
   LOAD CHATS
========================================================= */

async function loadChats(){

  const {
    data:myMemberships,
    error
  } =
    await supabaseClient
      .from("conversation_members")
      .select(
        "conversation_id,user_id"
      )
      .eq(
        "user_id",
        state.user.id
      );

  if(error){

    console.warn(
      "Conversation list:",
      error.message
    );

    state.chats = [];

    return;

  }

  const conversationIds =
    (myMemberships || [])
      .map(
        row =>
          row.conversation_id
      );

  if(!conversationIds.length){

    state.chats = [];

    return;

  }

  const {
    data:members,
    error:membersError
  } =
    await supabaseClient
      .from("conversation_members")
      .select(
        "conversation_id,user_id"
      )
      .in(
        "conversation_id",
        conversationIds
      );

  if(membersError){

    console.warn(
      "Conversation members:",
      membersError.message
    );

    return;

  }

  const otherIds =
    [
      ...new Set(
        (members || [])
          .filter(
            row =>
              row.user_id !==
              state.user.id
          )
          .map(
            row =>
              row.user_id
          )
      )
    ];

  if(!otherIds.length){

    state.chats = [];

    return;

  }

  const {
    data:profiles,
    error:profilesError
  } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .in(
        "id",
        otherIds
      );

  if(profilesError){

    console.warn(
      "Chat profiles:",
      profilesError.message
    );

    return;

  }

  const profileMap =
    new Map(
      (profiles || [])
        .map(
          profile =>
            [
              profile.id,
              profile
            ]
        )
    );

  state.chats =
    conversationIds
      .map(
        conversationId => {

          const member =
            (members || [])
              .find(
                row =>
                  row.conversation_id ===
                    conversationId &&
                  row.user_id !==
                    state.user.id
              );

          if(!member)
            return null;

          const profile =
            profileMap.get(
              member.user_id
            );

          if(!profile)
            return null;

          return {

            conversation_id:
              conversationId,

            profile

          };

        }
      )
      .filter(Boolean);

}


/* =========================================================
   REALTIME
========================================================= */

function subscribeRealtime(){

  if(state.messageChannel)
    supabaseClient.removeChannel(
      state.messageChannel
    );

  if(state.requestChannel)
    supabaseClient.removeChannel(
      state.requestChannel
    );

  if(state.notificationChannel)
    supabaseClient.removeChannel(
      state.notificationChannel
    );


  state.messageChannel =
    supabaseClient
      .channel(
        "messages-" +
        state.user.id
      )
      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"messages"
        },
        async payload => {

          if(
            state.activeConversation &&
            payload.new &&
            payload.new.conversation_id ===
            state.activeConversation
          ){

            await loadMessages(
              true
            );

          }

          await loadChats();

        }
      )
      .subscribe();


  state.requestChannel =
    supabaseClient
      .channel(
        "friend-requests-" +
        state.user.id
      )
      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"friend_requests"
        },
        async () => {

          try{

            await loadData();

            renderApp();

          }catch(error){

            console.error(
              error
            );

          }

        }
      )
      .subscribe();


  state.notificationChannel =
    supabaseClient
      .channel(
        "notifications-" +
        state.user.id
      )
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"notifications"
        },
        async payload => {

          if(
            payload.new?.user_id !==
            state.user.id
          )
            return;

          state.notifications
            .unshift(
              payload.new
            );

          renderApp();

          if(payload.new.title){

            toast(
              payload.new.title,
              "success"
            );

          }

        }
      )
      .subscribe();

}

async function searchUsers(){

  const input =
    $("#searchInput");

  const results =
    $("#searchResults");

  const query =
    input.value
      .trim()
      .toLowerCase();

  if(!query){

    results.innerHTML = `
      <div class="empty">
        Enter a username.
      </div>
    `;

    return;

  }

  results.innerHTML = `
    <div class="empty">
      Searching…
    </div>
  `;

  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .ilike(
        "username",
        `%${query}%`
      )
      .neq(
        "id",
        state.user.id
      )
      .limit(30);

  if(error){

    results.innerHTML = `
      <div class="empty">
        ${escapeHTML(
          friendlyError(error)
        )}

    return;

  }

  if(!data?.length){

    `;

    return;

  }

  results.innerHTML =
    data
      .map(
        profile =>
          searchUserRow(
            profile
          )
      )
      .join("");

}

function searchUserRow(profile){

  const friend =
    state.friends.some(
      item =>
        item.id ===
        profile.id
    );

  const sent =
    state.requests.find(
      request =>
        request.sender_id ===
          state.user.id &&
        request.receiver_id ===
          profile.id &&
        request.status ===
          "pending"
    );

  const incoming =
    state.requests.find(
      request =>
        request.sender_id ===
          profile.id &&
        request.receiver_id ===
          state.user.id &&
        request.status ===
          "pending"
    );

  return `

    <div class="user-row">

      ${avatar(
        profile
      )}

      <div class="user-info">

        <b>
          ${escapeHTML(
            profile.display_name ||
            profile.username

            <button
              class="primary"
              onclick="openChat('${profile.id}')">

            </button>
          `
          :
          incoming
          ?
          `
            <button
              class="primary"
              onclick="acceptRequest('${incoming.id}')">

              Accept

            </button>
          `
          :
          sent
          ?
          `

              class="secondary"
              onclick="cancelRequest('${sent.id}')">

              Cancel

            </button>
          `
          :
          `

              Add Friend

            </button>
          `
        }

      </div>

    </div>

  `;

/* =========================================================
   FRIEND ACTIONS
========================================================= */

async function sendFriendRequest(userId){

  try{

    const {
      error
    } =
      await supabaseClient.rpc(
        "send_friend_request",
        {
          target_user:
            userId
        }
      );

    if(error)
      throw error;

    toast(
      "Friend request sent.",
      "success"
    );

    await loadData();

    if(
      state.page ===
      "search"
    ){

      await searchUsers();

    }

      .from("friend_requests")
      .delete()

        "id",
        requestId

      .eq(
        "sender_id",
        state.user.id

      friendlyError(error),
      "error"

  await loadData();

  );

      await supabaseClient.rpc(

      "Friend request accepted.",
      "success"

/* =========================================================
   OPEN CHAT
   IMPORTANT FIX
========================================================= */

async function openChat(userId){

  try{

    if(
      !userId ||
      userId ===
      state.user.id
    ){

      throw new Error(
        "Invalid user."
      );

    }

    /*
      First refresh the friendship data.
    */

    await loadData();

    /*
      Confirm that the selected person
      is actually a friend.
    */

    let friend =
      state.friends.find(
        item =>
          item.id ===
          userId
      );

    /*
      If it isn't in the refreshed list,
      retrieve the profile directly so
      the UI can give an accurate result.
    */

    if(!friend){

      const {
        data:profile,
        error:profileError
      } =
        await supabaseClient
          .from("profiles")
          .select("*")
          .eq(
            "id",
            userId
          )
          .single();

      if(profileError)
        throw profileError;

      /*
        Don't create a conversation unless
        the friendship exists.
      */

      throw new Error(
        "You must be friends with this user before starting a chat."
      );

    }

    /*
      IMPORTANT:
      Supabase creates or returns the existing
      private conversation.
    */

    const {
      data:conversationId,
      error
    } =
      await supabaseClient.rpc(
        "create_private_conversation",
        {
          other_user:
            userId
        }
      );

    if(error){

      console.error(
        "create_private_conversation:",
        error
      );

      throw error;

    }

    if(!conversationId){

      throw new Error(
        "Supabase did not return a conversation ID."
      );

    }

    /*
      Save BOTH the user and conversation.
    */

    state.activeChat =
      userId;

    state.activeConversation =
      conversationId;

    state.activeChatProfile =
      friend;

    /*
      Refresh conversation list.
    */

    await loadChats();

    /*
      Switch to Messages.
    */

    state.page =
      "messages";

    /*
      Render the chat FIRST.
    */

    renderApp();

    /*
      The DOM now contains #chatMessages.
      Load messages afterwards.
    */

    await loadMessages(
      true
    );

  }catch(error){

    console.error(
      "OPEN CHAT ERROR:",
      error
    );

    toast(
      friendlyError(error),
      "error"
    );

  }

}


/* =========================================================
   LOAD MESSAGES
========================================================= */

async function loadMessages(scroll=true){

  if(!state.activeConversation)
    return;

  const {
    data,
    error
  } =
    await supabaseClient
      .from("messages")
      .select("*")
      .eq(
        "conversation_id",
        state.activeConversation
      )
      .order(
        "created_at",
        {
          ascending:true
        }
      );

  const box =
    $("#chatMessages");

  if(!box)
    return;

  if(error){

    console.error(
      "LOAD MESSAGES:",
      error
    );

    box.innerHTML = `

      <div class="empty">

        Unable to load messages.

        <br><br>

        <span class="small">
          ${escapeHTML(
            friendlyError(error)
          )}
        </span>

      </div>

    `;

    return;

  }

  if(!data?.length){

    box.innerHTML = `

      <div
        class="empty"
        style="margin:auto">

        <div
          style="
            font-size:40px;
            margin-bottom:10px">

          👋

        </div>

        <b>
          Start the conversation
        </b>

        <p>
          Send your first message.
        </p>

      </div>

    `;

  }else{

    box.innerHTML =
      data
        .map(
          message => {

            const mine =
              message.sender_id ===
              state.user.id;

            const content =
              message.deleted_at
              ?
              "<i>Message deleted</i>"
              :
              escapeHTML(
                message.message
              );

            return `

              <div
                class="message ${
                  mine
                  ? "mine"
                  : ""
                }">

                <div class="bubble">
                  ${content}
                </div>

                <div class="message-meta">

                  ${timeText(
                    message.created_at
                  )}

                  ${
                    mine
                    ?
                    (
                      message.read_at
                      ?
                      " · Read"
                      :
                      " · Sent"
                    )
                    :
                    ""
                  }

                </div>

              </div>

            `;

          }
        )
        .join("");

  }

  if(scroll){

    box.scrollTop =
      box.scrollHeight;

  }

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(event){

  event.preventDefault();

  if(!state.activeConversation)
    return;

  const input =
    $("#chatInput");

  const text =
    input.value.trim();

  if(!text)
    return;

  input.disabled =
    true;

  try{

    const {
      error
    } =
      await supabaseClient
        .from("messages")
        .insert({

          conversation_id:
            state.activeConversation,

          sender_id:
            state.user.id,

          message:
            text

        });

    if(error)
      throw error;

    input.value =
      "";

    await loadMessages(
      true
    );

  }catch(error){

    console.error(
      "SEND MESSAGE:",
      error
    );

    toast(
      friendlyError(error),
      "error"
    );

  }finally{

    input.disabled =
      false;

    input.focus();

  }

}

async function uploadAvatar(event){

  const file =
    event.target.files[0];

  if(!file)
    return;

  if(
    file.size >
    2 * 1024 * 1024
  ){

    toast(
      "Avatar must be smaller than 2 MB.",
      "error"
    );

    return;

  }

  const extension =
    (
      file.name
        .split(".")
        .pop() ||
      "jpg"
    ).toLowerCase();

  const path =
    `${state.user.id}/avatar.${extension}`;

  const {
    error
  } =
    await supabaseClient
      .storage
      .from("avatars")
      .upload(
        path,
        file,
        {
          upsert:true,
          contentType:
            file.type
        }
      );

  if(error){

    toast(
      friendlyError(error),
      "error"
    );

    return;

  }

  const {
    data
  } =
    supabaseClient
      .storage
      .from("avatars")
      .getPublicUrl(
        path
      );

  const url =
    data.publicUrl +
    "?v=" +
    Date.now();

  const {
    data:profile,
    error:profileError
  } =
    await supabaseClient
      .from("profiles")
      .update({
        avatar_url:
          url
      })
      .eq(
        "id",
        state.user.id
      )
      .select()
      .single();

  if(profileError){

    toast(
      friendlyError(
        profileError
      ),
      "error"
    );

    return;

  }

  state.profile =
    profile;

  toast(
    "Avatar updated.",
    "success"
  );

  renderApp();

}

/* =========================================================
   EVENTS
========================================================= */

function bindEvents(){

  if(
    state.page ===
    "search"
  ){

    const searchButton =
      $("#searchButton");

    const searchInput =
      $("#searchInput");

    if(searchButton){

      searchButton.onclick =
        searchUsers;

    }

    if(searchInput){

      searchInput.onkeydown =
        event => {

          if(
            event.key ===
            "Enter"
          ){

            event.preventDefault();

            searchUsers();

          }

        };

    }

  }


  if(
    state.page ===
    "messages"
  ){

    const form =
      $("#chatForm");

    const input =
      $("#chatInput");

    if(form){

      form.onsubmit =
        sendMessage;

    }

    if(input){

      input.onkeydown =
        event => {

          if(
            event.key ===
              "Enter" &&
            !event.shiftKey
          ){

            event.preventDefault();

            sendMessage(
              event
            );

          }

        };

    }

    if(state.activeConversation){

      loadMessages(
        true
      );

    }

  }


  if(
    state.page ===
    "profile"
  ){

    const form =
      $("#profileForm");

    const avatarInput =
      $("#avatarInput");

    if(form){

      form.onsubmit =
        saveProfile;

    }

    if(avatarInput){

      avatarInput.onchange =
        uploadAvatar;

    }

  }

}

========================================================= */

async function logout(){

  try{

    await setPresence(
      false
    );

  }catch(error){

    console.warn(
      error
    );

  }

  if(state.messageChannel){

    await supabaseClient
      .removeChannel(
        state.messageChannel
      );

  }

  if(state.requestChannel){

    await supabaseClient
      .removeChannel(
        state.requestChannel
      );

  }

  if(state.notificationChannel){

    await supabaseClient
      .removeChannel(
        state.notificationChannel
      );

  }

  await supabaseClient.auth
    .signOut();

  state.session =
    null;

  state.user =
    null;

  state.profile =
    null;

  renderLanding();

}

window.addEventListener(
  "beforeunload",
  () => {

    if(state.user){

      setPresence(
        false
      );

    }

  }
);


/* =========================================================
   START APPLICATION
========================================================= */

async function boot(){

  try{

    const {
      data,
      error
    } =
      await supabaseClient.auth
        .getSession();

    if(error)
      throw error;

    if(
      data.session
    ){

      await startApp(
        data.session
      );

    }else{

      renderLanding();

    }

  }catch(error){

    console.error(
      "BOOT ERROR:",
      error
    );

    renderLanding();

    toast(
      friendlyError(error),
      "error"
    );

  }

}

boot();

</script>

</body>
</html>
