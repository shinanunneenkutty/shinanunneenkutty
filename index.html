<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shinan Unneenkutty P — Coming Soon</title>
<meta name="description" content="Shinan Unneenkutty P's portfolio is coming soon.">
<meta name="theme-color" content="#0A5FFF">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
  :root{
    --white:        #ffffff;
    --paper:        #f4f8ff;
    --paper-alt:    #eef4ff;
    --ink:          #0b1e3d;
    --ink-soft:     #3c5170;
    --blue-900:     #06214f;
    --blue-700:     #0b3ea8;
    --blue-600:     #0a5fff;
    --blue-400:     #5b9dff;
    --blue-200:     #b9d5ff;
    --blue-100:     #dcebff;

    --glass-bg:        rgba(255, 255, 255, 0.55);
    --glass-bg-strong: rgba(255, 255, 255, 0.72);
    --glass-border:    rgba(255, 255, 255, 0.6);
    --glass-shadow:    0 8px 32px rgba(11, 46, 110, 0.12);

    --font-display: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    --font-body: 'Manrope', -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;

    --ease: cubic-bezier(.16,.8,.24,1);
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, var(--paper) 0%, var(--white) 45%, var(--paper-alt) 100%);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    padding: 24px;
    position: relative;
  }

  a{ color: inherit; text-decoration: none; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  a:focus-visible, button:focus-visible, input:focus-visible{
    outline: 2px solid var(--blue-600);
    outline-offset: 3px;
    border-radius: 8px;
  }

  /* ambient background */
  .aurora{ position: absolute; inset: 0; z-index: 0; filter: blur(10px); pointer-events: none; }
  .orb{
    position: absolute;
    border-radius: 50%;
    opacity: 0.55;
    filter: blur(60px);
    animation: float 16s ease-in-out infinite;
  }
  .orb-1{
    width: 480px; height: 480px;
    top: -160px; left: -140px;
    background: radial-gradient(circle, var(--blue-400), transparent 70%);
  }
  .orb-2{
    width: 420px; height: 420px;
    bottom: -160px; right: -120px;
    background: radial-gradient(circle, var(--blue-600), transparent 70%);
    animation-delay: -6s;
  }
  .orb-3{
    width: 300px; height: 300px;
    top: 55%; left: 65%;
    background: radial-gradient(circle, var(--blue-200), transparent 70%);
    animation-delay: -11s;
  }
  @keyframes float{
    0%,100%{ transform: translate(0,0) scale(1); }
    33%{ transform: translate(30px,-40px) scale(1.08); }
    66%{ transform: translate(-25px,25px) scale(0.96); }
  }

  .grid-overlay{
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(10,95,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(10,95,255,0.05) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 20%, transparent 75%);
    z-index: 0;
  }

  /* card */
  .card{
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 560px;
    text-align: center;
    padding: 52px 40px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 28px;
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    box-shadow: var(--glass-shadow);
  }

  .badge{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-display);
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-size: 0.72rem;
    color: var(--blue-600);
    background: var(--blue-100);
    padding: 8px 16px;
    border-radius: 999px;
    margin-bottom: 22px;
  }
  .badge i{ font-size: 0.7rem; }

  h1{
    font-family: var(--font-display);
    font-weight: 800;
    letter-spacing: -0.02em;
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    color: var(--blue-900);
    margin: 0 0 10px;
  }
  .gradient-text{
    background: linear-gradient(120deg, var(--blue-700), var(--blue-400) 60%, var(--blue-600));
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 6s linear infinite;
  }
  @keyframes shine{ to{ background-position: 200% center; } }

  .lead{
    font-size: 1.02rem;
    line-height: 1.7;
    color: var(--ink-soft);
    max-width: 420px;
    margin: 0 auto 34px;
  }

  /* countdown */
  .countdown{
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 34px;
    flex-wrap: wrap;
  }
  .countdown-unit{
    min-width: 74px;
    padding: 14px 10px;
    background: var(--glass-bg-strong);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
  }
  .countdown-unit strong{
    display: block;
    font-family: var(--font-display);
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--blue-700);
    font-variant-numeric: tabular-nums;
  }
  .countdown-unit span{
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  /* notify form */
  .notify-form{
    display: flex;
    gap: 10px;
    max-width: 400px;
    margin: 0 auto 8px;
  }
  .notify-form input{
    flex: 1;
    min-width: 0;
    padding: 13px 16px;
    border-radius: 999px;
    border: 1px solid rgba(11,46,110,0.14);
    background: rgba(255,255,255,0.75);
    font-family: var(--font-body);
    font-size: 0.92rem;
    color: var(--ink);
    transition: border-color .25s var(--ease), box-shadow .25s var(--ease);
  }
  .notify-form input:focus{
    border-color: var(--blue-600);
    box-shadow: 0 0 0 4px rgba(10,95,255,0.12);
    outline: none;
  }
  .btn{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 22px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 0.9rem;
    white-space: nowrap;
    background: linear-gradient(135deg, var(--blue-600), var(--blue-700));
    color: #fff;
    box-shadow: 0 10px 26px rgba(10,95,255,0.32);
    transition: transform .3s var(--ease), box-shadow .3s var(--ease);
  }
  .btn:hover{ transform: translateY(-2px); box-shadow: 0 14px 30px rgba(10,95,255,0.42); }

  .form-note{
    min-height: 1.2em;
    font-size: 0.82rem;
    color: var(--blue-600);
    margin: 10px 0 0;
  }

  /* socials */
  .socials{
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-top: 30px;
  }
  .socials a{
    width: 42px; height: 42px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    background: var(--glass-bg-strong);
    border: 1px solid var(--glass-border);
    color: var(--blue-700);
    transition: transform .3s var(--ease), background .3s var(--ease), color .3s var(--ease);
  }
  .socials a:hover{
    transform: translateY(-3px);
    background: var(--blue-600);
    color: #fff;
  }

  @media (max-width: 480px){
    .card{ padding: 40px 24px; }
    .notify-form{ flex-direction: column; }
    .countdown-unit{ min-width: 64px; padding: 12px 6px; }
  }
</style>
</head>
<body>

<div class="aurora" aria-hidden="true">
  <span class="orb orb-1"></span>
  <span class="orb orb-2"></span>
  <span class="orb orb-3"></span>
</div>
<div class="grid-overlay" aria-hidden="true"></div>

<main class="card">
  <span class="badge"><i class="fa-solid fa-hourglass-half"></i> Coming Soon</span>

  <h1>Shinan Unneenkutty P's<br><span class="gradient-text">portfolio is on its way</span></h1>

  <p class="lead">
    I'm putting the finishing touches on my site. Check back soon, or leave your
    email and I'll let you know the moment it's live.
  </p>

  <div class="countdown" id="countdown" aria-label="Time remaining until launch">
    <div class="countdown-unit"><strong id="cd-days">00</strong><span>Days</span></div>
    <div class="countdown-unit"><strong id="cd-hours">00</strong><span>Hours</span></div>
    <div class="countdown-unit"><strong id="cd-mins">00</strong><span>Mins</span></div>
    <div class="countdown-unit"><strong id="cd-secs">00</strong><span>Secs</span></div>
  </div>

  <form class="notify-form" id="notifyForm">
    <label for="notifyEmail" class="sr-only" style="position:absolute;left:-9999px;">Email address</label>
    <input type="email" id="notifyEmail" placeholder="you@example.com" required>
    <button type="submit" class="btn">Notify Me <i class="fa-solid fa-paper-plane"></i></button>
  </form>
  <p class="form-note" id="formNote" role="status" aria-live="polite"></p>

  <div class="socials">
    <a href="mailto:shinan@example.com" aria-label="Email"><i class="fa-solid fa-envelope"></i></a>
    <a href="#" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
    <a href="#" target="_blank" rel="noopener" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
    <a href="#" target="_blank" rel="noopener" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
  </div>
</main>

<script>
  // ---- Countdown: set your real launch date/time here (ISO format) ----
  const LAUNCH_DATE = new Date('2026-09-01T00:00:00');

  const daysEl = document.getElementById('cd-days');
  const hoursEl = document.getElementById('cd-hours');
  const minsEl = document.getElementById('cd-mins');
  const secsEl = document.getElementById('cd-secs');

  function pad(n){ return String(n).padStart(2, '0'); }

  function updateCountdown(){
    const diff = LAUNCH_DATE.getTime() - Date.now();
    if (diff <= 0){
      daysEl.textContent = hoursEl.textContent = minsEl.textContent = secsEl.textContent = '00';
      return;
    }
    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const mins = Math.floor((diff / (1000 * 60)) % 60);
    const secs = Math.floor((diff / 1000) % 60);

    daysEl.textContent = pad(days);
    hoursEl.textContent = pad(hours);
    minsEl.textContent = pad(mins);
    secsEl.textContent = pad(secs);
  }
  updateCountdown();
  setInterval(updateCountdown, 1000);

  // ---- Notify form (front-end only — wire up to a real backend/email service later) ----
  const notifyForm = document.getElementById('notifyForm');
  const formNote = document.getElementById('formNote');
  notifyForm.addEventListener('submit', (e) => {
    e.preventDefault();
    formNote.textContent = "Thanks! I'll let you know as soon as it's live.";
    notifyForm.reset();
  });
</script>
</body>
</html>
