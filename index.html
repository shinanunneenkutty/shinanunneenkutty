<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f9fc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Connect</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --blue:#007aff;
  --blue2:#005fe8;
  --ink:#0b0d10;
  --muted:#667085;
  --bg:#f5f7fb;
  --card:rgba(255,255,255,.76);
  --line:rgba(15,23,42,.09);
  --green:#22c55e;
  --red:#ff3b30;
  --nav:72px;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(
      circle at 5% 0%,
      rgba(0,122,255,.12),
      transparent 28%
    ),
    radial-gradient(
      circle at 100% 20%,
      rgba(0,95,232,.08),
      transparent 30%
    ),
    var(--bg);
  color:var(--ink);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Segoe UI",
    sans-serif;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.primary{
  border:0;
  border-radius:15px;
  padding:12px 17px;
  color:#fff;
  font-weight:750;
  background:linear-gradient(
    180deg,
    #168cff,
    #0071e3
  );
  box-shadow:
    0 9px 25px rgba(0,122,255,.22);
}

.secondary{
  border:1px solid var(--line);
  border-radius:15px;
  padding:11px 15px;
  background:#fff;
  color:var(--ink);
}

.danger{
  border:1px solid rgba(255,59,48,.15);
  border-radius:15px;
  padding:11px 15px;
  background:rgba(255,59,48,.08);
  color:#d92d20;
}

.card{
  border:1px solid rgba(255,255,255,.9);
  border-radius:24px;
  background:var(--card);
  box-shadow:
    0 15px 45px rgba(15,23,42,.065);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
}

.muted{
  color:var(--muted);
}

.small{
  font-size:12px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:30px 15px;
}

.avatar{
  width:44px;
  height:44px;
  flex:0 0 auto;
  border-radius:50%;
  display:grid;
  place-items:center;
  overflow:hidden;
  background:
    linear-gradient(
      145deg,
      #dbeafe,
      #bfdbfe
    );
  color:#0757b8;
  font-weight:800;
}

.avatar img,
.big-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.big-avatar{
  width:92px;
  height:92px;
  border-radius:50%;
  display:grid;
  place-items:center;
  overflow:hidden;
  background:
    linear-gradient(
      145deg,
      #dbeafe,
      #bfdbfe
    );
  color:#0757b8;
  font-size:28px;
  font-weight:800;
}

.status{
  font-size:12px;
  color:var(--muted);
}

.status.online{
  color:#16a34a;
}

.status.online:before{
  content:"";
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#22c55e;
  margin-right:5px;
}

.toast{
  position:fixed;
  z-index:9999;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  max-width:90vw;
  padding:13px 17px;
  border-radius:16px;
  color:#fff;
  background:rgba(20,22,26,.94);
  box-shadow:
    0 18px 50px rgba(0,0,0,.25);
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
}

/* LANDING */

.landing{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:25px;
}

.hero{
  text-align:center;
  width:min(760px,100%);
}

.logo{
  width:70px;
  height:70px;
  margin:0 auto 22px;
  border-radius:23px;
  display:grid;
  place-items:center;
  color:#fff;
  font-size:30px;
  font-weight:900;
  background:
    linear-gradient(
      145deg,
      #168cff,
      #0057d9
    );
  box-shadow:
    0 20px 45px rgba(0,122,255,.28);
}

.hero h1{
  font-size:clamp(43px,8vw,75px);
  line-height:.98;
  letter-spacing:-.065em;
  margin:0;
  font-weight:850;
}

.hero p{
  max-width:600px;
  margin:22px auto 30px;
  color:var(--muted);
  font-size:18px;
  line-height:1.55;
}

.hero-buttons{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
}

/* AUTH */

.auth{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
}

.auth-card{
  width:min(430px,100%);
  padding:27px;
  border-radius:28px;
  background:rgba(255,255,255,.8);
  box-shadow:
    0 20px 60px rgba(15,23,42,.12);
  backdrop-filter:blur(30px);
}

.back{
  border:0;
  background:none;
  color:var(--muted);
  padding:0;
  margin-bottom:20px;
}

.auth-card h2{
  margin:0 0 7px;
  font-size:29px;
}

.auth-card>p{
  color:var(--muted);
  line-height:1.5;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}

.field input,
.field textarea{
  width:100%;
  border:1px solid var(--line);
  outline:0;
  border-radius:14px;
  padding:13px;
  background:#f8fafc;
}

.field textarea{
  min-height:100px;
  resize:vertical;
}

.field input:focus,
.field textarea:focus,
.search input:focus,
.chat-input textarea:focus{
  border-color:rgba(0,122,255,.55);
  box-shadow:
    0 0 0 4px rgba(0,122,255,.1);
  background:#fff;
}

.form-error{
  min-height:20px;
  color:#d92d20;
  font-size:13px;
  margin:5px 0 10px;
}

/* MAIN */

.layout{
  min-height:100vh;
  display:grid;
  grid-template-columns:285px 1fr;
}

.sidebar{
  display:flex;
  flex-direction:column;
  gap:16px;
  padding:18px;
  background:rgba(255,255,255,.68);
  border-right:1px solid var(--line);
  backdrop-filter:blur(30px);
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:21px;
  font-weight:900;
  letter-spacing:-.045em;
  padding:5px;
}

.brand-mark{
  width:30px;
  height:30px;
  border-radius:9px;
  display:grid;
  place-items:center;
  color:#fff;
  background:linear-gradient(145deg,#168cff,#0057d9);
  box-shadow:0 6px 16px rgba(0,122,255,.35);
}

.my-profile{
  display:flex;
  align-items:center;
  gap:11px;
  padding:10px;
  border:1px solid var(--line);
  border-radius:18px;
  background:rgba(255,255,255,.8);
  cursor:pointer;
}

.my-info{
  min-width:0;
}

.my-info b,
.my-info span{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.nav{
  display:grid;
  gap:5px;
}

.nav button{
  position:relative;
  display:flex;
  align-items:center;
  gap:11px;
  border:0;
  border-radius:14px;
  padding:11px 12px;
  color:#667085;
  background:transparent;
  text-align:left;
  font-weight:650;
}

.nav button svg{
  flex:0 0 auto;
}

.nav button.active,
.nav button:hover{
  color:#0066d6;
  background:rgba(0,122,255,.09);
}

.badge{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  min-width:19px;
  height:19px;
  padding:0 5px;
  border-radius:99px;
  background:var(--red);
  color:#fff;
  font-size:11px;
  font-weight:700;
  line-height:19px;
  text-align:center;
}

.dot{
  display:inline-block;
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--blue);
  flex:0 0 auto;
}

.sidebar-bottom{
  margin-top:auto;
}

.main{
  min-width:0;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:74px;
  display:flex;
  align-items:center;
  padding:0 23px;
  border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(25px);
}

.topbar h2{
  margin:0;
  font-size:22px;
  letter-spacing:-.04em;
}

.content{
  flex:1;
  overflow:auto;
  padding:25px;
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap:16px;
}

/* HOME */

.home-hero{
  padding:27px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.9),
      rgba(233,243,255,.72)
    );
  overflow:hidden;
}

.home-hero h1{
  font-size:clamp(30px,5vw,48px);
  letter-spacing:-.055em;
  margin:0 0 10px;
}

.home-hero p{
  margin:0 0 20px;
  color:var(--muted);
  max-width:590px;
  line-height:1.5;
}

.home-orb{
  width:170px;
  height:170px;
  flex:0 0 auto;
  border-radius:50%;
  background:
    radial-gradient(
      circle at 30% 25%,
      #fff,
      rgba(0,122,255,.35) 35%,
      rgba(0,75,190,.85)
    );
  box-shadow:
    0 25px 55px rgba(0,122,255,.22);
}

.stat{
  padding:20px;
}

.stat strong{
  display:block;
  font-size:34px;
  letter-spacing:-.05em;
}

.stat span{
  color:var(--muted);
  font-size:13px;
}

.quick-grid{
  display:grid;
  grid-template-columns:
    repeat(3,1fr);
  gap:12px;
  margin-top:16px;
}

.quick{
  padding:17px;
  border:1px solid var(--line);
  border-radius:18px;
  background:rgba(255,255,255,.72);
  cursor:pointer;
}

.quick b{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:5px;
}

.quick span{
  color:var(--muted);
  font-size:13px;
}

/* SEARCH */

.search{
  display:flex;
  gap:9px;
  margin-bottom:17px;
}

.search input{
  flex:1;
  min-width:0;
  border:1px solid var(--line);
  outline:0;
  border-radius:14px;
  padding:13px;
  background:#f8fafc;
}

.user-list{
  display:grid;
  gap:9px;
}

.user-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  border:1px solid var(--line);
  border-radius:18px;
  background:rgba(255,255,255,.72);
}

.user-info{
  flex:1;
  min-width:0;
}

.user-info b,
.user-info span{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.user-actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

/* CHAT */

.chat-shell{
  height:calc(100vh - 74px);
  display:grid;
  grid-template-columns:310px 1fr;
}

.chat-list{
  overflow:auto;
  padding:12px;
  border-right:1px solid var(--line);
  background:rgba(255,255,255,.48);
}

.chat-item{
  position:relative;
  width:100%;
  display:flex;
  align-items:center;
  gap:10px;
  border:0;
  border-radius:17px;
  padding:11px;
  background:transparent;
  text-align:left;
}

.chat-item:hover,
.chat-item.active{
  background:rgba(0,122,255,.09);
}

.chat-item.unread .chat-preview b{
  font-weight:800;
}

.chat-item.unread .chat-preview span{
  color:var(--ink);
  font-weight:600;
}

.chat-preview{
  min-width:0;
  flex:1;
}

.chat-preview b,
.chat-preview span{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.chat-item-badge{
  min-width:20px;
  height:20px;
  padding:0 6px;
  border-radius:99px;
  background:var(--blue);
  color:#fff;
  font-size:11px;
  font-weight:700;
  line-height:20px;
  text-align:center;
  flex:0 0 auto;
}

.chat-window{
  min-width:0;
  display:flex;
  flex-direction:column;
  background:rgba(248,250,253,.5);
  min-height:0;
}

.chat-header{
  height:70px;
  flex:0 0 70px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:10px 16px;
  border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.68);
  backdrop-filter:blur(24px);
}

.chat-header-info{
  min-width:0;
}

.chat-header-info b{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.chat-messages{
  flex:1;
  min-height:0;
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:6px;
  padding:20px;
}

.message{
  align-self:flex-start;
  max-width:min(66%,480px);
}

.message.mine{
  align-self:flex-end;
}

.bubble{
  padding:8px 13px;
  font-size:15px;
  line-height:1.38;
  border-radius:19px 19px 19px 5px;
  background:#fff;
  border:1px solid rgba(15,23,42,.06);
  box-shadow:
    0 3px 10px rgba(15,23,42,.045);
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.bubble.image-bubble{
  padding:4px;
  overflow:hidden;
}

.bubble.image-bubble img{
  display:block;
  width:100%;
  max-width:280px;
  max-height:340px;
  object-fit:cover;
  border-radius:15px;
  cursor:zoom-in;
}

.message.mine .bubble{
  color:#fff;
  border:0;
  border-radius:
    19px 19px 5px 19px;
  background:
    linear-gradient(
      145deg,
      #168fff,
      #0071e3
    );
}

.message-meta{
  margin:3px 8px 0;
  color:var(--muted);
  font-size:10px;
}

.message.mine .message-meta{
  text-align:right;
}

.chat-input{
  flex:0 0 auto;
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding:
    12px;
  padding-bottom:
    max(
      12px,
      env(safe-area-inset-bottom)
    );
  border-top:1px solid var(--line);
  background:rgba(255,255,255,.8);
  backdrop-filter:blur(25px);
}

.icon-btn{
  flex:0 0 auto;
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  border:1px solid var(--line);
  border-radius:50%;
  background:#fff;
  color:#667085;
}

.icon-btn:hover{
  color:#0066d6;
  border-color:rgba(0,122,255,.35);
}

.chat-input textarea{
  flex:1;
  height:42px;
  max-height:120px;
  resize:none;
  border:1px solid var(--line);
  outline:0;
  border-radius:20px;
  padding:11px 15px;
  background:#f8fafc;
}

.chat-input .primary{
  flex:0 0 auto;
  width:42px;
  height:42px;
  padding:0;
  display:grid;
  place-items:center;
  border-radius:50%;
}

.image-preview-bar{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px 0;
}

.image-preview-bar img{
  width:52px;
  height:52px;
  object-fit:cover;
  border-radius:12px;
  border:1px solid var(--line);
}

.image-preview-bar button{
  border:0;
  background:none;
  color:#d92d20;
  font-weight:700;
  font-size:13px;
}

.mobile-back{
  display:none;
  border:0;
  background:none;
  color:#111;
  padding:0;
  width:30px;
  height:30px;
  display:none;
  place-items:center;
}

/* PROFILE */

.profile-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.profile-head{
  display:flex;
  align-items:center;
  gap:16px;
  margin-bottom:18px;
}

.file-button{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:9px 12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
  cursor:pointer;
  font-size:13px;
}

.file-button input{
  display:none;
}

.mobile-nav{
  display:none;
}

/* MOBILE */

@media(max-width:800px){

  .layout{
    grid-template-columns:1fr;
  }

  .sidebar{
    display:none;
  }

  .topbar{
    height:62px;
    padding:0 17px;
  }

  .content{
    padding:
      15px
      15px
      calc(var(--nav) + 18px);
  }

  .grid,
  .profile-grid{
    grid-template-columns:1fr;
  }

  .quick-grid{
    grid-template-columns:1fr;
  }

  .home-hero{
    padding:22px;
  }

  .home-orb{
    width:105px;
    height:105px;
  }

  .mobile-nav{
    position:fixed;
    z-index:100;
    left:0;
    right:0;
    bottom:0;
    height:var(--nav);
    display:grid;
    grid-template-columns:
      repeat(4,1fr);
    padding-bottom:
      env(safe-area-inset-bottom);
    background:rgba(255,255,255,.9);
    border-top:1px solid var(--line);
    backdrop-filter:blur(25px);
  }

  .mobile-nav button{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    border:0;
    background:none;
    color:#667085;
    font-size:11px;
  }

  .mobile-nav button.active{
    color:#007aff;
  }

  .mobile-nav .badge{
    right:calc(50% - 20px);
    top:2px;
  }

  .chat-shell{
    height:
      calc(
        100dvh - 62px
      );
    display:block;
  }

  .chat-list{
    height:100%;
    border:0;
    padding-bottom:
      calc(
        var(--nav) + 10px
      );
  }

  .chat-window{
    display:none;
    height:
      calc(
        100dvh -
        62px -
        var(--nav)
      );
    min-height:0;
  }

  .chat-shell.show-chat
  .chat-list{
    display:none;
  }

  .chat-shell.show-chat
  .chat-window{
    display:flex;
  }

  .mobile-back{
    display:grid;
  }

  .message{
    max-width:84%;
  }

  .chat-messages{
    padding:
      15px 12px;
  }

  .chat-input{
    padding:
      9px 10px 10px;
  }

  .chat-input textarea{
    height:40px;
  }

  .user-row{
    flex-wrap:wrap;
  }

  .user-actions{
    width:100%;
  }

  .user-actions button{
    flex:1;
  }

  .hero h1{
    font-size:43px;
  }

  .hero p{
    font-size:16px;
  }
}
</style>
</head>

<body>

<div id="app"></div>
<div id="toast" class="toast hidden"></div>
<input id="hiddenImageInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif" class="hidden">

<script>

/* =====================================================
   ICONS  (inline, stroke-based — no external requests)
===================================================== */

const ICONS = {

  home:
    `<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9"/></svg>`,

  search:
    `<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.8-4.8"/></svg>`,

  friends:

const $ =

    );

function esc(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    char => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[char])
  );

}

function initials(profile){

  return esc(
    (
      profile?.display_name ||
      profile?.username ||
      "?"
    )
    .trim()
    .charAt(0)
    .toUpperCase()
  );

}

function avatar(
  profile,
  className="avatar"
){

  if(
    profile?.avatar_url
  ){

    return `
      <div class="${className}">
        <img
          src="${esc(
            profile.avatar_url
          )}"
          alt="">
      </div>
    `;

  }

  return `
    <div class="${className}">
      ${initials(profile)}
    </div>
  `;

}

function totalUnread(){

  return Object.values(
    state.unreadByConversation
  ).reduce(
    (sum, count) => sum + count,

  );

}

function ago(date){

  if(!date)
    return "";

  const seconds =
    Math.floor(
      (
        Date.now() -
        new Date(date).getTime()
      ) / 1000
    );

  if(seconds < 60)
    return "just now";

  if(seconds < 3600)
    return (
      Math.floor(
        seconds / 60
      ) + "m ago"
    );

  if(seconds < 86400)
    return (
      Math.floor(
        seconds / 3600
      ) + "h ago"
    );

  return (
    Math.floor(
      seconds / 86400
    ) + "d ago"
  );

}

function clock(date){

  return new Date(
    date
  ).toLocaleTimeString(
    [],
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}

function toast(
  message,
  type="",
  onClick=null
){

  const element =
    $("#toast");

  element.innerHTML =
    `<span>${esc(message)}</span>`;

  element.className =
    "toast " + type;

  element.onclick =
    onClick;

  clearTimeout(
    window._toast
  );

  window._toast =
    setTimeout(
      () =>
        element.classList.add(
          "hidden"
        ),
      3500
    );

}

function friendlyError(error){

  const message =
    error?.message ||
    String(
      error ||
      "Something went wrong."
    );

  if(
    /duplicate|unique/i
      .test(message)
  ){

    return "That username is already taken.";

  }

  if(
    /row-level|permission denied/i
      .test(message)
  ){

    return "Supabase security rules rejected this action.";

  }

  if(
    /blocked/i.test(message)
  ){

    return "This user is blocked.";

  }

  return message;

}

/* =====================================================
   AUTH
===================================================== */

async function doAuth(
  event,
  mode
){

  event.preventDefault();

  const username =
    $("#username")
      .value
      .trim()
      .toLowerCase();

  const password =
    $("#password")
      .value;

  const errorBox =
    $("#authError");

  const button =
    $("#authBtn");

  errorBox.textContent =
    "";

  if(
    !/^[a-z0-9_.]{3,20}$/
      .test(username)
  ){

    errorBox.textContent =
      "Username must be 3–20 characters using letters, numbers, underscores or periods.";

    return;

  }

  if(
    password.length < 8
  ){

    errorBox.textContent =
      "Password must contain at least 8 characters.";

    return;

  }

  button.disabled =
    true;

  button.textContent =
    "Please wait…";

  try{

    if(
      mode === "register"
    ){

      const {
        data:available,
        error:validateError
      } =
        await db.rpc(
          "validate_username",
          {
            requested_username:
              username
          }
        );

      if(validateError)
        throw validateError;

      if(!available){

        throw new Error(
          "Username is already taken or unavailable."
        );

      }

      const {
        data,
        error
      } =
        await db.auth.signUp({

          email:
            authEmail(
              username
            ),

          password,

          options:{
            data:{
              username
            }
          }

        });

      if(error)
        throw error;

      if(!data.session){

        throw new Error(
          "Account created, but email confirmation is enabled. Disable Confirm email in Supabase Authentication settings."
        );

      }

      await start(
        data.session
      );

    }else{

      const {
        data,
        error
      } =
        await db.auth
          .signInWithPassword({

            email:
              authEmail(
                username
              ),

            password

          });

      if(error)
        throw error;

      await start(
        data.session
      );

    }

  }catch(error){

    console.error(
      "AUTH ERROR:",
      error
    );

    errorBox.textContent =
      friendlyError(
        error
      );

  }finally{

    button.disabled =
      false;

    button.textContent =
      mode === "login"
      ? "Login"
      : "Create Account";

  }

}

/* =====================================================
   CHATS
===================================================== */

async function loadChats(){

  const memberships =
    await db
      .from("conversation_members")
      .select(
        "conversation_id,user_id"
      )
      .eq(
        "user_id",
        state.user.id
      );

  if(memberships.error){

    state.chats =
      [];

    return;

  }

  const conversationIds =
    (memberships.data || [])
      .map(
        row =>
          row.conversation_id
      );

  if(!conversationIds.length){

    state.chats =
      [];

    return;

  }

  const members =
    await db
      .from("conversation_members")
      .select(
        "conversation_id,user_id"
      )
      .in(
        "conversation_id",
        conversationIds
      );

  if(members.error){

    state.chats =
      [];

    return;

  }

  const otherIds =
    [
      ...new Set(
        (members.data || [])
          .filter(
            row =>
              row.user_id !==
              state.user.id
          )
          .map(
            row =>
              row.user_id
          )
      )
    ];

  if(!otherIds.length){

    state.chats =
      [];

    return;

  }

  const profiles =
    await db
      .from("profiles")
      .select("*")
      .in(
        "id",
        otherIds
      );

  if(profiles.error){

    state.chats =
      [];

    return;

  }

  const profileMap =
    new Map(
      (profiles.data || [])
        .map(
          profile =>
            [
              profile.id,
              profile
            ]
        )
    );

  state.chats =
    conversationIds
      .map(
        conversationId => {

          const member =
            (members.data || [])
              .find(
                row =>
                  row.conversation_id ===
                    conversationId &&
                  row.user_id !==
                    state.user.id
              );

          if(!member)
            return null;

          const profile =
            profileMap.get(
              member.user_id
            );

          if(!profile)
            return null;

          return {

            conversation_id:
              conversationId,

            profile

          };

        }
      )
      .filter(Boolean);

}


/* =====================================================
   UNREAD MESSAGE COUNTS
===================================================== */

async function loadUnreadCounts(){

  const conversationIds =
    state.chats.map(
      chat =>
        chat.conversation_id
    );

  if(!conversationIds.length){

    state.unreadByConversation =
      {};

    return;

  }

  const result =
    await db
      .from("messages")
      .select(
        "conversation_id"
      )
      .in(
        "conversation_id",
        conversationIds
      )
      .neq(
        "sender_id",
        state.user.id
      )
      .is(
        "read_at",
        null
      );

  if(result.error){

    return;

  }

  const counts = {};

  (result.data || []).forEach(
    row => {

      counts[row.conversation_id] =
        (
          counts[row.conversation_id] ||
          0
        ) + 1;

    }
  );

  state.unreadByConversation =
    counts;

}

async function markConversationRead(
  conversationId
){

  if(!conversationId)
    return;

  await db
    .from("messages")
    .update({
      read_at:
        new Date().toISOString()
    })
    .eq(
      "conversation_id",
      conversationId
    )
    .neq(
      "sender_id",
      state.user.id
    )
    .is(
      "read_at",
      null
    );

  delete state.unreadByConversation[
    conversationId
  ];

}


/* =====================================================
   REALTIME
===================================================== */

function subscribe(){

  if(state.messageChannel){

    db.removeChannel(
      state.messageChannel
    );

  }

  if(state.requestChannel){

    db.removeChannel(
      state.requestChannel
    );

  }

  state.messageChannel =
    db
      .channel(
        "messages-" +
        state.user.id
      )
      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"messages"
        },
        async payload => {

          const incoming =
            payload.new;

          const isActive =
            state.activeConversation &&
            incoming?.conversation_id ===
            state.activeConversation;

          if(isActive){

            await markConversationRead(
              state.activeConversation
            );

            await loadMessages(
              true
            );

          }

          await loadChats();

          await loadUnreadCounts();

          if(
            payload.eventType ===
              "INSERT" &&
            incoming?.sender_id !==
              state.user.id &&
            !isActive
          ){

            notifyNewMessage(
              incoming
            );

          }

          if(
            state.page ===
              "messages" ||
            state.page ===
              "home"
          ){

            render();

          }else{

            renderNavBadges();

          }

        }
      )
      .subscribe();


  state.requestChannel =
    db
      .channel(
        "requests-" +
        state.user.id
      )
      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"friend_requests"
        },
        async () => {

          await loadData();

          render();

        }
      )
      .subscribe();

}

function notifyNewMessage(
  message
){

  const chat =
    state.chats.find(
      item =>
        item.conversation_id ===
        message.conversation_id
    );

  const name =
    chat
    ? (
        chat.profile.display_name ||
        chat.profile.username
      )
    : "Someone";

  const preview =
    message.image_url
    ? "📷 Sent a photo"
    : (
        message.message ||
        ""
      ).slice(0, 60);

  toast(
    `${name}: ${preview}`,
    "success",
    () => {

      if(chat){

        chatWithFriend(
          chat.profile.id
        );

      }

    }
  );

}

async function doSearch(){

  const query =
    $("#searchInput")
      .value
      .trim()
      .toLowerCase();

  const box =
    $("#results");

  if(!query){

    box.innerHTML = `

      <div class="empty">
        Enter a username.
      </div>

    `;

    return;

  }

  box.innerHTML = `

    <div class="empty">
      Searching…
    </div>

  `;

  const result =
    await db
      .from("profiles")
      .select("*")
      .ilike(
        "username",
        `%${query}%`
      )
      .neq(
        "id",
        state.user.id
      )
      .limit(30);

  if(result.error){

    box.innerHTML = `

      <div class="empty">

        ${esc(
          friendlyError(
            result.error
          )
        )}

      </div>

    `;

    return;

  }

  if(
    !result.data?.length
  ){

    box.innerHTML = `

      <div class="empty">
        No users found.
      </div>

    `;

    return;

  }

  box.innerHTML =
    result.data
      .map(
        userRow
      )
      .join("");

}

===================================================== */

async function sendRequest(
  userId
){

  try{

    const result =
      await db.rpc(
        "send_friend_request",
        {
          target_user:
            userId
        }
      );

    if(result.error)
      throw result.error;

    await loadData();

    toast(
      "Friend request sent.",
      "success"
    );

    if(
      state.page ===
      "search"
    ){

      await doSearch();

    }

  }catch(error){

    toast(
      friendlyError(
        error
      ),
      "error"
    );

  }

}

async function cancelRequest(
  requestId
){

  const result =
    await db
      .from("friend_requests")
      .delete()
      .eq(
        "id",
        requestId
      )
      .eq(
        "sender_id",
        state.user.id
      );

  if(result.error){

    toast(
      friendlyError(
        result.error
      ),
      "error"
    );

    return;

  }

  await loadData();

  render();

}

async function acceptRequest(
  requestId
){

  try{

    const result =
      await db.rpc(
        "accept_friend_request",
        {
          request_uuid:
            requestId
        }
      );

    if(result.error)
      throw result.error;

    await loadData();

    toast(
      "Friend request accepted.",
      "success"
    );

    render();

  }catch(error){

    toast(
      friendlyError(
        error
      ),
      "error"
    );

  }

}

async function rejectRequest(
  requestId
){

  const result =
    await db
      .from("friend_requests")
      .update({
        status:"rejected"
      })
      .eq(
        "id",
        requestId
      )
      .eq(
        "receiver_id",
        state.user.id
      );

  if(result.error){

    toast(
      friendlyError(
        result.error
      ),
      "error"
    );

    return;

  }

  await loadData();

  render();

}

===================================================== */

async function chatWithFriend(
  userId
){

  const friend =
    state.friends
      .find(
        item =>
          item.id ===
          userId
      );

  if(!friend){

    toast(
      "This user is no longer in your friends list.",
      "error"
    );

    return;

  }

  state.activeChat =
    userId;

  state.activeChatProfile =
    friend;

  state.activeConversation =
    null;

  state.pendingImage =
    null;

  state.page =
    "messages";

  render();

  try{

    const result =
      await db.rpc(
        "create_private_conversation",
        {
          other_user:
            userId
        }
      );

    if(result.error)
      throw result.error;

    if(!result.data){

      throw new Error(
        "Supabase did not return a conversation ID."
      );

    }

    state.activeConversation =
      result.data;

    await loadChats();

    await markConversationRead(
      state.activeConversation
    );

    render();

    await loadMessages(
      true
    );

  }catch(error){

    console.error(
      "CHAT ERROR:",
      error
    );

    state.activeChat =
      null;

    state.activeConversation =
      null;

    state.activeChatProfile =
      null;

    render();

    toast(
      friendlyError(
        error
      ),
      "error"
    );

  }

}

function openChat(
  userId
){

  return chatWithFriend(
    userId
  );

}

async function loadMessages(

){

  if(
    !state.activeConversation

  const box =
    $("#chatMessages");

  if(!box)
    return;

  const result =
    await db
      .from("messages")
      .select("*")
      .eq(
        "conversation_id",
        state.activeConversation
      )
      .order(
        "created_at",
        {
          ascending:true
        }
      );

  if(result.error){

    box.innerHTML = `

      <div class="empty">

        Unable to load messages.

        <br>

        <span class="small">

          ${esc(
            friendlyError(
              result.error
            )
          )}

    return;

  }

  if(
    !result.data?.length
  ){

    box.innerHTML = `

      <div
        class="empty"

        <div
          style="font-size:40px">

          👋

        </div>

        <b>
          Start the conversation
        </b>

        <p>
          Send your first message.
        </p>

      </div>

    `;

  }else{

    box.innerHTML =
      result.data
        .map(
          message => {

            const mine =
              message.sender_id ===
              state.user.id;

            const bubbleContent =
              message.deleted_at
              ?
              "<i>Message deleted</i>"
              :
              message.image_url
              ?
              `
                <img
                  src="${esc(
                    message.image_url
                  )}"
                  alt="Photo"
                  onclick="
                    window.open(
                      '${esc(
                        message.image_url
                      )}',
                      '_blank'
                    )
                  ">
              `
              :
              esc(
                message.message
              );

            return `

              <div
                class="
                  message
                  ${
                    mine
                    ? "mine"
                    : ""
                  }
                ">

                <div
                  class="
                    bubble
                    ${
                      message.image_url &&
                      !message.deleted_at
                      ? "image-bubble"
                      : ""
                    }
                  ">

                  ${bubbleContent}

                </div>

                <div
                  class="message-meta">

                  ${clock(
                    message.created_at
                  )}

                  ${
                    mine
                    ?
                    (
                      message.read_at
                      ?
                      " · Read"
                      :
                      " · Sent"
                    )
                    :
                    ""
                  }

                </div>

              </div>

            `;

          }
        )
        .join("");

  }

  if(scroll){

    box.scrollTop =
      box.scrollHeight;

  }

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(
  event
){

  event.preventDefault();

  const input =
    $("#chatInput");

  const text =
    input?.value.trim();

  if(
    !state.activeConversation
  )
    return;

  if(
    !text &&
    !state.pendingImage
  )
    return;

  input.disabled =
    true;

  try{

    let imageUrl =
      null;

    if(
      state.pendingImage
    ){

      imageUrl =
        await uploadChatImage(
          state.pendingImage
        );

    }

    const result =
      await db
        .from("messages")
        .insert({

          conversation_id:
            state.activeConversation,

          sender_id:
            state.user.id,

          message:
            text || null,

          image_url:
            imageUrl

        });

    if(result.error)
      throw result.error;

    input.value =
      "";

    clearPendingImage();

    await loadMessages(
      true
    );

  }catch(error){

    console.error(
      "SEND MESSAGE:",
      error
    );

    toast(
      friendlyError(
        error
      ),
      "error"
    );

  }finally{

    input.disabled =
      false;

    input.focus();

  }

}

function closeChat(){

  state.activeChat =
    null;

  state.activeConversation =
    null;

  state.activeChatProfile =
    null;

  clearPendingImage();

  render();

}


/* =====================================================
   IMAGE MESSAGES
===================================================== */

function onImagePicked(
  event
){

  const file =
    event.target.files[0];

  event.target.value =
    "";

  if(!file)
    return;

  if(
    !file.type.startsWith(
      "image/"
    )
  ){

    toast(
      "Please choose an image file.",
      "error"
    );

    return;

  }

  if(
    file.size >
    8 * 1024 * 1024
  ){

    toast(
      "Images must be smaller than 8 MB.",
      "error"
    );

    return;

  }

  state.pendingImage =
    file;

  const bar =
    $("#imagePreviewBar");

  if(!bar)
    return;

  bar.classList.remove(
    "hidden"
  );

  bar.innerHTML = `

    <img
      src="${
        URL.createObjectURL(
          file
        )
      }"
      alt="">

    <span class="small muted" style="flex:1">
      ${esc(file.name)}
    </span>

    <button
      type="button"
      onclick="
        clearPendingImage()
      ">

      Remove

    </button>

  `;

}

function clearPendingImage(){

  state.pendingImage =
    null;

  const bar =
    $("#imagePreviewBar");

  if(bar){

    bar.classList.add(
      "hidden"
    );

    bar.innerHTML =
      "";

  }

}

async function uploadChatImage(
  file
){

  const extension =
    (
      file.name
        .split(".")
        .pop() ||
      "jpg"
    ).toLowerCase();

  const path =
    `${state.activeConversation}/${
      Date.now()
    }.${extension}`;

  const upload =
    await db
      .storage
      .from("chat-images")
      .upload(
        path,
        file,
        {
          upsert:false,
          contentType:
            file.type
        }
      );

  if(upload.error)
    throw upload.error;

  return db
    .storage
    .from("chat-images")
    .getPublicUrl(
      path
    )
    .data
    .publicUrl;

}

async function saveProfile(
  event
){

  event.preventDefault();

  const result =
    await db
      .from("profiles")
      .update({

        display_name:
          $("#displayName")
            .value
            .trim(),

        bio:
          $("#bio")
            .value
            .trim()

      })
      .eq(
        "id",
        state.user.id
      )
      .select()
      .single();

  if(result.error){

    toast(
      friendlyError(
        result.error
      ),
      "error"
    );

    return;

  }

  state.profile =
    result.data;

  toast(
    "Profile updated.",
    "success"
  );

  render();

}

async function uploadAvatar(
  event
){

  const file =
    event.target.files[0];

  if(!file)
    return;

  if(
    file.size >
    2 * 1024 * 1024
  ){

    toast(
      "Avatar must be smaller than 2 MB.",
      "error"
    );

    return;

  }

  const extension =
    (
      file.name
        .split(".")
        .pop() ||
      "jpg"
    ).toLowerCase();

  const path =
    `${state.user.id}/avatar.${extension}`;

  const upload =
    await db
      .storage
      .from("avatars")
      .upload(
        path,
        file,
        {
          upsert:true,
          contentType:
            file.type
        }
      );

  if(upload.error){

    toast(
      friendlyError(
        upload.error
      ),
      "error"
    );

    return;

  }

  const publicUrl =
    db
      .storage
      .from("avatars")
      .getPublicUrl(
        path
      )
      .data
      .publicUrl +
    "?v=" +
    Date.now();

  const result =
    await db
      .from("profiles")
      .update({
        avatar_url:
          publicUrl
      })
      .eq(
        "id",
        state.user.id
      )
      .select()
      .single();

  if(result.error){

    toast(
      friendlyError(
        result.error
      ),
      "error"
    );

    return;

  }

  state.profile =
    result.data;

  toast(
    "Avatar updated.",
    "success"
  );

  render();

}


/* =====================================================
   SETTINGS
===================================================== */

        notification =>
          !notification.is_read

  return `

    <div class="content">

      <div class="grid">

async function markRead(){

      .from("notifications")
      .update({

        state.user.id
      )

        false
      );

  if(result.error){

    toast(
      friendlyError(
        result.error
      ),

    );

  }

}


/* =====================================================
   PUBLIC PROFILE
===================================================== */

async function viewUser(
  userId
){

  const result =
    await db
      .from("profiles")
      .select("*")
      .eq(
        "id",
        userId
      )
      .single();

  if(result.error){

    toast(
      friendlyError(
        result.error
      ),
      "error"
    );

    return;

  }

  const profile =
    result.data;

  const modal =
    document.createElement(
      "div"
    );

  modal.className =
    "profile-modal";

  modal.style.cssText = `
    position:fixed;
    inset:0;
    z-index:500;
    display:grid;
    place-items:center;
    padding:20px;
    background:rgba(0,0,0,.42);
    backdrop-filter:blur(12px);
  `;

  const isFriend =
    state.friends.some(
      friend =>
        friend.id ===
        userId

  modal.innerHTML = `

    <div
      class="card"
      style="
        width:min(430px,100%);
        padding:22px;
      ">

      <div
        style="
          display:flex;
          gap:15px;
          align-items:center;
        ">

        ${avatar(
          profile,
          "big-avatar"
        )}

        <div>

          <h3
            style="margin:0">

            ${esc(
              profile.display_name ||
              profile.username
            )}

          </h3>

          <div class="muted">

            @${esc(
              profile.username
            )}

          </div>

          <div
            class="status ${
              profile.online_status
              ? "online"
              : ""
            }">

            ${
              profile.online_status
              ? "Online"
              : "Offline"
            }

          </div>

        </div>

      </div>

      <p
        class="muted"
        style="margin:20px 0">

        ${esc(
          profile.bio ||
          "No bio yet."
        )}

      </p>

      <div class="user-actions">

        <button
          class="secondary"

            this.closest(
              '.profile-modal'

          isFriend

          `

              class="primary"

                this.closest(
                  '.profile-modal'
                ).remove();

                );

          `
          :
          `
            <button
              class="primary"

              Add Friend

        }

    </div>

  document.body.appendChild(
    modal
  );

}


/* =====================================================
   EVENTS
===================================================== */

function bind(){

  const hiddenImageInput =
    $("#hiddenImageInput");

  if(
    hiddenImageInput &&
    !hiddenImageInput.dataset.bound
  ){

    hiddenImageInput.dataset.bound =
      "1";

    hiddenImageInput.onchange =
      onImagePicked;

  }

  if(
    state.page ===
    "search"
  ){

    const button =
      $("#searchBtn");

    const input =
      $("#searchInput");

    if(button){

      button.onclick =
        doSearch;

    }

    if(input){

      input.onkeydown =
        event => {

          if(
            event.key ===
            "Enter"
          ){

            event.preventDefault();

            doSearch();

          }

        };

    }

  }


  if(
    state.page ===
    "messages"
  ){

    const form =
      $("#chatForm");

    const input =
      $("#chatInput");

    if(form){

      form.onsubmit =
        sendMessage;

    }

    if(input){

      input.onkeydown =
        event => {

          if(
            event.key ===
              "Enter" &&
            !event.shiftKey
          ){

            event.preventDefault();

            sendMessage(
              event
            );

          }

        };

    }

    if(
      state.activeConversation
    ){

      loadMessages(
        false
      );

    }

  }


  if(
    state.page ===
    "profile"
  ){

    const form =
      $("#profileForm");

    const avatarInput =
      $("#avatarInput");

    if(form){

      form.onsubmit =
        saveProfile;

    }

    if(avatarInput){

      avatarInput.onchange =
        uploadAvatar;

    }

  }

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

  try{

    await presence(
      false
    );

  }catch(error){

    console.warn(
      error
    );

  }

  if(
    state.messageChannel
  ){

    db.removeChannel(
      state.messageChannel
    );

  }

  if(
    state.requestChannel
  ){

    db.removeChannel(
      state.requestChannel
    );

  }

  await db.auth
    .signOut();

  state.session =
    null;

  state.user =
    null;

  state.profile =
    null;

  landing();

}


/* =====================================================
   AUTH STATE
===================================================== */

db.auth
  .onAuthStateChange(
    (
      event,
      session
    ) => {

      if(
        event ===
        "SIGNED_OUT"
      ){

        state.session =
          null;

        state.user =
          null;

        state.profile =
          null;

        landing();

      }

    }
  );


/* =====================================================
   PRESENCE
===================================================== */

document.addEventListener(
  "visibilitychange",
  () => {

    if(
      state.user &&
      document.visibilityState ===
      "visible"
    ){

      presence(
        true
      );

    }

  }
);

window.addEventListener(
  "beforeunload",
  () => {

    if(state.user){

      presence(
        false
      );

    }

  }
);


/* =====================================================
   BOOT
===================================================== */

async function boot(){

  try{

    const result =
      await db.auth
        .getSession();

    if(result.error)
      throw result.error;

    if(
      result.data.session
    ){

      await start(
        result.data.session
      );

    }else{

      landing();

    }

  }catch(error){

    console.error(
      "BOOT ERROR:",
      error
    );

    landing();

    toast(
      friendlyError(
        error
      ),
      "error"
    );

  }

}

boot();

</script>
