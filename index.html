<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connect</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:#f5f6fa;
  color:#17181c
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.auth{

  align-items:center;

.authbox{

.logo{

.muted{color:#737780}
.small{font-size:13px}

.field{margin:17px 0}
label{

input,textarea{

}

.sidebar{

<body>

<div id="root"></div>

<script>

/* =====================================================
   SUPABASE
   ===================================================== */

const SUPABASE_URL =
"https://xyighgzwwpgzwmcxzbgh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_RLtmcNI7JAzOqsV2LcbXkQ_eYcsWEqN";

const supabase =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================================
   STATE
   ===================================================== */

let currentUser = null;
let profile = null;
let page = "home";
let friends = [];
let requests = [];
let searchResults = [];
let conversations = [];
let activeChat = null;
let messages = [];
let realtimeChannel = null;


/* =====================================================
   HELPERS
   ===================================================== */

function $(id){
  return document.getElementById(id);
}

function esc(value){
  return String(value ?? "").replace(
    /[&<>"']/g,
    x => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[x])
  );
}

function authEmail(username){
  return username.toLowerCase()+"@username.local";
}

function initials(name){
  return (name || "?")
    .trim()
    .substring(0,2)
    .toUpperCase();
}

function avatar(p,size=""){
  if(p?.avatar_url){
    return `
      <div class="avatar ${size}">
        <img src="${esc(p.avatar_url)}">
      </div>
    `;
  }

  return `
    <div class="avatar ${size}">
      ${esc(initials(p?.display_name || p?.username))}
    </div>
  `;
}

function time(date){
  return new Date(date).toLocaleString([],{
    month:"short",
    day:"numeric",
    hour:"numeric",
    minute:"2-digit"
  });
}

function notify(message){

  alert(message);
}


/* =====================================================
   AUTHENTICATION
   ===================================================== */

function renderAuth(){

  $("root").innerHTML = `

    <div class="auth">

      <div class="authbox">

        <div class="logo">
          con<span>nect</span>
        </div>

        <div id="authContent"></div>

      </div>

    </div>
  `;

  showLogin();
}


function showLogin(){

  $("authContent").innerHTML = `

    <h1>Welcome back</h1>

    <p class="muted">
      Log in using your username and password.
    </p>

    <form id="loginForm">

      <div class="field">

        <label>Username</label>

        <input
          id="loginUsername"
          required
          minlength="3"
          maxlength="20"
          autocomplete="username"
        >

      </div>

      <div class="field">

        <label>Password</label>

        <input
          id="loginPassword"
          type="password"
          required
          autocomplete="current-password"
        >

      </div>

      <div id="loginError"></div>

      <button class="primary">
        Login
      </button>

    </form>

    <p class="small muted">
      Don't have an account?

      <button
        class="link"
        onclick="showRegister()"
      >
        Create Account
      </button>

    </p>
  `;


  $("loginForm").onsubmit =
    login;
}


function showRegister(){

  $("authContent").innerHTML = `

    <h1>Create account</h1>

    <p class="muted">
      Create your username and start connecting.
    </p>

    <form id="registerForm">

      <div class="field">

        <label>Username</label>

        <input
          id="registerUsername"
          required
          minlength="3"
          maxlength="20"
          pattern="[A-Za-z0-9_.]+"
          autocomplete="username"
        >

      </div>

      <div class="field">

        <label>Password</label>

        <input
          id="registerPassword"
          type="password"
          required
          minlength="8"
          autocomplete="new-password"
        >

      </div>

      <div class="field">

        <label>Confirm password</label>

        <input
          id="registerConfirm"
          type="password"
          required
          minlength="8"
          autocomplete="new-password"
        >

      </div>

      <div id="registerError"></div>

      <button class="primary">
        Create Account
      </button>

    </form>

    <p class="small muted">
      Already have an account?

      <button
        class="link"
        onclick="showLogin()"
      >
        Login
      </button>

    </p>
  `;


  $("registerForm").onsubmit =
    register;
}


/* =====================================================
   REGISTER
   ===================================================== */

async function register(event){

  event.preventDefault();

  const username =
    $("registerUsername").value.trim();

  const password =
    $("registerPassword").value;

  const confirm =
    $("registerConfirm").value;

  const errorBox =
    $("registerError");


  if(!/^[A-Za-z0-9_.]{3,20}$/.test(username)){

    errorBox.innerHTML =
      `<div class="error">
        Username must contain 3–20 letters, numbers, _ or .
      </div>`;

    return;
  }


  if(password.length < 8){

    errorBox.innerHTML =
      `<div class="error">
        Password must contain at least 8 characters.
      </div>`;

    return;
  }


  if(password !== confirm){

    errorBox.innerHTML =
      `<div class="error">
        Passwords do not match.
      </div>`;

    return;
  }


  const normalized =
    username.toLowerCase();


  /* Check username */

  const {
    data:existing,
    error:checkError
  } =
  await supabase
    .from("profiles")
    .select("id")
    .eq(
      "username_normalized",
      normalized
    )
    .maybeSingle();


  if(checkError){

    errorBox.innerHTML =
      `<div class="error">
        ${esc(checkError.message)}
      </div>`;

    return;
  }


  if(existing){

    errorBox.innerHTML =
      `<div class="error">
        Username is already taken.
      </div>`;

    return;
  }


  /*
    Supabase Auth handles the password.
    We do NOT store the password ourselves.
  */

  const {
    data,
    error
  } =
  await supabase.auth.signUp({

    email:
      authEmail(normalized),

    password,

    options:{
      data:{
        username,
        display_name:username
      }
    }

  });


  if(error){

    errorBox.innerHTML =
      `<div class="error">
        ${esc(error.message)}
      </div>`;

    return;
  }


  if(!data.user){

    errorBox.innerHTML =
      `<div class="error">
        Account creation did not return a user.
      </div>`;

    return;
  }


  /*
    The database trigger should now create
    the public.profiles record.
  */

  await new Promise(
    resolve => setTimeout(resolve,800)
  );


  await loadUser();


  if(currentUser){

    renderApp();

  }else{

    errorBox.innerHTML =
      `<div class="error">
        Account created. Please log in.
      </div>`;

    showLogin();
  }
}


/* =====================================================
   LOGIN
   ===================================================== */

async function login(event){

  event.preventDefault();

  const username =
    $("loginUsername").value.trim();

  const password =
    $("loginPassword").value;

  const errorBox =
    $("loginError");


  const {
    data,
    error
  } =
  await supabase.auth.signInWithPassword({

    email:
      authEmail(username),

    password

  });


  if(error){

    errorBox.innerHTML =
      `<div class="error">
        Invalid username or password.
      </div>`;

    return;
  }


  currentUser =
    data.user;

  await loadProfile();

  await loadAll();

  renderApp();
}


/* =====================================================
   LOAD USER
   ===================================================== */

async function loadUser(){

  const {
    data
  } =
  await supabase.auth.getSession();


  currentUser =
    data.session?.user || null;


  if(currentUser){

    await loadProfile();

    await loadAll();
  }
}


async function loadProfile(){

  const {
    data,
    error
  } =
  await supabase
    .from("profiles")
    .select("*")
    .eq(
      "id",
      currentUser.id
    )
    .single();


  if(error){

    console.error(error);

    profile = null;

    return;
  }


  profile = data;
}


/* =====================================================
   LOAD DATA
   ===================================================== */

async function loadAll(){

  await Promise.all([

    loadFriends(),

    loadRequests(),

    loadConversations()

  ]);
}


async function loadFriends(){

  const {
    data
  } =
  await supabase
    .from("friendships")
    .select(
      "friend_id,profiles:friend_id(*)"
    )
    .eq(
      "user_id",
      currentUser.id
    );


  friends =
    (data || [])
      .map(x=>x.profiles)
      .filter(Boolean);
}


async function loadRequests(){

  const {
    data
  } =
  await supabase
    .from("friend_requests")
    .select(
      "*,sender:sender_id(*),receiver:receiver_id(*)"
    )
    .eq(
      "status",
      "pending"
    )
    .or(
      `sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`
    )
    .order(
      "created_at",
      {ascending:false}
    );


  requests =
    data || [];
}


async function loadConversations(){

  const {
    data:members
  } =
  await supabase
    .from("conversation_members")
    .select(
      "conversation_id"
    )
    .eq(
      "user_id",
      currentUser.id
    );


  const ids =
    (members || [])
      .map(x=>x.conversation_id);


  conversations=[];


  for(const id of ids){

    const {
      data:other
    } =
    await supabase
      .from("conversation_members")
      .select(
        "user_id,profiles:user_id(*)"
      )
      .eq(
        "conversation_id",
        id
      )
      .neq(
        "user_id",
        currentUser.id
      )
      .limit(1)
      .maybeSingle();


    if(!other) continue;


    const {
      data:last
    } =
    await supabase
      .from("messages")
      .select("*")
      .eq(
        "conversation_id",
        id
      )
      .order(
        "created_at",
        {ascending:false}
      )
      .limit(1)
      .maybeSingle();


    conversations.push({

      id,

      friend:other.profiles,

      last:last || null

    });
  }
}


/* =====================================================
   APP
   ===================================================== */

function renderApp(){

  if(!currentUser){

    renderAuth();

    return;
  }


  $("root").innerHTML = `

    <div class="app">

          <button

          </button>

        </div>


        <button

        </button>

      </aside>


      <main class="main">

        <header class="top">

          <h3>
            ${
              page==="home"?"Home":
              page==="search"?"Search":
              page==="friends"?"Friends":
              page==="messages"?"Messages":
              "Settings"
            }
          </h3>

          ${avatar(profile)}

        </header>


        <div class="content">

        </div>

      </main>

    </div>


    <nav class="mobile">

      <button onclick="navigate('home')">
        🏠<br>Home
      </button>

      <button onclick="navigate('search')">
        🔎<br>Search
      </button>

      <button onclick="navigate('friends')">
        👥<br>Friends
      </button>

      <button onclick="navigate('messages')">
        💬<br>Messages
      </button>

      <button onclick="navigate('settings')">

      </button>

    </nav>
  `;
}


/* =====================================================
   PAGES
   ===================================================== */

function pageHTML(){

  if(page==="home")
    return homeHTML();

  if(page==="search")

  if(page==="friends")

  if(page==="messages")

/* =====================================================
   HOME
   ===================================================== */

let searchValue="";


/* =====================================================
   SEARCH
   ===================================================== */

function searchHTML(){

  return `

    <section class="card">

      <h3>
        Search users
      </h3>

      <input
        id="searchInput"
        value="${esc(searchValue)}"
        placeholder="Search username..."
        oninput="performSearch(this.value)"
      >

      <div
        id="searchResults"
        class="list"
      >
        ${
          searchResults.length
          ?
          searchResults.map(userHTML).join("")
          :
          `<div class="empty">
            Search for a username.
          </div>`
        }
      </div>

    </section>
  `;
}


let searchTimer=null;


function performSearch(value){

  searchValue=value;

  clearTimeout(searchTimer);

  searchTimer =
    setTimeout(
      async()=>{
        const q=value
          .replace(/^@/,"")
          .trim()
          .toLowerCase();

        if(!q){

          searchResults=[];

        }else{

          const {data} =
          await supabase
            .from("profiles")
            .select("*")
            .ilike(
              "username_normalized",
              q+"%"
            )
            .neq(
              "id",
              currentUser.id
            )
            .limit(20);

          searchResults=data || [];
        }

        const box=$("searchResults");

        if(box){

          box.innerHTML =
            searchResults.length
            ?
            searchResults.map(userHTML).join("")
            :
            `<div class="empty">
              No users found.
            </div>`;
        }

      },
      300
    );
}


/* =====================================================
   USER
   ===================================================== */

function userHTML(p){

  const isFriend =
    friends.some(
      f=>f.id===p.id
    );


  return `

    <div class="item">

      ${avatar(p)}

      <div class="itemmain">

        <div class="name">
          ${esc(
            p.display_name ||
            p.username
          )}
        </div>

        <div class="small muted">
          @${esc(p.username)}
        </div>

      </div>


      <div class="actions">

        ${
          isFriend
          ?
          `
            <button
              class="secondary"
              onclick="startChat('${p.id}')"
            >

/* =====================================================
   FRIEND REQUEST ACTIONS
   ===================================================== */

async function sendFriend(id){

  const {
    error
  } =
  await supabase
    .from("friend_requests")
    .insert({

      sender_id:currentUser.id,

      receiver_id:id,

      status:"pending"

    });


  if(error){

    return alert(
      error.code==="23505"
      ?
      "A request already exists."
      :
      error.message
    );
  }


  alert("Friend request sent.");

  await loadAll();

  renderApp();
}


async function acceptFriend(id){

  const {
    data:r
  } =
  await supabase
    .from("friend_requests")
    .select("*")
    .eq("id",id)
    .single();


  if(!r) return;


  await supabase
    .from("friend_requests")
    .update({
      status:"accepted"
    })
    .eq("id",id);


  await supabase
    .from("friendships")
    .insert([

      {
        user_id:r.sender_id,
        friend_id:r.receiver_id
      },

      {
        user_id:r.receiver_id,
        friend_id:r.sender_id
      }

    ]);


  await loadAll();

  renderApp();
}


async function rejectFriend(id){

  await supabase
    .from("friend_requests")
    .update({
      status:"rejected"
    })
    .eq("id",id);


  await loadAll();

  renderApp();
}


async function cancelFriend(id){

  await supabase
    .from("friend_requests")
    .update({
      status:"cancelled"
    })
    .eq("id",id);


  await loadAll();

  renderApp();
}

/* =====================================================
   START CHAT
   ===================================================== */

async function startChat(friendId){

  let conversationId=null;


  const {
    data:myMembers
  } =
  await supabase
    .from("conversation_members")
    .select("conversation_id")
    .eq(
      "user_id",
      currentUser.id
    );


  for(
    const member of
    (myMembers || [])
  ){

    const {
      data
    } =
    await supabase
      .from("conversation_members")
      .select("user_id")
      .eq(
        "conversation_id",
        member.conversation_id
      )
      .eq(
        "user_id",
        friendId
      )
      .maybeSingle();


    if(data){

      conversationId =
        member.conversation_id;

      break;
    }
  }


  if(!conversationId){

    const {
      data:c,
      error
    } =
    await supabase
      .from("conversations")
      .insert({})
      .select()
      .single();


    if(error){

      return alert(error.message);
    }


    conversationId=c.id;


    const {
      error:memberError
    } =
    await supabase
      .from("conversation_members")
      .insert([

        {
          conversation_id:c.id,
          user_id:currentUser.id
        },

        {
          conversation_id:c.id,
          user_id:friendId
        }

      ]);


    if(memberError){

      return alert(
        memberError.message
      );
    }
  }


  await loadConversations();


  await openConversation(
    conversationId
  );
}


/* =====================================================
   OPEN CONVERSATION
   ===================================================== */

async function openConversation(id){

  const conversation =
    conversations.find(
      c=>c.id===id
    );


  if(!conversation){

    /*
      Conversation may have just been
      created. Reload the conversations.
    */

    await loadConversations();
  }


  const c =
    conversations.find(
      x=>x.id===id
    );


  if(!c){

    return alert(
      "Conversation could not be opened."
    );
  }


  activeChat=c;


  const {
    data,
    error
  } =
  await supabase
    .from("messages")
    .select("*")
    .eq(
      "conversation_id",
      id
    )
    .order(
      "created_at",
      {ascending:true}
    )
    .limit(100);


  if(error){

    return alert(
      error.message
    );
  }


  messages =
    data || [];


  page="messages";


  subscribeMessages();

  renderApp();


  setTimeout(()=>{

    const form =
      $("messageForm");

    if(form){

      form.onsubmit =
        sendMessage;
    }


    scrollMessages();

  },50);
}


/* =====================================================
   SEND MESSAGE
   ===================================================== */

async function sendMessage(event){

  event.preventDefault();


  const input =
    $("messageInput");

  const text =
    input.value.trim();


  if(!text) return;


  const {
    error
  } =
  await supabase
    .from("messages")
    .insert({

      conversation_id:
        activeChat.id,

      sender_id:
        currentUser.id,

      message:text

    });


  if(error){

    return alert(
      error.message
    );
  }


  input.value="";


  await loadConversations();


  /*
    Realtime normally updates the
    message window automatically.
  */

}


/* =====================================================
   REALTIME
   ===================================================== */

function subscribeMessages(){

  if(realtimeChannel){

    supabase.removeChannel(
      realtimeChannel
    );
  }


  realtimeChannel =
    supabase
      .channel(
        "chat-"+activeChat.id
      )
      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"messages",
          filter:
            "conversation_id=eq."+activeChat.id
        },
        async payload=>{

          if(
            payload.eventType==="INSERT"
          ){

            if(
              !messages.some(
                m=>m.id===payload.new.id
              )
            ){

              messages.push(
                payload.new
              );

            }
          }


          if(
            payload.eventType==="UPDATE"
          ){

            const index =
              messages.findIndex(
                m=>m.id===payload.new.id
              );

            if(index>=0){

              messages[index]=
                payload.new;
            }
          }


          renderApp();


          setTimeout(
            scrollMessages,
            30
          );

        }
      )
      .subscribe();
}


function scrollMessages(){

  const box =
    $("messageBox");

  if(box){

    box.scrollTop =
      box.scrollHeight;
  }
}


function closeChat(){

  if(realtimeChannel){

    supabase.removeChannel(
      realtimeChannel
    );

    realtimeChannel=null;
  }


  activeChat=null;

  messages=[];

  renderApp();
}

/* =====================================================
   AUTH STATE
   ===================================================== */

supabase.auth.onAuthStateChange(
  async(event,session)=>{

    if(session?.user){

      currentUser =
        session.user;

      await loadProfile();

      await loadAll();

      renderApp();

    }else{

      currentUser=null;

      profile=null;

      renderAuth();

    }

  }
);
