<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spider-Man Welcome</title>
  <style>
    :root {
      --spidey-red: #e62429;
      --spidey-blue: #0074e4;
      --spidey-dark: #0f1015;
      --spidey-glow: rgba(230, 36, 41, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100dvh;
      background-color: var(--spidey-dark);
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(0, 116, 228, 0.15), transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(230, 36, 41, 0.12), transparent 50%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      color: #ffffff;
      overflow: hidden;
    }

    /* Floating Web Background Pattern */
    .web-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      opacity: 0.05;
      background: radial-gradient(circle, #ffffff 1px, transparent 1px);
      background-size: 30px 30px;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-top: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                  0 0 30px var(--spidey-glow);
      transform: translateY(0);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7),
                  0 0 40px var(--spidey-glow);
    }

    /* Spidey Mask Icon Container */
    .avatar-wrap {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 0 auto 1.5rem auto;
    }

    .avatar-glow {
      position: absolute;
      inset: -5px;
      background: linear-gradient(135deg, var(--spidey-red), var(--spidey-blue));
      border-radius: 50%;
      filter: blur(12px);
      opacity: 0.7;
      animation: pulse 3s infinite alternate;
    }

    .avatar-body {
      position: relative;
      width: 100%;
      height: 100%;
      background: #161822;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .avatar-body svg {
      width: 65px;
      height: 65px;
    }

    .badge {
      display: inline-block;
      padding: 0.35rem 0.9rem;
      background: rgba(230, 36, 41, 0.15);
      border: 1px solid rgba(230, 36, 41, 0.4);
      color: #ff5252;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-radius: 20px;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 0.75rem;
      background: linear-gradient(180deg, #ffffff 0%, #b0b5c0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .btn {
      width: 100%;
      padding: 0.9rem 1.5rem;
      background: linear-gradient(135deg, var(--spidey-red) 0%, #b31217 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(230, 36, 41, 0.35);
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
    }

    .btn:hover {
      background: linear-gradient(135deg, #f82d32 0%, var(--spidey-red) 100%);
      box-shadow: 0 12px 25px rgba(230, 36, 41, 0.5);
      transform: scale(1.02);
    }

    .btn:active {
      transform: scale(0.98);
    }

    @keyframes pulse {
      0% { opacity: 0.5; transform: scale(0.98); }
      100% { opacity: 0.85; transform: scale(1.05); }
    }

    /* Interactive Speech Bubble Notification */
    .toast {
      position: absolute;
      top: -20px;
      right: -10px;
      background: var(--spidey-blue);
      color: #ffffff;
      padding: 0.4rem 0.8rem;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 10px;
      box-shadow: 0 4px 12px rgba(0, 116, 228, 0.4);
      transform: rotate(6deg) scale(0);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .toast.active {
      transform: rotate(6deg) scale(1);
    }
  </style>
</head>
<body>

  <div class="web-bg"></div>

  <main class="card">
    <div class="avatar-wrap">
      <div class="avatar-glow"></div>
      <div class="avatar-body">
        <!-- Minimal Spidey Icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="#e62429" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2C6.48 2 2 6.48 2 12c0 3.2 1.5 6.05 3.84 7.89L12 22l6.16-2.11C20.5 18.05 22 15.2 22 12c0-5.52-4.48-10-10-10z" fill="#12131c"/>
          <path d="M7 10c1.5 2.5 4 4 5 4s3.5-1.5 5-4c-1.5 4.5-5 7-5 7s-3.5-2.5-5-7z" fill="#e62429"/>
          <ellipse cx="8.5" cy="10.5" rx="2.5" ry="1.5" fill="#ffffff" transform="rotate(-15 8.5 10.5)"/>
          <ellipse cx="15.5" cy="10.5" rx="2.5" ry="1.5" fill="#ffffff" transform="rotate(15 15.5 10.5)"/>
        </svg>
      </div>
      <div class="toast" id="spideyToast">Thwip! 🕸️</div>
    </div>

    <span class="badge">Friendly Neighborhood AI</span>
    <h1>"Hey there, static!"</h1>
    <p>Your friendly neighborhood Spider-Man just swung by to welcome you to the site. Everything is secured and ready to roll!</p>

    <button class="btn" onclick="sayHi()">
      <span>Say Hi Back</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </button>
  </main>

  <script>
    function sayHi() {
      const toast = document.getElementById('spideyToast');
      toast.classList.add('active');
      
      setTimeout(() => {
        toast.classList.remove('active');
      }, 2500);
    }
  </script>

</body>
</html>
