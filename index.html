<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<title>Connect — Private Social Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#f5f7fb;
  --panel:rgba(255,255,255,.72);
  --panel2:#f7f9fc;
  --line:rgba(15,23,42,.10);
  --text:#0a0d12;
  --muted:#667085;
  --accent:#0a84ff;
  --accent2:#0077ed;
  --danger:#ff3b30;
  --success:#16a34a;
  --bubble:#ffffff;
  --bubble2:#0a84ff;
  --shadow:0 24px 70px rgba(15,23,42,.12);
  --radius:22px;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(circle at 8% 0%,rgba(10,132,255,.14),transparent 28%),
    radial-gradient(circle at 92% 15%,rgba(0,102,230,.08),transparent 25%),
    linear-gradient(135deg,#fbfdff,#eef4fb 52%,#f8fafc);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;
  letter-spacing:-.01em;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
  transition:
    transform .18s ease,
    box-shadow .18s ease,
    background .18s ease,
    border-color .18s ease;
}

button:not(:disabled):active{
  transform:scale(.97);
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.hidden{
  display:none!important;
}

.muted{
  color:var(--muted);
}

.small{
  font-size:12px;
}

.app,
.screen{
  min-height:100vh;
}

button.primary{
  border:1px solid rgba(0,80,190,.18);
  background:linear-gradient(180deg,#198fff,#0077ed);
  color:#fff;
  border-radius:14px;
  padding:12px 16px;
  font-weight:700;
  box-shadow:0 8px 22px rgba(10,132,255,.22);
}

button.primary:hover{
  box-shadow:0 12px 30px rgba(10,132,255,.28);
  transform:translateY(-1px);
}

button.secondary{
  border:1px solid rgba(15,23,42,.10);
  background:rgba(255,255,255,.76);
  color:#101828;
  border-radius:14px;
  padding:11px 15px;
  box-shadow:0 5px 16px rgba(15,23,42,.05);
}

button.secondary:hover{
  background:#fff;
  border-color:rgba(10,132,255,.25);
}

button.danger{
  border:1px solid rgba(255,59,48,.14);
  background:rgba(255,59,48,.08);
  color:#d92d20;
  border-radius:14px;
  padding:11px 15px;
}

.toast{
  position:fixed;
  z-index:100;
  left:50%;
  bottom:22px;
  transform:translateX(-50%);
  max-width:min(92vw,520px);
  padding:13px 16px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:16px;
  background:rgba(20,25,34,.92);
  color:#fff;
  box-shadow:0 20px 55px rgba(0,0,0,.24);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  font-size:14px;
}

.toast.error{
  border-color:rgba(255,59,48,.45);
}

.toast.success{
  border-color:rgba(34,197,94,.45);
}

/* LANDING */

.landing,
.auth-wrap{
  display:grid;
  place-items:center;
  padding:24px;
  background:
    radial-gradient(circle at 15% 20%,rgba(10,132,255,.20),transparent 28%),
    radial-gradient(circle at 85% 25%,rgba(0,102,230,.12),transparent 26%),
    linear-gradient(135deg,#fbfdff,#edf4fc 52%,#fff);
}

.hero{
  width:min(760px,100%);
  text-align:center;
}

.logo{
  width:68px;
  height:68px;
  border-radius:22px;
  display:grid;
  place-items:center;
  margin:0 auto 22px;
  background:linear-gradient(145deg,#0a84ff,#0057d9);
  color:#fff;
  font-size:27px;
  font-weight:900;
  box-shadow:0 18px 42px rgba(10,132,255,.30);
  border:1px solid rgba(255,255,255,.4);
}

.hero h1{
  margin:0 0 18px;
  color:#05070a;
  font-size:clamp(38px,8vw,72px);
  line-height:1.02;
  font-weight:800;
  letter-spacing:-.055em;
}

.hero p{
  max-width:590px;
  margin:0 auto 30px;
  color:#667085;
  font-size:18px;
  line-height:1.55;
}

.hero-actions{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
}

.hero-actions button{
  min-width:155px;
}

/* AUTH */

.auth-card{
  width:min(430px,100%);
  padding:28px;
  border-radius:28px;
  background:rgba(255,255,255,.76);
  border:1px solid rgba(255,255,255,.9);
  backdrop-filter:blur(30px);
  -webkit-backdrop-filter:blur(30px);
  box-shadow:0 30px 90px rgba(15,23,42,.15);
}

.auth-card h2{
  margin:0 0 8px;
  font-size:28px;
  letter-spacing:-.04em;
}

.auth-card>p{
  margin:0 0 22px;
  color:var(--muted);
  line-height:1.5;
}

.back{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:0;
  margin-bottom:20px;
}

.field{
  margin:0 0 15px;
}

.field label{
  display:block;
  margin:0 0 7px;
  font-size:13px;
  font-weight:700;
}

.field input,
.field textarea,
.search input,
.chat-input textarea{
  width:100%;
  outline:none;
  background:rgba(248,250,252,.84);
  color:#101828;
  border:1px solid rgba(15,23,42,.10);
  border-radius:13px;
  padding:12px 13px;
}

.field textarea{
  min-height:100px;
  resize:vertical;
}

.field input:focus,
.field textarea:focus,
.search input:focus,
.chat-input textarea:focus{
  background:#fff;
  border-color:rgba(10,132,255,.55);
  box-shadow:0 0 0 4px rgba(10,132,255,.10);
}

.form-error{
  min-height:20px;
  margin:4px 0 12px;
  color:#d92d20;
  font-size:13px;
}

/* MAIN APP */

.layout{
  display:grid;
  grid-template-columns:290px 1fr;
  min-height:100vh;
}

.sidebar{
  display:flex;
  flex-direction:column;
  gap:16px;
  padding:18px;
  background:rgba(255,255,255,.66);
  border-right:1px solid rgba(15,23,42,.08);
  backdrop-filter:blur(28px);
  -webkit-backdrop-filter:blur(28px);
}

.brand{
  padding:5px 6px;
  font-size:22px;
  font-weight:900;
  letter-spacing:-.04em;
}

.me{
  display:flex;
  align-items:center;
  gap:11px;
  padding:10px;
  background:rgba(255,255,255,.72);
  border:1px solid rgba(15,23,42,.08);
  border-radius:18px;
  box-shadow:0 10px 30px rgba(15,23,42,.07);
  cursor:pointer;
}

.me-name{
  min-width:0;
}

.me-name b,
.me-name span{
  display:block;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.avatar{
  width:42px;
  height:42px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  overflow:hidden;
  border-radius:50%;
  object-fit:cover;

  color:#0757b8;
  border:1px solid rgba(10,132,255,.10);
  font-weight:800;
}

.me .avatar{
  width:44px;
  height:44px;
}

.nav{

  gap:5px;
}

.nav button{
  border:0;
  background:transparent;
  color:#667085;
  text-align:left;
  padding:11px 12px;
  border-radius:13px;
  font-weight:600;
}

.nav button:hover,
.nav button.active{
  color:#0057c7;
  background:rgba(10,132,255,.09);
}

.nav-badge{
  float:right;
  min-width:20px;
  padding:1px 6px;
  border-radius:99px;
  background:#0a84ff;
  color:#fff;
  text-align:center;
  font-size:11px;
}

.side-bottom{
  margin-top:auto;
}

.main{
  min-width:0;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:74px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 22px;
  background:rgba(255,255,255,.50);
  border-bottom:1px solid rgba(15,23,42,.07);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
}

.topbar h2{
  margin:0;
  font-size:21px;
  font-weight:750;
  letter-spacing:-.035em;
}

.content{
  flex:1;
  overflow:auto;
  padding:26px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
}

.card{
  padding:18px;
  background:rgba(255,255,255,.72);
  border:1px solid rgba(255,255,255,.92);
  border-radius:22px;
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  box-shadow:0 12px 38px rgba(15,23,42,.07);
}

.card h3{
  margin:0 0 6px;
}

.search{
  display:flex;
  gap:9px;
  margin-bottom:16px;
}

.search input{
  flex:1;
}

.user-list{
  display:grid;
  gap:9px;
}

.user-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  background:rgba(255,255,255,.72);
  border:1px solid rgba(15,23,42,.075);
  border-radius:18px;
  box-shadow:0 6px 22px rgba(15,23,42,.045);
}

.user-row:hover{
  border-color:rgba(10,132,255,.18);
  box-shadow:0 10px 30px rgba(15,23,42,.075);
}

.user-info{
  min-width:0;
  flex:1;
}

.user-info b,
.user-info span{
  display:block;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.user-actions{
  display:flex;
  justify-content:flex-end;
  gap:7px;
  flex-wrap:wrap;
}

.status{
  color:var(--muted);

}

.status.online{
  color:#16a34a;
}

.status.online:before{
  content:"";
  display:inline-block;
  width:7px;
  height:7px;

  border-radius:50%;

  box-shadow:0 0 0 3px rgba(34,197,94,.10);
}

.pill{
  display:inline-block;
  padding:4px 8px;
  border-radius:99px;
  background:rgba(10,132,255,.09);
  color:#0066e6;
  font-size:11px;
}

.empty{
  padding:35px 12px;
  color:var(--muted);
  text-align:center;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:0 0 12px;
}

.section-title h3{
  margin:0;

/* CHAT */

.chat-shell{
  display:grid;
  grid-template-columns:310px 1fr;
  height:calc(100vh - 74px);
  background:rgba(255,255,255,.30);
}

.chat-list{
  overflow:auto;
  padding:12px;
  background:rgba(255,255,255,.44);
  border-right:1px solid rgba(15,23,42,.08);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
}

.chat-item{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  padding:11px;
  border:0;
  border-radius:17px;
  background:transparent;
  color:#101828;
  text-align:left;
}

.chat-item.active,
.chat-item:hover{
  background:rgba(10,132,255,.09);
}

.chat-item .preview{
  min-width:0;
  flex:1;
}

.chat-item b,
.chat-item span{
  display:block;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.chat-window{
  min-width:0;
  display:flex;
  flex-direction:column;
  background:rgba(249,251,254,.48);
}

.chat-head{
  display:flex;
  align-items:center;
  gap:11px;
  height:70px;
  padding:10px 16px;
  background:rgba(255,255,255,.64);
  border-bottom:1px solid rgba(15,23,42,.07);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
}

.chat-messages{
  display:flex;
  flex:1;
  flex-direction:column;
  gap:8px;
  overflow:auto;

}

.msg{
  align-self:flex-start;
  max-width:min(72%,560px);
}

.msg.mine{
  align-self:flex-end;
}

.bubble{
  padding:10px 13px;
  background:#fff;
  color:#101828;
  border:1px solid rgba(15,23,42,.06);
  border-radius:17px 17px 17px 5px;
  box-shadow:0 5px 18px rgba(15,23,42,.055);
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.mine .bubble{
  background:linear-gradient(145deg,#198fff,#006fe6);
  color:#fff;
  border-color:transparent;
  border-radius:17px 17px 5px 17px;
  box-shadow:0 7px 20px rgba(10,132,255,.20);
}

.msg-meta{
  margin:4px 6px;

}

.mine .msg-meta{

}

.chat-input{
  display:flex;
  gap:9px;
  padding:12px;
  background:rgba(255,255,255,.74);
  border-top:1px solid rgba(15,23,42,.07);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
}

.chat-input textarea{
  flex:1;
  height:46px;
  max-height:120px;

.mobile-back{
  display:none;
}

/* PROFILE */

.profile-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.profile-avatar-wrap{
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:18px;
}

.big-avatar{
  width:86px;
  height:86px;
  display:grid;
  place-items:center;
  overflow:hidden;
  border-radius:50%;

  background:linear-gradient(145deg,#dbeafe,#bfdbfe);
  color:#0757b8;
  font-size:28px;
  font-weight:800;

.file-label{
  display:inline-block;
  padding:9px 12px;
  border:1px solid rgba(15,23,42,.10);

.danger-zone{

/* MOBILE */

  }

    grid-template-columns:repeat(4,1fr);

    background:rgba(255,255,255,.84);

    background:transparent;

  }

  .mobile-nav button.active{

  }

  .mobile-nav span{

  .chat-shell{

  .chat-list{
    height:100%;

    background:rgba(248,250,252,.74);

  .chat-window{
    display:none;

    font-size:26px;

  .user-row{

  .user-actions{

  .hero h1{

  .hero p{

  }

  .auth-card{

</style>

<script>

const SUPABASE_URL =
  "https://cfcwsazbnsklqgsgdwea.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_e2qODCX9-2UILTL5ibZ8Lg_NGtR8-t8";

const { createClient } = supabase;

const db = createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY,
  {
    auth:{
      autoRefreshToken:true,
      persistSession:true,
      detectSessionInUrl:true
    }
  }
);

const state = {
  session:null,
  user:null,
  profile:null,

  page:"home",

  friends:[],
  requests:[],
  chats:[],
  notifications:[],

  activeChat:null,
  activeConversation:null,

  messageChannel:null,
  requestChannel:null,
  notificationChannel:null,

  requestProfiles:{}
};

const $ = selector =>
  document.querySelector(selector);

function esc(value=""){
  return String(value).replace(
    /[&<>"']/g,
    character => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[character])
  );
}

function initials(profile){

  return esc(
    (
      profile?.display_name ||
      profile?.username ||
      "?"
    )
    .trim()
    .slice(0,1)
    .toUpperCase()
  );

}

function avatar(profile,className="avatar"){

  if(profile?.avatar_url){

    return `
      <img
        class="${className}"
        src="${esc(profile.avatar_url)}"
        alt="">
    `;

  }

  return `
    <div class="${className}">
      ${initials(profile)}
    </div>
  `;

}

function timeAgo(date){

  if(!date)
    return "";

  const seconds =
    Math.floor(
      (Date.now() -
        new Date(date).getTime()) / 1000
    );

  if(seconds < 60)
    return "just now";

  if(seconds < 3600)
    return Math.floor(seconds/60)+"m";

  if(seconds < 86400)
    return Math.floor(seconds/3600)+"h";

  if(seconds < 604800)
    return Math.floor(seconds/86400)+"d";

  return new Date(date).toLocaleDateString();

}

function timeText(date){

  return new Date(date).toLocaleTimeString(
    [],
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}

function toast(message,type=""){

  const element =
    $("#toast");

  element.textContent =
    message;

  element.className =
    "toast "+type;

  clearTimeout(
    window.__toastTimer
  );

  window.__toastTimer =
    setTimeout(
      () =>
        element.classList.add(
          "hidden"
        ),
      3500
    );

}

function friendlyError(error){

  const message =
    error?.message ||
    String(
      error ||
      "Something went wrong."
    );

  if(
    /duplicate key|unique constraint/i
      .test(message)
  ){
    return "That username is already taken.";
  }

  if(/reserved/i.test(message)){
    return "That username is reserved.";
  }

  if(
    /password/i.test(message) &&
    /weak|short|length/i.test(message)
  ){
    return "Use a stronger password with at least 8 characters.";
  }

  if(
    /conversation unavailable/i.test(message)
  ){
    return "This conversation is unavailable.";
  }

  if(
    /users must be friends/i.test(message)
  ){
    return "Accept the friend request before starting a chat.";
  }

  if(
    /row-level security|permission denied/i
      .test(message)
  ){
    return "Supabase security rules rejected this action.";
  }

  return message;

}

function internalEmail(username){

  return (
    username.toLowerCase() +
    "@auth.shinannuneenkutty.in"
  );

}

function showAuth(mode="login"){

  $("#app").innerHTML = `

    <div class="screen auth-wrap">

async function validateUsername(username){

  const {
    data,
    error
  } =
    await db.rpc(
      "validate_username",
      {
        requested_username:
          username
      }
    );

  if(error)
    throw error;

  return !!data;

}

async function submitAuth(event,mode){

  event.preventDefault();

  const button =
    $("#authBtn");

  const errorBox =
    $("#authError");

  const username =
    $("#authUser")
      .value
      .trim()
      .toLowerCase();

  const password =
    $("#authPass").value;

  errorBox.textContent = "";

  button.disabled = true;
  button.textContent =
    "Please wait…";

  try{

    if(
      !/^[a-z0-9_.]{3,20}$/
        .test(username)
    ){

      throw new Error(
        "Username must be 3–20 characters and use only letters, numbers, underscores or periods."
      );

    }

    if(password.length < 8){

      throw new Error(
        "Password must contain at least 8 characters."
      );

    }

    if(mode === "register"){

      const valid =
        await validateUsername(
          username
        );

      if(!valid){

        throw new Error(
          "Username is already taken or unavailable."
        );

      }

      const {
        data,
        error
      } =
        await db.auth.signUp({

          email:
            internalEmail(
              username
            ),

          password,

          options:{
            data:{
              username
            }
          }

        });

      if(error)
        throw error;

      if(!data.user)
        throw new Error(
          "Account could not be created."
        );

      if(!data.session){

        throw new Error(
          "Account created, but email confirmation is enabled. Turn off Confirm email in Supabase Authentication → Providers → Email."
        );

      }

      toast(
        "Account created successfully.",
        "success"
      );

      await startApp(
        data.session
      );

    }else{

      const {
        data,
        error
      } =
        await db.auth.signInWithPassword({

          email:
            internalEmail(
              username
            ),

          password

        });

      if(error)
        throw error;

      await startApp(
        data.session
      );

    }

  }catch(error){

    errorBox.textContent =
      friendlyError(error);

  }finally{

    button.disabled =
      false;

    button.textContent =
      mode === "login"
      ? "Login"
      : "Create Account";

  }

}

   SESSION
========================= */

async function startApp(session){

  state.session =
    session;

  state.user =
    session.user;

  await loadProfile();

  if(!state.profile){

    throw new Error(
      "Your account exists, but the profile was not created."
    );

  }

  await setPresence(
    true
  );

  await loadAll();

  subscribeRealtime();

  renderApp();

}

async function loadProfile(){

  const {
    data,
    error
  } =
    await db
      .from("profiles")
      .select("*")
      .eq(
        "id",
        state.user.id
      )
      .single();

  if(error)
    throw error;

  state.profile =
    data;

}

async function setPresence(online){

  if(!state.user)
    return;

  const now =
    new Date().toISOString();

  const {
    error
  } =
    await db
      .from("profiles")
      .update({
        online_status:
          online,
        last_seen:
          now
      })
      .eq(
        "id",
        state.user.id
      );

  if(!error){

    state.profile = {
      ...state.profile,
      online_status:
        online,
      last_seen:
        now
    };

  }

}

/* =========================
   DATA
========================= */

async function getProfiles(ids){

  if(!ids.length)
    return [];

  const {
    data,
    error
  } =
    await db
      .from("profiles")
      .select("*")
      .in(
        "id",
        ids
      );

  if(error)
    throw error;

  return data || [];

}

async function loadAll(){

  const [
    friendships,
    requests,
    notifications
  ] =
    await Promise.all([

      db
        .from("friendships")
        .select(
          "friend_id,user_id,created_at"
        )
        .or(
          `user_id.eq.${state.user.id},friend_id.eq.${state.user.id}`
        ),

      db
        .from("friend_requests")
        .select("*")
        .or(
          `sender_id.eq.${state.user.id},receiver_id.eq.${state.user.id}`
        )
        .order(
          "created_at",
          {
            ascending:false
          }
        ),

      db
        .from("notifications")
        .select("*")
        .eq(
          "user_id",
          state.user.id
        )
        .order(
          "created_at",
          {
            ascending:false
          }
        )
        .limit(50)

    ]);

  if(friendships.error)
    throw friendships.error;

  if(requests.error)
    throw requests.error;

  if(notifications.error)
    throw notifications.error;

  const friendIds =
    (friendships.data || [])
      .map(
        row =>
          row.user_id ===
          state.user.id
          ? row.friend_id
          : row.user_id
      );

  state.requests =
    requests.data || [];

  state.notifications =
    notifications.data || [];

  const relatedIds =
    [
      ...state.requests.flatMap(
        row => [
          row.sender_id,
          row.receiver_id
        ]
      ),
      ...friendIds
    ]
    .filter(
      id =>
        id !==
        state.user.id
    );

  const profiles =
    await getProfiles(
      [...new Set(relatedIds)]
    );

  const profileMap =
    new Map(
      profiles.map(
        profile =>
          [profile.id,profile]
      )
    );

  state.friends =
    friendIds
      .map(
        id =>
          profileMap.get(id)
      )
      .filter(Boolean);

  state.requestProfiles =
    Object.fromEntries(
      profiles.map(
        profile =>
          [profile.id,profile]
      )
    );

  await loadChats();

}

async function loadChats(){

  const {
    data,
    error
  } =
    await db
      .from("conversation_members")
      .select(
        "conversation_id,user_id"
      )
      .eq(
        "user_id",
        state.user.id
      );

  if(error)
    throw error;

  const conversationIds =
    (data || [])
      .map(
        row =>
          row.conversation_id
      );

  if(!conversationIds.length){

    state.chats = [];

    return;

  }

  const {
    data:members,
    error:membersError
  } =
    await db
      .from("conversation_members")
      .select(
        "conversation_id,user_id"
      )
      .in(
        "conversation_id",
        conversationIds
      );

  if(membersError)
    throw membersError;

  const otherIds =
    [
      ...new Set(
        (members || [])
          .filter(
            row =>
              row.user_id !==
              state.user.id
          )
          .map(
            row =>
              row.user_id
          )
      )
    ];

  const profiles =
    await getProfiles(
      otherIds
    );

  const profileMap =
    new Map(
      profiles.map(
        profile =>
          [profile.id,profile]
      )
    );

  state.chats =
    conversationIds
      .map(
        conversationId => {

          const other =
            (members || [])
              .find(
                row =>
                  row.conversation_id ===
                    conversationId &&
                  row.user_id !==
                    state.user.id
              );

          if(!other)
            return null;

          return {
            conversation_id:
              conversationId,

            profile:
              profileMap.get(
                other.user_id
              )
          };

        }
      )
      .filter(
        Boolean
      );

}

function subscribeRealtime(){

  if(state.messageChannel)
    db.removeChannel(
      state.messageChannel
    );

  if(state.requestChannel)
    db.removeChannel(
      state.requestChannel
    );

  if(state.notificationChannel)
    db.removeChannel(
      state.notificationChannel
    );

  state.messageChannel =
    db
      .channel(
        "messages-" +
        state.user.id
      )
      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"messages"
        },
        payload => {

          if(
            state.activeConversation &&
            payload.new?.conversation_id ===
            state.activeConversation
          ){

            loadMessages(
              false
            );

          }

          loadChats();

        }
      )
      .subscribe();

  state.requestChannel =
    db
      .channel(
        "requests-" +
        state.user.id
      )
      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"friend_requests"
        },
        async () => {

          try{

            await loadAll();

            renderApp();

          }catch(error){

            console.error(
              error
            );

          }

        }
      )
      .subscribe();

  state.notificationChannel =
    db
      .channel(
        "notifications-" +
        state.user.id
      )
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"notifications",
          filter:
            `user_id=eq.${state.user.id}`
        },
        payload => {

          state.notifications
            .unshift(
              payload.new
            );

          renderApp();

          toast(
            payload.new.title,
            "success"
          );

        }
      )
      .subscribe();

}

async function doSearch(){

  const query =
    $("#searchInput")
      .value
      .trim()
      .toLowerCase();

  const results =
    $("#searchResults");

  if(!query){

    results.innerHTML = `
      <div class="empty">
        Enter a username to search.
      </div>
    `;

    return;

  }

  results.innerHTML = `
    <div class="empty">
      Searching…
    </div>
  `;

  const {
    data,
    error
  } =
    await db
      .from("profiles")
      .select("*")
      .ilike(
        "username",
        `%${query}%`
      )
      .neq(
        "id",
        state.user.id
      )
      .limit(30);

  if(error){

    results.innerHTML = `
      <div class="empty">
        ${esc(
          friendlyError(error)
        )}
      </div>
    `;

    return;

  }

  results.innerHTML =
    data.length
    ?
    data
      .map(
        userRow
      )
      .join("")
    :
    `
      <div class="empty">
        No users found.
      </div>
    `;

}

        friend.id ===

    );

  const sent =
    state.requests.find(
      request =>
        request.sender_id ===
          state.user.id &&
        request.receiver_id ===
          profile.id &&
        request.status ===
          "pending"
    );

  const incoming =
    state.requests.find(
      request =>
        request.sender_id ===
          profile.id &&
        request.receiver_id ===
          state.user.id &&
        request.status ===
          "pending"
    );

  return `

          ${esc(

            profile.username

async function sendRequest(userId){

  try{

    await db.rpc(
      "send_friend_request",
      {
        target_user:
          userId
      }
    );

    toast(
      "Friend request sent.",
      "success"
    );

    await loadAll();

    if(state.page === "search")
      doSearch();

  }catch(error){

    toast(
      friendlyError(error),
      "error"
    );

  }

}

async function cancelRequest(requestId){

  const {
    error
  } =
    await db
      .from("friend_requests")
      .delete()
      .eq(
        "id",
        requestId
      )
      .eq(
        "sender_id",
        state.user.id
      );

  if(error){

    toast(
      friendlyError(error),
      "error"
    );

    return;

  }

  toast(
    "Request cancelled."
  );

  await loadAll();

  renderApp();

}

async function acceptRequest(requestId){

  try{

    await db.rpc(
      "accept_friend_request",
      {
        request_uuid:
          requestId
      }
    );

    toast(
      "Friend request accepted.",
      "success"
    );

    await loadAll();

    renderApp();

  }catch(error){

    toast(
      friendlyError(error),
      "error"
    );

  }

}

async function rejectRequest(requestId){

  const {
    error
  } =
    await db
      .from("friend_requests")
      .update({
        status:"rejected"
      })
      .eq(
        "id",
        requestId
      )
      .eq(
        "receiver_id",
        state.user.id
      );

  if(error){

    toast(
      friendlyError(error),
      "error"
    );

    return;

  }

  await loadAll();

  renderApp();

}

async function openChat(userId){

  try{

    if(
      !userId ||
      userId ===
      state.user.id
    ){

      throw new Error(
        "Invalid conversation."
      );

    }

    /*
      Refresh the relationship first.
      This avoids stale friend-request state.
    */

    await loadAll();

    const isFriend =
      state.friends.some(
        friend =>
          friend.id ===
          userId
      );

    if(!isFriend){

      throw new Error(
        "You can only chat with an accepted friend."
      );

    }

    const {
      data,
      error
    } =
      await db.rpc(
        "create_private_conversation",
        {
          other_user:
            userId
        }
      );

    if(error)
      throw error;

    if(!data){

      throw new Error(
        "The conversation could not be created."
      );

    }

    state.activeChat =
      userId;

    state.activeConversation =
      data;

    state.page =
      "messages";

    await loadChats();

    renderApp();

    await loadMessages(
      true
    );

  }catch(error){

    toast(
      friendlyError(error),
      "error"
    );

  }

}

async function loadMessages(
  scroll=true
){

  if(!state.activeConversation)
    return;

  const {
    data,
    error
  } =
    await db
      .from("messages")
      .select("*")
      .eq(
        "conversation_id",
        state.activeConversation
      )
      .order(
        "created_at",
        {
          ascending:true
        }
      );

  const box =
    $("#chatMessages");

  if(!box)
    return;

  if(error){

    box.innerHTML = `
      <div class="empty">
        ${esc(
          friendlyError(error)
        )}
      </div>
    `;

    return;

  }

  box.innerHTML =
    data.length
    ?
    data
      .map(
        message => `

          <div
            class="msg ${
              message.sender_id ===
              state.user.id
              ? "mine"
              : ""
            }">

            <div class="bubble">

              ${
                message.deleted_at
                ?
                "<i>Message deleted</i>"
                :
                esc(
                  message.message
                )
              }

            </div>

            <div class="msg-meta">

              ${timeText(
                message.created_at
              )}

              ${
                message.sender_id ===
                state.user.id
                ?
                (
                  message.read_at
                  ?
                  " · Read"
                  :
                  " · Sent"
                )
                :
                ""
              }

            </div>

          </div>

        `
      )
      .join("")
    :
    `
      <div
        class="empty"
        style="margin:auto">

        No messages yet.

        <br>

        Say hello 👋

      </div>
    `;

  if(scroll){

    box.scrollTop =
      box.scrollHeight;

  }

}

async function sendMessage(event){

  event.preventDefault();

  const input =
    $("#chatInput");

  const message =
    input.value.trim();

  if(
    !message ||
    !state.activeConversation
  )
    return;

  const {
    error
  } =
    await db
      .from("messages")
      .insert({

        conversation_id:
          state.activeConversation,

        sender_id:
          state.user.id,

        message

      });

  if(error){

    toast(
      friendlyError(error),
      "error"
    );

    return;

  }

  input.value = "";

  await loadMessages(
    true
  );

}

async function saveProfile(event){

  const displayName =

      .value

  const {
    data,
    error
  } =
    await db
      .from("profiles")
      .update({
        display_name:
          displayName,
        bio
      })
      .eq(
        "id",
        state.user.id
      )
      .select()
      .single();

  if(error){

    toast(
      friendlyError(error),
      "error"
    );

    return;

  }

  state.profile =
    data;

  toast(
    "Profile updated.",
    "success"
  );

  renderApp();

}

async function uploadAvatar(event){

  const file =
    event.target.files[0];

  if(!file)
    return;

  if(
    file.size >
    2 * 1024 * 1024
  ){

    toast(
      "Avatar must be 2 MB or smaller.",
      "error"
    );

    return;

  }

  const extension =
    (
      file.name
        .split(".")
        .pop() ||
      "jpg"
    ).toLowerCase();

  const path =
    `${state.user.id}/avatar.${extension}`;

  const {
    error
  } =
    await db
      .storage
      .from("avatars")
      .upload(
        path,
        file,
        {
          upsert:true,
          contentType:
            file.type
        }
      );

  if(error){

    toast(
      friendlyError(error),
      "error"
    );

    return;

  }

  const {
    data
  } =
    db
      .storage
      .from("avatars")
      .getPublicUrl(
        path
      );

  const url =
    data.publicUrl +
    "?v=" +
    Date.now();

  const {
    data:updated,
    error:updateError
  } =
    await db
      .from("profiles")
      .update({
        avatar_url:
          url
      })
      .eq(
        "id",
        state.user.id
      )
      .select()
      .single();

  if(updateError){

    toast(
      friendlyError(
        updateError
      ),
      "error"
    );

    return;

  }

  state.profile =
    updated;

  toast(
    "Avatar updated.",
    "success"
  );

  renderApp();

}

/* =========================
   PAGE EVENTS
========================= */

function bindPage(){

  if(state.page === "search"){

    $("#searchBtn").onclick =
      doSearch;

    $("#searchInput").onkeydown =
      event => {

        if(
          event.key ===
          "Enter"
        ){

          event.preventDefault();

          doSearch();

        }

      };

  }

  if(state.page === "messages"){

    $("#chatForm")
      ?.addEventListener(
        "submit",
        sendMessage
      );

    $("#chatInput")
      ?.addEventListener(
        "keydown",
        event => {

          if(
            event.key ===
              "Enter" &&
            !event.shiftKey
          ){

            event.preventDefault();

            sendMessage(
              event
            );

          }

        }
      );

    if(
      state.activeConversation
    ){

      loadMessages(
        true
      );

    }

  }

  if(state.page === "profile"){

    $("#profileForm").onsubmit =
      saveProfile;

    $("#avatarInput").onchange =
      uploadAvatar;

  }

}

/* =========================
   LOGOUT
========================= */

async function logout(){

  await setPresence(
    false
  );

  if(state.messageChannel){

    await db.removeChannel(
      state.messageChannel
    );

  }

  if(state.requestChannel){

    await db.removeChannel(
      state.requestChannel
    );

  }

  if(state.notificationChannel){

    await db.removeChannel(
      state.notificationChannel
    );

  }

  await db.auth.signOut();

  location.reload();

}

/* =========================
   AUTH SESSION LISTENER
========================= */

db.auth.onAuthStateChange(
  async (
    event,
    session
  ) => {

    if(
      event ===
      "SIGNED_OUT"
    ){

      state.session =
        null;

      state.user =
        null;

      renderLanding();

      return;

    }

    if(
      event ===
        "INITIAL_SESSION" &&
      session
    ){

      try{

        await startApp(
          session
        );

      }catch(error){

        console.error(
          error
        );

        await db.auth.signOut();

        toast(
          friendlyError(error),
          "error"
        );

        renderLanding();

      }

    }

  }
);

/* =========================
   PRESENCE
========================= */

window.addEventListener(
  "beforeunload",
  () => {

    if(state.user){

      setPresence(
        false
      );

    }

  }
);

/* START */

renderLanding();

</script>
