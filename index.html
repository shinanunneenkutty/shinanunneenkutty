<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nothing to see here</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      height: 100vh;
      overflow: hidden;
      background: #ffffff;
      color: #111111;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .message {
      font-size: clamp(32px, 6vw, 72px);
      font-weight: 500;
      letter-spacing: -2px;
      text-align: center;
      margin-bottom: 55px;
    }
    .running-area {
      position: relative;
      width: 100%;
      height: 70px;
      overflow: hidden;
    }
    .runner {
      position: absolute;
      left: -70px;
      bottom: 0;
      width: 42px;
      height: 62px;
      animation: run 5s linear infinite;
    }
    .head {
      position: absolute;
      top: 0;
      left: 14px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #111111;
    }
    .body {
      position: absolute;
      top: 15px;
      left: 20px;
      width: 6px;
      height: 25px;
      border-radius: 4px;
      background: #111111;
      transform: rotate(-18deg);
      transform-origin: top center;
    }
    .arm,
    .leg {
      position: absolute;
      width: 5px;
      border-radius: 4px;
      background: #111111;
      transform-origin: top center;
    }
    .arm {
      top: 18px;
      left: 20px;
      height: 22px;
    }
    .arm-one {
      animation: armOne 0.35s ease-in-out infinite alternate;
    }
    .arm-two {
      animation: armTwo 0.35s ease-in-out infinite alternate;
    }
    .leg {
      top: 36px;
      left: 20px;
      height: 27px;
    }
    .leg-one {
      animation: legOne 0.35s ease-in-out infinite alternate;
    }
    .leg-two {
      animation: legTwo 0.35s ease-in-out infinite alternate;
    }
    @keyframes run {
      from {
        left: -70px;
        transform: scaleX(1);
      }
      to {
        left: calc(100% + 70px);
        transform: scaleX(1);
      }
    }
    @keyframes armOne {
      from {
        transform: rotate(55deg);
      }
      to {
        transform: rotate(-55deg);
      }
    }
    @keyframes armTwo {
      from {
        transform: rotate(-55deg);
      }
      to {
        transform: rotate(55deg);
      }
    }
    @keyframes legOne {
      from {
        transform: rotate(55deg);
      }
      to {
        transform: rotate(-55deg);
      }
    }
    @keyframes legTwo {
      from {
        transform: rotate(-55deg);
      }
      to {
        transform: rotate(55deg);
      }
    }
  </style>
</head>
<body>
  <div class="message">
    Nothing to see here.
  </div>
  <div class="running-area">
    <div class="runner">
      <div class="head"></div>
      <div class="body"></div>
      <div class="arm arm-one"></div>
      <div class="arm arm-two"></div>
      <div class="leg leg-one"></div>
      <div class="leg leg-two"></div>
    </div>
  </div>
</body>
</html>
