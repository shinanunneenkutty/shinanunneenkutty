<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f9fc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>LinkTribe</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --blue:#007aff;
  --blue2:#0066d6;
  --ink:#0b0d10;
  --muted:#667085;
  --bg:#f5f7fb;
  --card:rgba(255,255,255,.78);
  --line:rgba(15,23,42,.09);
  --green:#22c55e;
  --red:#ff3b30;
  --nav:68px;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(circle at 5% 0%,rgba(0,122,255,.12),transparent 28%),
    radial-gradient(circle at 100% 20%,rgba(0,95,232,.08),transparent 30%),
    var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
    "SF Pro Text","Segoe UI",sans-serif;
}

button,input,textarea{
  font:inherit;
}

button{
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

.hidden{
  display:none!important;
}

.primary{
  border:0;
  border-radius:14px;
  padding:11px 16px;
  color:#fff;
  font-weight:750;
  background:linear-gradient(180deg,#168cff,#0071e3);
  box-shadow:0 7px 20px rgba(0,122,255,.18);
}

.secondary{
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px 14px;
  background:#fff;
  color:var(--ink);
}

.danger{
  border:1px solid rgba(255,59,48,.15);
  border-radius:14px;
  padding:10px 14px;
  background:rgba(255,59,48,.08);
  color:#d92d20;
}

.card{
  border:1px solid rgba(255,255,255,.9);
  border-radius:22px;
  background:var(--card);
  box-shadow:0 14px 40px rgba(15,23,42,.06);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
}

.muted{
  color:var(--muted);
}

.small{
  font-size:12px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:28px 15px;
}

.avatar{
  width:42px;
  height:42px;
  flex:0 0 auto;
  border-radius:50%;
  display:grid;
  place-items:center;
  overflow:hidden;
  background:linear-gradient(145deg,#dbeafe,#bfdbfe);
  color:#0757b8;
  font-weight:800;
}

.avatar img,
.big-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.big-avatar{
  width:88px;
  height:88px;
  border-radius:50%;
  display:grid;
  place-items:center;
  overflow:hidden;
  background:linear-gradient(145deg,#dbeafe,#bfdbfe);
  color:#0757b8;
  font-size:27px;
  font-weight:800;
}

.status{
  font-size:12px;
  color:var(--muted);
}

.status.online{
  color:#16a34a;
}

.status.online:before{
  content:"";
  display:inline-block;
  width:6px;
  height:6px;
  border-radius:50%;
  background:#22c55e;
  margin-right:5px;
}

.toast{
  position:fixed;
  z-index:9999;
  left:50%;
  bottom:24px;
  transform:translateX(-50%);
  max-width:90vw;
  padding:12px 16px;
  border-radius:15px;
  color:#fff;
  background:rgba(20,22,26,.94);
  box-shadow:0 18px 50px rgba(0,0,0,.25);
  display:flex;
  align-items:center;
  gap:9px;
  cursor:pointer;
}

.toast.hidden{
  display:none!important;
}

/* INTRO */

.intro{
  min-height:100vh;
  min-height:100dvh;
  display:grid;
  place-items:center;
  padding:24px;
  position:relative;
  overflow:hidden;
}

.intro:before,
.intro:after{
  content:"";
  position:absolute;
  border-radius:50%;
  pointer-events:none;
  filter:blur(3px);
}

.intro:before{
  width:420px;
  height:420px;
  background:rgba(0,122,255,.12);
  top:-220px;
  left:-170px;
}

.intro:after{
  width:380px;
  height:380px;
  background:rgba(0,95,232,.08);
  right:-180px;
  bottom:-180px;
}

.intro-box{
  position:relative;
  z-index:1;
  width:min(680px,100%);
  text-align:center;
}

.intro-logo{
  width:82px;
  height:82px;
  margin:0 auto 24px;
  border-radius:26px;
  display:grid;
  place-items:center;
  color:#fff;
  font-size:34px;
  font-weight:900;
  background:linear-gradient(145deg,#168cff,#0057d9);
  box-shadow:0 22px 50px rgba(0,122,255,.28);
}

.intro-brand{
  font-size:17px;
  font-weight:800;
  color:#0071e3;
  letter-spacing:.02em;
  margin-bottom:10px;
}

.intro h1{
  margin:0;
  font-size:clamp(42px,8vw,72px);
  line-height:.98;
  letter-spacing:-.065em;
  font-weight:880;
}

.intro p{
  max-width:570px;
  margin:22px auto 30px;
  color:var(--muted);
  font-size:18px;
  line-height:1.55;
}

.intro-buttons{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.intro-buttons button{
  min-width:145px;
}

.intro-note{
  margin-top:22px;
  color:#8a94a6;
  font-size:12px;
}

/* AUTH */

.auth{
  min-height:100vh;
  min-height:100dvh;
  display:grid;
  place-items:center;
  padding:20px;
}

.auth-card{
  width:min(430px,100%);
  padding:26px;
  border-radius:27px;
  background:rgba(255,255,255,.82);
  box-shadow:0 20px 60px rgba(15,23,42,.12);
  backdrop-filter:blur(30px);
}

.back{
  border:0;
  background:none;
  color:var(--muted);
  padding:0;
  margin-bottom:20px;
}

.auth-card h2{
  margin:0 0 7px;
  font-size:28px;
}

.auth-card>p{
  color:var(--muted);
  line-height:1.5;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}

.field input,
.field textarea{
  width:100%;
  border:1px solid var(--line);
  outline:0;
  border-radius:13px;
  padding:12px;
  background:#f8fafc;
}

.field textarea{
  min-height:100px;
  resize:vertical;
}

.field input:focus,
.field textarea:focus,
.search input:focus,
.chat-input textarea:focus{
  border-color:rgba(0,122,255,.55);
  box-shadow:0 0 0 4px rgba(0,122,255,.1);
  background:#fff;
}

.form-error{
  min-height:20px;
  color:#d92d20;
  font-size:13px;
  margin:5px 0 10px;
}

/* MAIN */

.layout{
  min-height:100vh;
  display:grid;
  grid-template-columns:270px 1fr;
}

.sidebar{
  display:flex;
  flex-direction:column;
  gap:15px;
  padding:17px;
  background:rgba(255,255,255,.68);
  border-right:1px solid var(--line);
  backdrop-filter:blur(30px);
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:21px;
  font-weight:900;
  letter-spacing:-.045em;
  padding:5px;
}

.brand-mark{
  width:31px;
  height:31px;
  border-radius:9px;
  display:grid;
  place-items:center;
  color:#fff;
  background:linear-gradient(145deg,#168cff,#0057d9);
  box-shadow:0 6px 16px rgba(0,122,255,.35);
}

.my-profile{
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px;
  border:1px solid var(--line);
  border-radius:17px;
  background:rgba(255,255,255,.8);
  cursor:pointer;
}

.my-info{
  min-width:0;
}

.my-info b,
.my-info span{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.nav{
  display:grid;
  gap:4px;
}

.nav button{
  position:relative;
  display:flex;
  align-items:center;
  gap:10px;
  border:0;
  border-radius:13px;
  padding:10px 11px;
  color:#667085;
  background:transparent;
  text-align:left;
  font-weight:650;
}

.nav button.active,
.nav button:hover{
  color:#0066d6;
  background:rgba(0,122,255,.08);
}

/* SMALL RED NOTIFICATION DOT */

.nav-red-dot{
  position:absolute;
  right:13px;
  top:50%;
  transform:translateY(-50%);
  width:8px;
  height:8px;
  border-radius:50%;
  background:#ff3b30;
  box-shadow:0 0 0 2px rgba(255,255,255,.9);
}

.mobile-red-dot{
  position:absolute;
  top:7px;
  right:calc(50% - 18px);
  width:7px;
  height:7px;
  border-radius:50%;
  background:#ff3b30;
  box-shadow:0 0 0 2px rgba(255,255,255,.9);
}

.badge{
  position:absolute;
  right:9px;
  top:50%;
  transform:translateY(-50%);
  min-width:18px;
  height:18px;
  padding:0 5px;
  border-radius:99px;
  background:var(--red);
  color:#fff;
  font-size:10px;
  font-weight:700;
  line-height:18px;
  text-align:center;
}

.sidebar-bottom{
  margin-top:auto;
}

.main{
  min-width:0;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:70px;
  display:flex;
  align-items:center;
  padding:0 22px;
  border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(25px);
}

.topbar h2{
  margin:0;
  font-size:21px;
  letter-spacing:-.04em;
}

.content{
  flex:1;
  overflow:auto;
  padding:23px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:15px;
}

/* HOME */

.home-hero{
  padding:26px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(233,243,255,.72));
  overflow:hidden;
}

.home-hero h1{
  font-size:clamp(30px,5vw,46px);
  letter-spacing:-.055em;
  margin:0 0 9px;
}

.home-hero p{
  margin:0 0 19px;
  color:var(--muted);
  max-width:590px;
  line-height:1.5;
}

.home-orb{
  width:150px;
  height:150px;
  flex:0 0 auto;
  border-radius:50%;
  background:radial-gradient(circle at 30% 25%,#fff,rgba(0,122,255,.35) 35%,rgba(0,75,190,.85));
  box-shadow:0 25px 55px rgba(0,122,255,.22);
}

.stat{
  padding:19px;
}

.stat strong{
  display:block;
  font-size:32px;
  letter-spacing:-.05em;
}

.stat span{
  color:var(--muted);
  font-size:13px;
}

.quick-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:11px;
  margin-top:15px;
}

.quick{
  padding:16px;
  border:1px solid var(--line);
  border-radius:17px;
  background:rgba(255,255,255,.72);
  cursor:pointer;
}

.quick b{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:5px;
}

.quick span{
  color:var(--muted);
  font-size:13px;
}

/* SEARCH */

.search{
  display:flex;
  gap:8px;
  margin-bottom:16px;
}

.search input{
  flex:1;
  min-width:0;
  border:1px solid var(--line);
  outline:0;
  border-radius:13px;
  padding:12px;
  background:#f8fafc;
}

.user-list{
  display:grid;
  gap:8px;
}

.user-row{
  display:flex;
  align-items:center;
  gap:11px;
  padding:11px;
  border:1px solid var(--line);
  border-radius:17px;
  background:rgba(255,255,255,.72);
}

.user-info{
  flex:1;
  min-width:0;
}

.user-info b,
.user-info span{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.user-actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

/* CHAT */

.chat-shell{
  height:calc(100vh - 70px);
  display:grid;
  grid-template-columns:285px 1fr;
}

.chat-list{
  overflow:auto;
  padding:10px;
  border-right:1px solid var(--line);
  background:rgba(255,255,255,.48);
}

.chat-item{
  position:relative;
  width:100%;
  display:flex;
  align-items:center;
  gap:9px;
  border:0;
  border-radius:15px;
  padding:10px;
  background:transparent;
  text-align:left;
}

.chat-item:hover,
.chat-item.active{
  background:rgba(0,122,255,.08);
}

.chat-item.unread .chat-preview b{
  font-weight:800;
}

.chat-item.unread .chat-preview span{
  color:var(--ink);
  font-weight:600;
}

.chat-preview{
  min-width:0;
  flex:1;
}

.chat-preview b,
.chat-preview span{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.chat-item-badge{
  min-width:18px;
  height:18px;
  padding:0 5px;
  border-radius:99px;
  background:var(--blue);
  color:#fff;
  font-size:10px;
  font-weight:700;
  line-height:18px;
  text-align:center;
  flex:0 0 auto;
}

.chat-window{
  min-width:0;
  display:flex;
  flex-direction:column;
  background:rgba(248,250,253,.5);
  min-height:0;
}

.chat-header{
  height:66px;
  flex:0 0 66px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 14px;
  border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.68);
  backdrop-filter:blur(24px);
}

.chat-header-info{
  min-width:0;
}

.chat-header-info b{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.chat-messages{
  flex:1;
  min-height:0;
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:5px;
  padding:17px;
  scroll-behavior:smooth;
}

.message{
  display:inline-flex;
  flex-direction:column;
  align-self:flex-start;
  width:fit-content;
  max-width:min(72%,420px);
}

.message.mine{
  align-self:flex-end;
}

.bubble{
  display:inline-block;
  width:fit-content;
  max-width:100%;
  padding:8px 12px;
  font-size:15px;
  line-height:1.38;
  border-radius:18px 18px 18px 5px;
  background:#fff;
  border:1px solid rgba(15,23,42,.06);
  box-shadow:0 3px 9px rgba(15,23,42,.045);
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.bubble.image-bubble{
  padding:0;
  background:transparent;
  border:0;
  box-shadow:none;
  border-radius:16px;
  overflow:hidden;
}

.bubble.image-bubble img{
  display:block;
  width:100%;
  max-width:250px;
  max-height:310px;
  object-fit:cover;
  border-radius:16px;
  cursor:zoom-in;
}

.bubble.audio-bubble{
  padding:7px 9px;
  display:flex;
  align-items:center;
  gap:7px;
}

.bubble.audio-bubble audio{
  height:32px;
  width:205px;
}

.message.mine .bubble{
  color:#fff;
  border:0;
  border-radius:18px 18px 5px 18px;
  background:linear-gradient(145deg,#168fff,#0071e3);
}

.message.mine .bubble.image-bubble{
  background:transparent;
  border-radius:16px;
}

.message-meta{
  margin:3px 7px 0;
  color:var(--muted);
  font-size:10px;
}

.message.mine .message-meta{
  text-align:right;
}

.chat-input{
  flex:0 0 auto;
  display:flex;
  align-items:flex-end;
  gap:7px;
  padding:9px 10px;
  padding-bottom:max(9px,env(safe-area-inset-bottom));
  border-top:1px solid var(--line);
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(25px);
}

/* SMALLER CHAT BUTTONS */

.icon-btn{
  flex:0 0 auto;
  width:36px;
  height:36px;
  display:grid;
  place-items:center;
  border:1px solid var(--line);
  border-radius:50%;
  background:#fff;
  color:#667085;
  padding:0;
}

.icon-btn:hover{
  color:#0066d6;
  border-color:rgba(0,122,255,.35);
}

/* IMAGE BUTTON IS NEUTRAL, NOT BLUE */

#imageButton{
  background:transparent;
  border-color:transparent;
  color:#667085;
  box-shadow:none;
}

#imageButton:hover{
  background:rgba(0,122,255,.06);
  color:#007aff;
}

.chat-input textarea{
  flex:1;
  height:38px;
  max-height:115px;
  resize:none;
  border:1px solid var(--line);
  outline:0;
  border-radius:19px;
  padding:9px 14px;
  background:#f8fafc;
}

.chat-input .send-button{
  flex:0 0 auto;
  width:38px;
  height:38px;
  padding:0;
  display:grid;
  place-items:center;
  border-radius:50%;
  box-shadow:0 5px 15px rgba(0,122,255,.16);
}

.image-preview-bar{
  display:flex;
  align-items:center;
  gap:9px;
  padding:8px 10px 0;
}

.image-preview-bar img{
  width:48px;
  height:48px;
  object-fit:cover;
  border-radius:11px;
  border:1px solid var(--line);
}

.image-preview-bar button{
  border:0;
  background:none;
  color:#d92d20;
  font-weight:700;
  font-size:12px;
}

.recording-bar{
  display:flex;
  align-items:center;
  gap:9px;
  flex:1;
  padding:0 5px;
  color:#d92d20;
  font-weight:650;
  font-size:13px;
}

.recording-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#ff3b30;
  flex:0 0 auto;
  animation:pulseDot 1s ease-in-out infinite;
}

@keyframes pulseDot{
  0%,100%{opacity:1}
  50%{opacity:.25}
}

.recording-cancel{
  border:0;
  background:none;
  color:var(--muted);
  font-weight:650;
  font-size:12px;
  margin-left:auto;
}

.mobile-back{
  display:none;
  border:0;
  background:none;
  color:#111;
  padding:0;
  width:30px;
  height:30px;
  place-items:center;
}

/* PROFILE */

.profile-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.profile-head{
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:17px;
}

.file-button{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:8px 11px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#fff;
  cursor:pointer;
  font-size:13px;
}

.file-button input{
  display:none;
}

.mobile-nav{
  display:none;
}

/* MOBILE */

@media(max-width:800px){

  .layout{
    grid-template-columns:1fr;
  }

  .sidebar{
    display:none;
  }

  .topbar{
    height:62px;
    padding:0 16px;
  }

  .content{
    padding:14px 14px calc(var(--nav) + 16px);
  }

  .grid,
  .profile-grid{
    grid-template-columns:1fr;
  }

  .quick-grid{
    grid-template-columns:1fr;
  }

  .home-hero{
    padding:21px;
  }

  .home-orb{
    width:95px;
    height:95px;
  }

  .mobile-nav{
    position:fixed;
    z-index:100;
    left:0;
    right:0;
    bottom:0;
    height:var(--nav);
    display:grid;
    grid-template-columns:repeat(4,1fr);
    padding-bottom:env(safe-area-inset-bottom);
    background:rgba(255,255,255,.92);
    border-top:1px solid var(--line);
    backdrop-filter:blur(25px);
  }

  .mobile-nav button{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    border:0;
    background:none;
    color:#667085;
    font-size:10px;
  }

  .mobile-nav button.active{
    color:#007aff;
  }

  .chat-shell{
    height:calc(100dvh - 62px);
    display:block;
  }

  .chat-list{
    height:100%;
    border:0;
    padding-bottom:calc(var(--nav) + 10px);
  }

  .chat-window{
    display:none;
    height:calc(100dvh - 62px - var(--nav));
    min-height:0;
  }

  .chat-shell.show-chat .chat-list{

const $=s=>document.querySelector(s);

function esc(v){
  return String(v??"").replace(
    /[&<>"']/g,
    c=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c])
  );
}

function initials(p){
  return esc(
    (p?.display_name||p?.username||"?")
      .trim()
      .charAt(0)
      .toUpperCase()
  );
}

function avatar(p,cls="avatar"){
  if(p?.avatar_url){
    return `
      <div class="${cls}">
        <img src="${esc(p.avatar_url)}" alt="">
      </div>
    `;
  }

  return `
    <div class="${cls}">
      ${initials(p)}
    </div>
  `;
}

function totalUnread(){
  return Object.values(
    state.unreadByConversation
  ).reduce((a,b)=>a+b,0);

function ago(date){
  if(!date)return"";
  const sec=Math.floor(
    (Date.now()-new Date(date).getTime())/1000
  );

  if(sec<60)return"just now";
  if(sec<3600)return Math.floor(sec/60)+"m ago";
  if(sec<86400)return Math.floor(sec/3600)+"h ago";
  return Math.floor(sec/86400)+"d ago";
}

function clock(date){
  return new Date(date).toLocaleTimeString(
    [],
    {hour:"2-digit",minute:"2-digit"}
  );
}

function toast(message,onClick=null){
  const e=$("#toast");

  e.innerHTML=`<span>${esc(message)}</span>`;
  e.classList.remove("hidden");
  e.onclick=onClick;

  clearTimeout(window._toast);

  window._toast=setTimeout(
    ()=>e.classList.add("hidden"),
    3500
  );
}

function friendlyError(error){
  const m=error?.message||String(error||"Something went wrong.");

  if(/duplicate|unique/i.test(m))
    return"That username is already taken.";

  if(/row-level|permission denied/i.test(m))
    return"Supabase security rules rejected this action.";

  if(/blocked/i.test(m))
    return"This user is blocked.";

  return m;
}

/* =====================================================
   AUTH
===================================================== */

async function doAuth(event,mode){

  event.preventDefault();

  const username=$("#username").value.trim().toLowerCase();
  const password=$("#password").value;
  const errorBox=$("#authError");
  const button=$("#authBtn");

  errorBox.textContent="";

  if(!/^[a-z0-9_.]{3,20}$/.test(username)){
    errorBox.textContent=
      "Username must be 3–20 characters using letters, numbers, underscores or periods.";
    return;
  }

  if(password.length<8){
    errorBox.textContent=
      "Password must contain at least 8 characters.";
    return;
  }

  button.disabled=true;
  button.textContent="Please wait…";

  try{

    if(mode==="register"){

      const check=await db.rpc(
        "validate_username",
        {requested_username:username}
      );

      if(check.error)throw check.error;

      if(!check.data){
        throw new Error(
          "Username is already taken or unavailable."
        );
      }

      const result=await db.auth.signUp({
        email:authEmail(username),
        password,
        options:{
          data:{username}
        }
      });

      if(result.error)throw result.error;

      if(!result.data.session){
        throw new Error(
          "Account created, but email confirmation is enabled. Disable Confirm email in Supabase Authentication settings."
        );
      }

      await start(result.data.session);

    }else{

      const result=
        await db.auth.signInWithPassword({
          email:authEmail(username),
          password
        });

      if(result.error)throw result.error;

      await start(result.data.session);
    }

  }catch(error){

    console.error(error);

    errorBox.textContent=
      friendlyError(error);

  }finally{

    button.disabled=false;

    button.textContent=
      mode==="login"
      ?"Login"
      :"Create Account";
  }
}

async function loadData(){

}

async function loadFriends(){

  const result=
    await db
      .from("friendships")
      .select("id,user_id,friend_id,created_at")
      .or(
        `user_id.eq.${state.user.id},friend_id.eq.${state.user.id}`
      );

  if(result.error)throw result.error;

  const ids=(result.data||[]).map(
    row=>row.user_id===state.user.id
      ?row.friend_id
      :row.user_id
  );

  if(!ids.length){
    state.friends=[];
    return;
  }

  const profiles=
    await db
      .from("profiles")
      .select("*")
      .in("id",ids);

  if(profiles.error)throw profiles.error;

  state.friends=profiles.data||[];
}

async function loadRequests(){

  const result=
    await db
      .from("friend_requests")
      .select("*")
      .or(
        `sender_id.eq.${state.user.id},receiver_id.eq.${state.user.id}`
      )
      .order("created_at",{ascending:false});

  if(result.error)throw result.error;

  state.requests=result.data||[];
}

async function loadNotifications(){

  const result=
    await db
      .from("notifications")
      .select("*")
      .eq("user_id",state.user.id)
      .order("created_at",{ascending:false})
      .limit(50);

  state.notifications=result.error
    ?[]
    :(result.data||[]);
}


/* =====================================================
   CHATS
===================================================== */

async function loadChats(){

  const memberships=
    await db
      .from("conversation_members")
      .select("conversation_id,user_id")
      .eq("user_id",state.user.id);

  if(memberships.error){
    state.chats=[];
    return;
  }

  const ids=(memberships.data||[])
    .map(x=>x.conversation_id);

  if(!ids.length){
    state.chats=[];
    return;
  }

  const members=
    await db
      .from("conversation_members")
      .select("conversation_id,user_id")
      .in("conversation_id",ids);

  if(members.error){
    state.chats=[];
    return;
  }

  const otherIds=[
    ...new Set(
      (members.data||[])
        .filter(x=>x.user_id!==state.user.id)
        .map(x=>x.user_id)
    )
  ];

  if(!otherIds.length){
    state.chats=[];
    return;
  }

  const profiles=
    await db
      .from("profiles")
      .select("*")
      .in("id",otherIds);

  if(profiles.error){
    state.chats=[];
    return;
  }

  const map=new Map(
    (profiles.data||[]).map(
      p=>[p.id,p]
    )
  );

  state.chats=ids.map(conversationId=>{

    const member=(members.data||[]).find(
      x=>
        x.conversation_id===conversationId &&
        x.user_id!==state.user.id
    );

    if(!member)return null;

    const profile=map.get(member.user_id);

    if(!profile)return null;

    return{
      conversation_id:conversationId,
      profile
    };

  }).filter(Boolean);
}


/* =====================================================
   UNREAD
===================================================== */

async function loadUnreadCounts(){

  const ids=state.chats.map(
    x=>x.conversation_id
  );

  if(!ids.length){
    state.unreadByConversation={};
    return;
  }

  const result=
    await db
      .from("messages")
      .select("conversation_id")
      .in("conversation_id",ids)
      .neq("sender_id",state.user.id)
      .is("read_at",null);

  if(result.error)return;

  const counts={};

  (result.data||[]).forEach(row=>{
    counts[row.conversation_id]=
      (counts[row.conversation_id]||0)+1;
  });

  state.unreadByConversation=counts;
}

async function markConversationRead(id){

  if(!id)return;

  await db
    .from("messages")
    .update({
      read_at:new Date().toISOString()
    })
    .eq("conversation_id",id)
    .neq("sender_id",state.user.id)
    .is("read_at",null);

  delete state.unreadByConversation[id];
}


/* =====================================================
   REALTIME
   OPTIMIZED: DO NOT RELOAD THE WHOLE APP FOR EVERY MESSAGE
===================================================== */

function subscribe(){

  if(state.messageChannel)
    db.removeChannel(state.messageChannel);

  if(state.requestChannel)
    db.removeChannel(state.requestChannel);

  state.messageChannel=
    db
      .channel("messages-"+state.user.id)
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"messages"
        },
        async payload=>{

          const message=payload.new;

          const chat=state.chats.find(
            x=>
              x.conversation_id===
              message.conversation_id
          );

          const isActive=
            state.activeConversation===
            message.conversation_id;

          if(message.sender_id!==state.user.id){

            if(isActive){

              await markConversationRead(
                message.conversation_id
              );

              await loadMessages(true);

            }else{

              state.unreadByConversation[
                message.conversation_id
              ]=
                (state.unreadByConversation[
                  message.conversation_id
                ]||0)+1;

              renderNavBadges();

              notifyNewMessage(message);
            }
          }

          /*
             Only refresh the conversation list,
             not the complete application.
          */

          await loadChats();

          if(state.page==="messages"){
            renderChatListOnly();
          }
        }
      )
      .subscribe();


  state.requestChannel=
    db
      .channel("requests-"+state.user.id)
      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"friend_requests"
        },
        async()=>{
          await loadData();
          render();
        }
      )
      .subscribe();
}

function notifyNewMessage(message){

  const chat=state.chats.find(
    x=>
      x.conversation_id===
      message.conversation_id
  );

  const name=chat
    ?chat.profile.display_name||
      chat.profile.username
    :"Someone";

  const preview=
    message.image_url
    ?"📷 Sent a photo"
    :message.audio_url
    ?"🎤 Sent a voice message"
    :(message.message||"").slice(0,60);

  toast(
    `${name}: ${preview}`,
    ()=>{
      if(chat)
        chatWithFriend(chat.profile.id);
    }
  );
}

async function doSearch(){

  const query=$("#searchInput").value.trim().toLowerCase();
  const box=$("#results");

  if(!query){

    box.innerHTML=`
      <div class="empty">
        Enter a username.
      </div>
    `;

    return;
  }

  box.innerHTML=`
    <div class="empty">
      Searching…
    </div>
  `;

  const result=
    await db
      .from("profiles")
      .select("*")
      .ilike("username",`%${query}%`)
      .neq("id",state.user.id)
      .limit(30);

  if(result.error){

    box.innerHTML=`
      <div class="empty">
        ${esc(friendlyError(result.error))}
      </div>
    `;

    return;
  }

  if(!result.data?.length){

    box.innerHTML=`
      <div class="empty">
        No users found.
      </div>
    `;

    return;
  }

  box.innerHTML=result.data.map(userRow).join("");
}

async function sendRequest(userId){

  try{

    const result=
      await db.rpc(
        "send_friend_request",
        {target_user:userId}
      );

    if(result.error)throw result.error;

    await loadData();

    toast("Friend request sent.");

    if(state.page==="search")
      await doSearch();

  }catch(error){

    toast(friendlyError(error));
  }
}

async function cancelRequest(requestId){

  const result=
    await db
      .from("friend_requests")
      .delete()
      .eq("id",requestId)
      .eq("sender_id",state.user.id);

  if(result.error){
    toast(friendlyError(result.error));
    return;
  }

  await loadData();
  render();
}

async function acceptRequest(requestId){

  try{

    const result=
      await db.rpc(
        "accept_friend_request",
        {request_uuid:requestId}
      );

    if(result.error)throw result.error;

    await loadData();

    toast("Friend request accepted.");

    render();

  }catch(error){

    toast(friendlyError(error));
  }
}

async function rejectRequest(requestId){

  const result=
    await db
      .from("friend_requests")
      .update({status:"rejected"})
      .eq("id",requestId)
      .eq("receiver_id",state.user.id);

  if(result.error){
    toast(friendlyError(result.error));
    return;
  }

  await loadData();
  render();
}

async function chatWithFriend(userId){

  const friend=state.friends.find(
    x=>x.id===userId
  );

  if(!friend){

    toast(
      "This user is no longer in your friends list."
    );

    return;
  }

  state.activeChat=userId;
  state.activeChatProfile=friend;
  state.activeConversation=null;
  state.pendingImage=null;
  state.pendingAudio=null;
  state.page="messages";

  render();

  try{

    const result=
      await db.rpc(
        "create_private_conversation",
        {other_user:userId}
      );

    if(result.error)throw result.error;

    if(!result.data)
      throw new Error(
        "Supabase did not return a conversation ID."
      );

    state.activeConversation=result.data;

    await markConversationRead(
      state.activeConversation
    );

    await loadChats();

    /*
      Render once after the conversation is ready.
    */

    render();

    await loadMessages(true);

  }catch(error){

    console.error(error);

    state.activeChat=null;
    state.activeConversation=null;
    state.activeChatProfile=null;

    render();

    toast(friendlyError(error));
  }
}

function closeChat(){

  if(state.isRecording)
    cancelRecording();

  state.activeChat=null;
  state.activeConversation=null;
  state.activeChatProfile=null;

  clearPendingImage();
  clearPendingAudio();

  render();
}

async function loadMessages(scroll=false){

  if(!state.activeConversation)return;

  const box=$("#chatMessages");

  if(!box)return;

  const result=
    await db
      .from("messages")
      .select("*")
      .eq(
        "conversation_id",
        state.activeConversation
      )
      .order(
        "created_at",
        {ascending:true}
      );

  if(result.error){

    box.innerHTML=`
      <div class="empty">
        Unable to load messages.
        <br>
        <span class="small">
          ${esc(friendlyError(result.error))}
        </span>
      </div>
    `;

    return;
  }

  if(!result.data?.length){

    box.innerHTML=`
      <div
        class="empty"
        style="margin:auto">

        <div style="font-size:36px">
          👋
        </div>

        <b>
          Start the conversation
        </b>

        <p>
          Send your first message.
        </p>

      </div>
    `;

  }else{

    box.innerHTML=result.data.map(message=>{

      const mine=
        message.sender_id===state.user.id;

      let content;
      let cls="";

      if(message.deleted_at){

        content="<i>Message deleted</i>";

      }else if(message.image_url){

        cls="image-bubble";

        content=`
          <img
            src="${esc(message.image_url)}"
            alt="Photo"
            onclick="
              window.open(
                '${esc(message.image_url)}',
                '_blank'
              )
            ">
        `;

      }else if(message.audio_url){

        cls="audio-bubble";

        content=`
          <audio
            src="${esc(message.audio_url)}"
            controls
            preload="metadata">
          </audio>
        `;

      }else{

        content=esc(message.message);
      }

      return`

        <div
          class="message ${
            mine?"mine":""
          }">

          <div class="bubble ${cls}">
            ${content}
          </div>

          <div class="message-meta">

            ${clock(message.created_at)}

            ${
              mine
              ?message.read_at
                ?" · Read"
                :" · Sent"
              :""
            }

          </div>

        </div>
      `;

    }).join("");
  }

  if(scroll)
    box.scrollTop=box.scrollHeight;
}


/* =====================================================
   SEND MESSAGE
   FAST PATH
===================================================== */

async function sendMessage(event){

  event.preventDefault();

  const input=$("#chatInput");
  const text=input?.value.trim();

  if(!state.activeConversation)return;

  if(
    !text &&
    !state.pendingImage &&
    !state.pendingAudio
  )return;

  input.disabled=true;

  try{

    let imageUrl=null;
    let audioUrl=null;

    if(state.pendingImage)
      imageUrl=
        await uploadChatImage(
          state.pendingImage
        );

    if(state.pendingAudio)
      audioUrl=
        await uploadChatAudio(
          state.pendingAudio
        );

    const result=
      await db
        .from("messages")
        .insert({

          conversation_id:
            state.activeConversation,

          sender_id:
            state.user.id,

          message:
            text||null,

          image_url:
            imageUrl,

          audio_url:
            audioUrl

        })
        .select()
        .single();

    if(result.error)
      throw result.error;

    /*
      Clear the composer immediately.
    */

    input.value="";
    clearPendingImage();
    clearPendingAudio();

    /*
      Render the sent message immediately
      without rebuilding the entire application.
    */

    await loadMessages(true);

  }catch(error){

    console.error(
      "SEND MESSAGE:",
      error
    );

    toast(
      friendlyError(error)
    );

  }finally{

    input.disabled=false;
    input.focus();
  }
}

  if(!bar)return;

  bar.classList.remove("hidden");

  bar.innerHTML=`

      alt="">

    <span

      style="flex:1">
      ${esc(file.name)}
    </span>

      Remove

  `;
}

function clearPendingImage(){

  state.pendingImage=null;

  const bar=$("#imagePreviewBar");

  if(bar){

    bar.classList.add("hidden");

}

async function uploadChatImage(file){

  const extension=
    (
      file.name.split(".").pop()||
      "jpg"
    ).toLowerCase();

  const path=
    `${state.activeConversation}/${Date.now()}.${extension}`;

  const upload=
    await db
      .storage
      .from("chat-images")
      .upload(
        path,
        file,
        {
          upsert:false,
          contentType:file.type
        }
      );

  if(upload.error)
    throw upload.error;

  return db
    .storage
    .from("chat-images")
    .getPublicUrl(path)
    .data.publicUrl;
}


/* =====================================================
   VOICE
===================================================== */

function pickAudioMimeType(){

  const candidates=[
    "audio/mp4",
    "audio/webm;codecs=opus",
    "audio/webm",
    "audio/ogg;codecs=opus",
    "audio/aac"
  ];

  return candidates.find(
    type=>
      window.MediaRecorder &&
      MediaRecorder.isTypeSupported &&
      MediaRecorder.isTypeSupported(type)
  )||"";
}

async function toggleRecording(){

  if(state.isRecording)
    stopRecording();
  else
    await startRecording();
}

async function startRecording(){

  if(
    !navigator.mediaDevices||
    !window.MediaRecorder
  ){

    toast(
      "Voice messages aren't supported in this browser."
    );

    return;
  }

  clearPendingImage();

  try{

    const stream=
      await navigator.mediaDevices.getUserMedia({
        audio:true
      });

    const mimeType=
      pickAudioMimeType();

    const recorder=
      new MediaRecorder(
        stream,
        mimeType?{mimeType}:undefined
      );

    state.recordStream=stream;
    state.mediaRecorder=recorder;
    state.recordedChunks=[];
    state.discardRecording=false;

    recorder.ondataavailable=e=>{

      if(e.data&&e.data.size>0)
        state.recordedChunks.push(e.data);
    };

    recorder.onstop=onRecordingStopped;

    recorder.start();

    state.isRecording=true;
    state.recordStartedAt=Date.now();

    updateRecordingUI(true);

    state.recordTimerHandle=
      setInterval(
        tickRecordingTimer,
        500
      );

  }catch(error){

    console.error(error);

    toast(
      "Microphone access was denied or unavailable."
    );
  }
}

function tickRecordingTimer(){

  const box=$("#recordingTime");

  if(!box||!state.recordStartedAt)return;

  const sec=Math.floor(
    (Date.now()-state.recordStartedAt)/1000
  );

  box.textContent=
    `${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`;
}

function stopRecording(){

  if(
    state.mediaRecorder&&
    state.isRecording
  )
    state.mediaRecorder.stop();
}

function cancelRecording(){

  state.discardRecording=true;

  if(
    state.mediaRecorder&&
    state.isRecording
  )
    state.mediaRecorder.stop();
  else
    finishRecordingCleanup();
}

function onRecordingStopped(){

  const mimeType=
    state.mediaRecorder?.mimeType||
    "audio/webm";

  const discard=
    state.discardRecording;

  const blob=
    new Blob(
      state.recordedChunks,
      {type:mimeType}
    );

  const duration=Math.max(
    1,
    Math.round(
      (
        Date.now()-
        (state.recordStartedAt||Date.now())
      )/1000
    )
  );

  finishRecordingCleanup();

  if(
    discard||
    !state.recordedChunks.length
  )return;

  const extension=
    mimeType.includes("mp4")
    ?"m4a"
    :mimeType.includes("ogg")
    ?"ogg"
    :"webm";

  state.pendingAudio={
    blob,
    mimeType,
    extension,
    duration
  };

  showAudioPreview();
}

function finishRecordingCleanup(){

  if(state.recordTimerHandle){

    clearInterval(
      state.recordTimerHandle
    );

    state.recordTimerHandle=null;
  }

  if(state.recordStream){

    state.recordStream
      .getTracks()
      .forEach(t=>t.stop());

    state.recordStream=null;
  }

  state.mediaRecorder=null;
  state.isRecording=false;
  state.recordStartedAt=null;
  state.discardRecording=false;

  updateRecordingUI(false);
}

function updateRecordingUI(recording){

  const bar=$("#recordingBar");
  const input=$("#chatInput");
  const mic=$("#micBtn");

  if(bar)
    bar.classList.toggle(
      "hidden",
      !recording
    );

  if(input)
    input.classList.toggle(
      "hidden",
      recording
    );

  if(mic){

    mic.innerHTML=
      recording
      ?ICONS.stop
      :ICONS.mic;

    mic.title=
      recording
      ?"Stop recording"
      :"Record a voice message";
  }

  const time=$("#recordingTime");

  if(time)
    time.textContent="0:00";
}

function showAudioPreview(){

  const bar=$("#audioPreviewBar");

  if(!bar||!state.pendingAudio)return;

  const url=
    URL.createObjectURL(
      state.pendingAudio.blob
    );

  const sec=state.pendingAudio.duration;

  bar.classList.remove("hidden");

  bar.innerHTML=`

    <audio
      src="${url}"
      controls
      style="height:34px;flex:1">
    </audio>

    <span class="small muted">
      ${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}
    </span>

    <button
      type="button"
      onclick="clearPendingAudio()">
      Remove
    </button>

  `;
}

function clearPendingAudio(){

  state.pendingAudio=null;

  const bar=$("#audioPreviewBar");

  if(bar){

    bar.classList.add("hidden");
    bar.innerHTML="";
  }
}

async function uploadChatAudio(audio){

  const path=
    `${state.activeConversation}/${Date.now()}.${audio.extension}`;

  const upload=
    await db
      .storage
      .from("chat-audio")
      .upload(
        path,
        audio.blob,
        {
          upsert:false,
          contentType:audio.mimeType
        }
      );

  if(upload.error)
    throw upload.error;

  return db
    .storage
    .from("chat-audio")
    .getPublicUrl(path)
    .data.publicUrl;
}

   PROFILE
===================================================== */

function profile(){

  return`

    <div class="content">

      <div class="profile-grid">

        <div
          class="card"
          style="padding:20px">

          <div class="profile-head">

            ${avatar(
              state.profile,
              "big-avatar"
            )}

            <div>

              <b>
                @${esc(state.profile.username)}
              </b>

              <div class="muted">
                Joined
                ${new Date(
                  state.profile.created_at
                ).toLocaleDateString()}
              </div>

            </div>

          </div>

          <label class="file-button">

            ${ICONS.image}
            Change avatar

            <input
              id="avatarInput"
              type="file"
              accept="image/jpeg,image/png,image/webp">

          </label>

        </div>

        <div
          class="card"
          style="padding:20px">

          <form id="profileForm">

            <div class="field">

              <label>
                Display name
              </label>

              <input
                id="displayName"
                maxlength="50"
                value="${esc(
                  state.profile.display_name||""
                )}">

            </div>

            <div class="field">

              <label>
                Bio
              </label>

              <textarea
                id="bio"
                maxlength="250">${esc(
                  state.profile.bio||""
                )}</textarea>

            </div>

            <button class="primary">
              Save profile
            </button>

          </form>

        </div>

      </div>

    </div>
  `;
}

async function saveProfile(event){

  event.preventDefault();

  const result=
    await db
      .from("profiles")
      .update({
        display_name:
          $("#displayName").value.trim(),
        bio:
          $("#bio").value.trim()
      })
      .eq("id",state.user.id)
      .select()
      .single();

  if(result.error){

    toast(
      friendlyError(result.error)
    );

    return;
  }

  state.profile=result.data;

  toast("Profile updated.");

  render();
}

async function uploadAvatar(event){

  const file=event.target.files[0];

  if(!file)return;

  if(file.size>2*1024*1024){

    toast(
      "Avatar must be smaller than 2 MB."
    );

    return;
  }

  const extension=
    (
      file.name.split(".").pop()||
      "jpg"
    ).toLowerCase();

  const path=
    `${state.user.id}/avatar.${extension}`;

  const upload=
    await db
      .storage
      .from("avatars")
      .upload(
        path,
        file,
        {
          upsert:true,
          contentType:file.type
        }
      );

  if(upload.error){

    toast(
      friendlyError(upload.error)
    );

    return;
  }

  const publicUrl=
    db
      .storage
      .from("avatars")
      .getPublicUrl(path)
      .data
      .publicUrl+
    "?v="+Date.now();

  const result=
    await db
      .from("profiles")
      .update({
        avatar_url:publicUrl
      })
      .eq("id",state.user.id)
      .select()
      .single();

  if(result.error){

    toast(
      friendlyError(result.error)
    );

    return;
  }

  state.profile=result.data;

  toast("Avatar updated.");

  render();
}


/* =====================================================
   SETTINGS
===================================================== */

function settings(){

  const unread=

      n=>!n.is_read
    ).length;

  return`

    <div class="content">

      <div class="grid">

        <div
          class="card"
          style="padding:20px">

          <h3>
            Notifications

                unread notifications.

          style="padding:20px">

          <h3>
            Account
          </h3>

          <p class="muted">

            Logged in as

              @${esc(state.profile.username)}
            </b>

          </p>

          <button
            class="danger"

}

async function markRead(){

  const result=
    await db
      .from("notifications")
      .update({is_read:true})
      .eq("user_id",state.user.id)
      .eq("is_read",false);

  if(result.error){

    toast(
      friendlyError(result.error)
    );

    return;
  }

  await loadNotifications();
  render();
}


/* =====================================================
   PUBLIC PROFILE
===================================================== */

async function viewUser(userId){

  const result=
    await db
      .from("profiles")
      .select("*")
      .eq("id",userId)
      .single();

  if(result.error){

    toast(
      friendlyError(result.error)
    );

    return;
  }

  const profile=result.data;

  const modal=document.createElement("div");

  modal.className="profile-modal";

  modal.style.cssText=`
    position:fixed;
    inset:0;
    z-index:500;
    display:grid;
    place-items:center;
    padding:20px;
    background:rgba(0,0,0,.42);
    backdrop-filter:blur(12px);
  `;

  const isFriend=state.friends.some(
    f=>f.id===userId
  );

  modal.innerHTML=`

    <div
      class="card"
      style="
        width:min(430px,100%);
        padding:21px;
      ">

      <div
        style="
          display:flex;
          gap:14px;
          align-items:center;
        ">

        ${avatar(
          profile,
          "big-avatar"
        )}

        <div>

          <h3 style="margin:0">

            ${esc(
              profile.display_name||
              profile.username
            )}

          </h3>

          <div class="muted">
            @${esc(profile.username)}
          </div>

          <div
            class="status ${
              profile.online_status?"online":""
            }">

            ${
              profile.online_status
              ?"Online"
              :"Offline"
            }

          </div>

        </div>

      </div>

      <p
        class="muted"
        style="margin:18px 0">

        ${esc(
          profile.bio||
          "No bio yet."
        )}

      </p>

      <div class="user-actions">

        <button
          class="secondary"
          onclick="
            this.closest('.profile-modal').remove()
          ">
          Close
        </button>

        ${
          isFriend
          ?`
            <button
              class="primary"
              onclick="
                this.closest('.profile-modal').remove();
                chatWithFriend('${userId}');
              ">
              Chat
            </button>
          `
          :`
            <button
              class="primary"
              onclick="
                this.closest('.profile-modal').remove();
                sendRequest('${userId}');
              ">
              Add Friend
            </button>
          `
        }

      </div>

    </div>
  `;

  document.body.appendChild(modal);
}


/* =====================================================
   BIND EVENTS
===================================================== */

function bind(){

  const imageInput=
    $("#hiddenImageInput");

  if(
    imageInput&&
    !imageInput.dataset.bound
  ){

    imageInput.dataset.bound="1";
    imageInput.onchange=onImagePicked;
  }

  if(state.page==="search"){

    const button=$("#searchBtn");
    const input=$("#searchInput");

    if(button)
      button.onclick=doSearch;

    if(input){

      input.onkeydown=e=>{

        if(e.key==="Enter"){

          e.preventDefault();
          doSearch();

        }
      };
    }
  }

  if(state.page==="messages"){

    const form=$("#chatForm");
    const input=$("#chatInput");

    if(form)
      form.onsubmit=sendMessage;

    if(input){

      input.onkeydown=e=>{

        if(
          e.key==="Enter"&&
          !e.shiftKey
        ){

          e.preventDefault();
          sendMessage(e);

        }
      };
    }

    if(state.activeConversation)
      loadMessages(false);
  }

  if(state.page==="profile"){

    const form=$("#profileForm");
    const avatarInput=$("#avatarInput");

    if(form)
      form.onsubmit=saveProfile;

    if(avatarInput)
      avatarInput.onchange=uploadAvatar;
  }
}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

  try{
    await presence(false);
  }catch(error){
    console.warn(error);
  }

  if(state.messageChannel)
    db.removeChannel(state.messageChannel);

  if(state.requestChannel)
    db.removeChannel(state.requestChannel);

  await db.auth.signOut();

  state.session=null;
  state.user=null;
  state.profile=null;

  intro();
}


/* =====================================================
   AUTH STATE
===================================================== */

db.auth.onAuthStateChange(
  (event,session)=>{

    if(event==="SIGNED_OUT"){

      state.session=null;
      state.user=null;
      state.profile=null;

      intro();
    }
  }
);


/* =====================================================
   PRESENCE
===================================================== */

document.addEventListener(
  "visibilitychange",
  ()=>{

    if(
      state.user&&
      document.visibilityState==="visible"
    )
      presence(true);
  }
);

window.addEventListener(
  "beforeunload",
  ()=>{

    if(state.user)
      presence(false);
  }
);


/* =====================================================
   BOOT
===================================================== */

async function boot(){

  try{

    const result=
      await db.auth.getSession();

    if(result.error)
      throw result.error;

    if(result.data.session){

      await start(
        result.data.session
      );

    }else{

      intro();
    }

  }catch(error){

    console.error(
      "BOOT ERROR:",
      error
    );

    intro();

    toast(
      friendlyError(error)
    );
  }
}

boot();

</script>
