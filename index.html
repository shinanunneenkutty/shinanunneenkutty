<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nothing to see here</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      height: 100vh;
      overflow: hidden;
      background: #ffffff;
      color: #111111;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .message {
      font-size: clamp(32px, 6vw, 72px);
      font-weight: 500;
      letter-spacing: -2px;
      text-align: center;
      margin-bottom: 55px;
    }
    .running-area {
      position: relative;
      width: 100%;
      height: 45px;
      overflow: hidden;
    }
    .man {
      position: absolute;
      left: 0;
      font-size: 34px;
      line-height: 1;
      animation: run 5s linear infinite alternate;
    }
    @keyframes run {
      from {
        left: -50px;
        transform: scaleX(1);
      }
      to {
        left: calc(100% + 50px);
        transform: scaleX(-1);
      }
    }
  </style>
</head>
<body>
  <div class="message">
    Nothing to see here.
  </div>
  <div class="running-area">
    <div class="man">🏃</div>
  </div>
</body>
</html>
