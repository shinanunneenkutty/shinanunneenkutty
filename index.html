<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Under Maintenance</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at 50% 25%, #263238 0%, #11151a 35%, #050608 75%);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

/* =========================
   CITY
========================= */

.city {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 24%;
    background: #050608;
    z-index: 1;
}

.building {
    position: absolute;
    bottom: 0;
    background: #080a0d;
}

.b1 {
    left: 0;
    width: 12%;
    height: 65%;
}

.b2 {
    left: 10%;
    width: 13%;
    height: 90%;
}

.b3 {
    left: 22%;
    width: 11%;
    height: 55%;
}

.b4 {
    left: 31%;
    width: 15%;
    height: 82%;
}

.b5 {
    left: 45%;
    width: 12%;
    height: 62%;
}

.b6 {
    left: 56%;
    width: 14%;
    height: 88%;
}

.b7 {
    left: 69%;
    width: 12%;
    height: 58%;
}

.b8 {
    left: 80%;
    width: 14%;
    height: 80%;
}

.b9 {
    right: 0;
    width: 10%;
    height: 60%;
}

/* Windows */

.building::after {
    content: "▪ ▪ ▪ ▪ ▪ ▪ ▪ ▪";
    position: absolute;
    top: 15px;
    left: 15px;
    color: #303840;
    font-size: 13px;
    line-height: 25px;
    letter-spacing: 8px;
}

/* =========================
   MAIN CARD
========================= */

.container {
    position: relative;
    z-index: 10;
    width: 90%;
    max-width: 650px;
    text-align: center;
    padding: 35px 25px;
}

/* =========================
   BAT SIGNAL
========================= */

.signal {
    position: relative;
    margin: auto;
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: rgba(255,255,255,0.03);
    display: flex;
    justify-content: center;
    align-items: center;
    animation: pulse 3s infinite;
}

.signal::before {
    content: "";
    position: absolute;
    width: 135px;
    height: 135px;
    border-radius: 50%;
    background: rgba(255,255,255,0.07);
    box-shadow:
        0 0 30px rgba(255,255,255,0.15),
        0 0 70px rgba(255,255,255,0.08);
}

.bat-logo {
    position: relative;
    z-index: 2;
    font-size: 75px;
    filter: drop-shadow(0 0 15px rgba(255,255,255,0.35));
    animation: logoFloat 2.5s ease-in-out infinite;
}

@keyframes pulse {
    0%,100% {
        transform: scale(1);
        opacity: .75;
    }

    50% {
        transform: scale(1.08);
        opacity: 1;
    }
}

@keyframes logoFloat {
    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}

/* =========================
   TEXT
========================= */

h1 {
    margin-top: 25px;
    font-size: clamp(38px, 8vw, 70px);
    font-weight: 900;
    letter-spacing: 5px;
    text-transform: uppercase;
    text-shadow:
        0 0 10px rgba(255,255,255,.15),
        0 0 30px rgba(255,255,255,.08);
}

.subtitle {
    margin-top: 15px;
    font-size: clamp(18px, 4vw, 25px);
    color: #c7cbd0;
    letter-spacing: 2px;
}

.description {
    margin: 18px auto 0;
    max-width: 520px;
    color: #858b92;
    font-size: 15px;
    line-height: 1.7;
}

/* =========================
   LOADING
========================= */

.loading {
    margin: 30px auto 0;
    width: 180px;
    height: 4px;
    background: #22272d;
    border-radius: 10px;
    overflow: hidden;
}

.loading span {
    display: block;
    height: 100%;
    width: 45%;
    background: white;
    border-radius: 10px;
    animation: loading 1.8s infinite ease-in-out;
}

@keyframes loading {
    0% {
        transform: translateX(-120%);
    }

    100% {
        transform: translateX(420%);
    }
}

/* =========================
   BATMAN SILHOUETTES
========================= */

.batman {
    position: absolute;
    z-index: 5;
    font-size: 70px;
    filter: grayscale(1) brightness(0);
    animation: fly 9s linear infinite;
}

.batman.one {
    top: 15%;
    left: -100px;
    animation-delay: 0s;
}

.batman.two {
    top: 35%;
    left: -150px;
    font-size: 45px;
    animation-delay: 3s;
}

.batman.three {
    top: 55%;
    left: -120px;
    font-size: 55px;
    animation-delay: 6s;
}

@keyframes fly {
    0% {
        transform: translateX(-150px) translateY(0) rotate(0deg);
    }

    25% {
        transform: translateX(30vw) translateY(-35px) rotate(-5deg);
    }

    50% {
        transform: translateX(60vw) translateY(20px) rotate(5deg);
    }

    75% {
        transform: translateX(90vw) translateY(-30px) rotate(-5deg);
    }

    100% {
        transform: translateX(120vw) translateY(0) rotate(0deg);
    }
}

/* =========================
   FOOTER
========================= */

.footer {
    position: absolute;
    bottom: 25px;
    width: 100%;
    text-align: center;
    color: #555b62;
    font-size: 12px;
    letter-spacing: 1px;
    z-index: 20;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .container {
        padding: 20px;
    }

    .signal {
        width: 120px;
        height: 120px;
    }

    .signal::before {
        width: 105px;
        height: 105px;
    }

    .bat-logo {
        font-size: 60px;
    }

    h1 {
        letter-spacing: 3px;
    }

    .description {
        font-size: 14px;
    }

    .city {
        height: 18%;
    }

    .batman {
        font-size: 45px;
    }
}
</style>
</head>

<body>

<!-- Flying Batman-style characters -->
<div class="batman one">🦇</div>
<div class="batman two">🦇</div>
<div class="batman three">🦇</div>

<!-- Main content -->
<div class="container">

    <div class="signal">
        <div class="bat-logo">🦇</div>
    </div>

    <h1>Under Maintenance</h1>

    <div class="subtitle">
        We'll Be Back Soon
    </div>

    <p class="description">
        Our website is currently undergoing some improvements.
        We're working behind the scenes to make everything better.
        Please check back soon.
    </p>

    <div class="loading">
        <span></span>
    </div>

</div>

<!-- Gotham-style skyline -->
<div class="city">
    <div class="building b1"></div>
    <div class="building b2"></div>
    <div class="building b3"></div>
    <div class="building b4"></div>
    <div class="building b5"></div>
    <div class="building b6"></div>
    <div class="building b7"></div>
    <div class="building b8"></div>
    <div class="building b9"></div>
</div>

<div class="footer">
    © 2026 • Website temporarily unavailable
</div>

</body>
</html>
