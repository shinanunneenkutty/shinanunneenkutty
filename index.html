<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coming Soon</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0b0f2b;
    --navy-deep:#060814;
    --red:#e63a3a;
    --blue:#2b6cff;
    --web:#c9d3ff;
    --gold:#ffcf4d;
  }

  *{box-sizing:border-box;}

  html,body{
    height:100%;
    margin:0;
    background: radial-gradient(circle at 50% 30%, #131a44 0%, var(--navy) 45%, var(--navy-deep) 100%);
    overflow:hidden;
    font-family:'Space Grotesk',sans-serif;
  }

  .stage{
    position:relative;
    height:100vh;
    width:100vw;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }

  /* ---- background web lines ---- */
  .web-bg{
    position:absolute;
    inset:0;
    opacity:0.15;
    background-image:
      repeating-linear-gradient(45deg, var(--web) 0 1px, transparent 1px 80px),
      repeating-linear-gradient(-45deg, var(--web) 0 1px, transparent 1px 80px);
    animation: drift 30s linear infinite;
  }
  @keyframes drift{
    from{ background-position: 0 0, 0 0; }
    to{ background-position: 400px 400px, -400px 400px; }
  }

  /* ---- corner web decoration ---- */
  .corner-web{
    position:absolute;
    top:-40px; left:-40px;
    width:220px; height:220px;
    opacity:0.5;
  }
  .corner-web svg{ width:100%; height:100%; }
  .corner-web.right{ left:auto; right:-40px; transform:scaleX(-1); }

  /* ---- hero character ---- */
  .hero-wrap{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    animation: float 4s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{ transform:translateY(0px); }
    50%{ transform:translateY(-14px); }
  }

  .glow{
    position:absolute;
    width:280px; height:280px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(230,58,58,0.35) 0%, rgba(43,108,255,0.15) 45%, transparent 70%);
    filter: blur(10px);
    z-index:0;
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ transform:scale(1); opacity:0.8; }
    50%{ transform:scale(1.15); opacity:1; }
  }

  .character{
    position:relative;
    z-index:1;
    width:190px;
  }

  /* body/suit */
  .body{
    width:150px;
    height:180px;
    margin:0 auto;
    background: linear-gradient(180deg, var(--red) 0%, var(--red) 55%, var(--blue) 55%, var(--blue) 100%);
    border-radius: 70px 70px 40px 40px;
    position:relative;
    box-shadow: inset -10px 0 20px rgba(0,0,0,0.25);
    overflow:hidden;
  }
  .body::before, .body::after{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      repeating-linear-gradient(60deg, rgba(0,0,0,0.15) 0 2px, transparent 2px 22px),
      repeating-linear-gradient(-60deg, rgba(0,0,0,0.15) 0 2px, transparent 2px 22px);
    mix-blend-mode:multiply;
  }

  /* head */
  .head{
    width:120px;
    height:110px;
    background: var(--red);
    border-radius:50% 50% 46% 46%;
    margin:0 auto -18px auto;
    position:relative;
    z-index:2;
    box-shadow: inset -8px -6px 18px rgba(0,0,0,0.25);
    overflow:hidden;
  }
  .head::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      repeating-linear-gradient(55deg, rgba(0,0,0,0.18) 0 2px, transparent 2px 18px),
      repeating-linear-gradient(-55deg, rgba(0,0,0,0.18) 0 2px, transparent 2px 18px);
  }

  .eye{
    position:absolute;
    top:38px;
    width:38px;
    height:24px;
    background: white;
    border-radius: 40% 60% 60% 40% / 60% 60% 40% 40%;
    box-shadow: 0 0 0 4px var(--navy-deep);
    animation: blink 4.5s ease-in-out infinite;
  }
  .eye.left{ left:18px; transform:rotate(-8deg); }
  .eye.right{ right:18px; transform:rotate(8deg); }
  @keyframes blink{
    0%, 92%, 100%{ transform-origin:center; transform:scaleY(1) rotate(var(--r,0)); }
    95%{ transform:scaleY(0.1); }
  }
  .eye.left{ --r:-8deg; }
  .eye.right{ --r:8deg; }

  /* waving arm */
  .arm{
    position:absolute;
    top:70px;
    right:-38px;
    width:36px;
    height:100px;
    background: linear-gradient(180deg, var(--blue), var(--red));
    border-radius: 20px;
    transform-origin: top center;
    animation: wave 1.4s ease-in-out infinite;
    z-index:3;
    box-shadow: inset -4px 0 10px rgba(0,0,0,0.2);
  }
  .hand{
    position:absolute;
    bottom:-14px;
    left:50%;
    transform:translateX(-50%);
    width:26px;
    height:26px;
    background:#f2c39a;
    border-radius:50%;
  }
  @keyframes wave{
    0%,100%{ transform:rotate(10deg); }
    50%{ transform:rotate(55deg); }
  }

  /* speech bubble */
  .bubble{
    position:absolute;
    top:-58px;
    right:-70px;
    background:white;
    color: var(--navy-deep);
    font-family:'Bangers', cursive;
    font-size:30px;
    letter-spacing:1px;
    padding:8px 22px 10px;
    border-radius:20px;
    box-shadow:0 6px 18px rgba(0,0,0,0.35);
    animation: pop 2.6s ease-in-out infinite;
    z-index:4;
  }
  .bubble::after{
    content:"";
    position:absolute;
    bottom:-12px;
    left:26px;
    width:0; height:0;
    border:12px solid transparent;
    border-top-color:white;
    border-bottom:0;
  }
  @keyframes pop{
    0%,20%{ transform:scale(0) rotate(-8deg); opacity:0; }
    30%{ transform:scale(1.15) rotate(-4deg); opacity:1; }
    38%{ transform:scale(1) rotate(-4deg); }
    85%{ transform:scale(1) rotate(-4deg); opacity:1; }
    100%{ transform:scale(0.9) rotate(-4deg); opacity:0; }
  }

  /* ---- footer text ---- */
  .footer{
    margin-top:52px;
    text-align:center;
  }
  .wip{
    font-family:'Bangers', cursive;
    font-size:clamp(28px, 6vw, 46px);
    letter-spacing:4px;
    background: linear-gradient(90deg, var(--gold), var(--red) 50%, var(--blue));
    background-size:200% auto;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation: shine 3.5s linear infinite;
    margin:0;
  }
  @keyframes shine{
    to{ background-position:200% center; }
  }
  .sub{
    margin-top:8px;
    font-size:14px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:#8fa0d9;
  }

  .dots span{
    display:inline-block;
    width:6px;height:6px;
    margin-left:4px;
    border-radius:50%;
    background:var(--gold);
    animation: dotFade 1.4s infinite;
  }
  .dots span:nth-child(2){ animation-delay:0.2s; }
  .dots span:nth-child(3){ animation-delay:0.4s; }
  @keyframes dotFade{
    0%,80%,100%{ opacity:0.2; }
    40%{ opacity:1; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="web-bg"></div>

  <div class="corner-web">
    <svg viewBox="0 0 200 200"><g stroke="#c9d3ff" stroke-width="1" fill="none">
      <path d="M0,0 L200,140 M0,0 L160,200 M0,0 L200,60 M0,0 L60,200"/>
      <path d="M0,20 Q40,40 20,0 M0,60 Q70,80 60,20 M0,100 Q100,120 100,40 M0,140 Q130,160 140,60"/>
    </g></svg>
  </div>
  <div class="corner-web right">
    <svg viewBox="0 0 200 200"><g stroke="#c9d3ff" stroke-width="1" fill="none">
      <path d="M0,0 L200,140 M0,0 L160,200 M0,0 L200,60 M0,0 L60,200"/>
      <path d="M0,20 Q40,40 20,0 M0,60 Q70,80 60,20 M0,100 Q100,120 100,40 M0,140 Q130,160 140,60"/>
    </g></svg>
  </div>

  <div class="hero-wrap">
    <div class="glow"></div>
    <div class="character">
      <div class="bubble">Hi!</div>
      <div class="head">
        <div class="eye left"></div>
        <div class="eye right"></div>
      </div>
      <div class="body"></div>
      <div class="arm"><div class="hand"></div></div>
    </div>
  </div>

  <div class="footer">
    <p class="wip">WORK IN PROGRESS</p>
    <div class="sub">something new is being spun<span class="dots"><span></span><span></span><span></span></span></div>
  </div>
</div>
</body>
</html>
