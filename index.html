<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f9fc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Connect</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --blue:#007aff;
  --blue2:#005fe8;
  --ink:#0b0d10;
  --muted:#667085;
  --bg:#f5f7fb;
  --card:rgba(255,255,255,.76);
  --line:rgba(15,23,42,.09);
  --green:#22c55e;
  --red:#ff3b30;
  --nav:72px;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(
      circle at 5% 0%,
      rgba(0,122,255,.12),
      transparent 28%
    ),
    radial-gradient(
      circle at 100% 20%,
      rgba(0,95,232,.08),
      transparent 30%
    ),
    var(--bg);
  color:var(--ink);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Segoe UI",
    sans-serif;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.primary{
  border:0;
  border-radius:15px;
  padding:12px 17px;
  color:#fff;
  font-weight:750;
  background:linear-gradient(
    180deg,
    #168cff,
    #0071e3
  );
  box-shadow:
    0 9px 25px rgba(0,122,255,.22);
}

.secondary{
  border:1px solid var(--line);
  border-radius:15px;
  padding:11px 15px;
  background:#fff;
  color:var(--ink);
}

.danger{
  border:1px solid rgba(255,59,48,.15);
  border-radius:15px;
  padding:11px 15px;
  background:rgba(255,59,48,.08);
  color:#d92d20;
}

.card{
  border:1px solid rgba(255,255,255,.9);
  border-radius:24px;
  background:var(--card);
  box-shadow:
    0 15px 45px rgba(15,23,42,.065);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
}

.muted{
  color:var(--muted);
}

.small{
  font-size:12px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:30px 15px;
}

.avatar{
  width:44px;
  height:44px;
  flex:0 0 auto;
  border-radius:50%;
  display:grid;
  place-items:center;
  overflow:hidden;
  background:
    linear-gradient(
      145deg,
      #dbeafe,
      #bfdbfe
    );
  color:#0757b8;
  font-weight:800;
}

.avatar img,
.big-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.big-avatar{
  width:92px;
  height:92px;
  border-radius:50%;
  display:grid;
  place-items:center;
  overflow:hidden;
  background:
    linear-gradient(
      145deg,
      #dbeafe,
      #bfdbfe
    );
  color:#0757b8;
  font-size:28px;
  font-weight:800;
}

.status{
  font-size:12px;
  color:var(--muted);
}

.status.online{
  color:#16a34a;
}

.status.online:before{
  content:"";
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#22c55e;
  margin-right:5px;
}

.toast{
  position:fixed;
  z-index:9999;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  max-width:90vw;
  padding:13px 17px;
  border-radius:16px;
  color:#fff;
  background:rgba(20,22,26,.94);
  box-shadow:
    0 18px 50px rgba(0,0,0,.25);
}

.nav-message-wrap{
  position:relative;
  display:inline-flex;
  align-items:center;
}

.nav-dot{
  position:absolute;
  right:-7px;
  top:-5px;
  min-width:17px;
  height:17px;
  padding:0 4px;
  border-radius:99px;
  display:grid;
  place-items:center;
  background:#ff3b30;
  color:white;
  font-size:9px;
  font-weight:800;
  border:2px solid white;
}

.chat-unread{
  min-width:20px;
  height:20px;
  padding:0 5px;
  display:grid;
  place-items:center;
  border-radius:99px;
  background:#007aff;
  color:white;
  font-size:10px;
  font-weight:800;
}

.new-message-toast{
  display:flex;
  align-items:center;
  gap:10px;
}

.new-message-toast .toast-icon{
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  border-radius:11px;
  background:#007aff;
  color:#fff;
}

.chat-image{
  width:min(245px,78vw);
  max-height:280px;
  object-fit:cover;
  display:block;
  border-radius:20px;
  cursor:pointer;
}

.image-picker,
.chat-input .send-button{
  width:42px;
  height:42px;
  flex-basis:42px;
  flex-shrink:0;
  display:grid;
  place-items:center;
}

.image-picker{
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
  color:#007aff;
  cursor:pointer;
}

.image-picker:hover{
  background:#f1f7ff;
}

.message{
  max-width:78%!important;
}

.message .bubble{
  padding:8px 12px;
  border-radius:22px;
}

.message.mine .bubble{
  border-radius:22px 22px 6px 22px;
}

.message:not(.mine) .bubble{
  border-radius:22px 22px 22px 6px;
}

.image-bubble{
  padding:5px!important;
  overflow:hidden;
  background:#fff!important;
}

.message.mine .image-bubble{
  background:#fff!important;
}

.message-meta{
  margin-top:3px;
}

.landing{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:25px;
}

.hero{
  text-align:center;
  width:min(760px,100%);
}

.logo{
  width:70px;
  height:70px;
  margin:0 auto 22px;
  border-radius:23px;
  display:grid;
  place-items:center;
  color:#fff;
  font-size:30px;
  font-weight:900;
  background:
    linear-gradient(
      145deg,
      #168cff,
      #0057d9
    );
  box-shadow:
    0 20px 45px rgba(0,122,255,.28);
}

.hero h1{
  font-size:clamp(43px,8vw,75px);
  line-height:.98;
  letter-spacing:-.065em;
  margin:0;
  font-weight:850;
}

.hero p{
  max-width:600px;
  margin:22px auto 30px;
  color:var(--muted);
  font-size:18px;
  line-height:1.55;
}

.hero-buttons{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
}

.auth{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
}

.auth-card{
  width:min(430px,100%);
  padding:27px;
  border-radius:28px;
  background:rgba(255,255,255,.8);
  box-shadow:
    0 20px 60px rgba(15,23,42,.12);
  backdrop-filter:blur(30px);
}

.back{
  border:0;
  background:none;
  color:var(--muted);
  padding:0;
  margin-bottom:20px;
}

.auth-card h2{
  margin:0 0 7px;
  font-size:29px;
}

.auth-card>p{
  color:var(--muted);
  line-height:1.5;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}

.field input,
.field textarea{
  width:100%;
  border:1px solid var(--line);
  outline:0;
  border-radius:14px;
  padding:13px;
  background:#f8fafc;
}

.field input:focus,
.field textarea:focus,
.search input:focus,
.chat-input textarea:focus{
  border-color:rgba(0,122,255,.55);
  box-shadow:
    0 0 0 4px rgba(0,122,255,.1);
  background:#fff;
}

.form-error{
  min-height:20px;
  color:#d92d20;
  font-size:13px;
  margin:5px 0 10px;
}

.layout{
  min-height:100vh;
  display:grid;
  grid-template-columns:285px 1fr;
}

.sidebar{
  display:flex;
  flex-direction:column;
  gap:16px;
  padding:18px;
  background:rgba(255,255,255,.68);
  border-right:1px solid var(--line);
  backdrop-filter:blur(30px);
}

.brand{
  font-size:23px;
  font-weight:900;
  letter-spacing:-.045em;
  padding:5px;
}

.my-profile{
  display:flex;
  align-items:center;
  gap:11px;
  padding:10px;
  border:1px solid var(--line);
  border-radius:18px;
  background:rgba(255,255,255,.8);
  cursor:pointer;
}

.my-info{
  min-width:0;
}

.my-info b,
.my-info span{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.nav{
  display:grid;
  gap:5px;
}

.nav button{
  position:relative;
  border:0;
  border-radius:14px;
  padding:12px;
  color:#667085;
  background:transparent;
  text-align:left;
  font-weight:650;
}

.nav button.active,
.nav button:hover{
  color:#0066d6;
  background:rgba(0,122,255,.09);
}

.badge{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  min-width:20px;
  padding:2px 6px;
  border-radius:99px;
  background:var(--blue);
  color:#fff;
  font-size:11px;
  text-align:center;
}

.sidebar-bottom{
  margin-top:auto;
}

.main{
  min-width:0;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:74px;
  display:flex;
  align-items:center;
  padding:0 23px;
  border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(25px);
}

.topbar h2{
  margin:0;
  font-size:22px;
  letter-spacing:-.04em;
}

.content{
  flex:1;
  overflow:auto;
  padding:25px;
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap:16px;
}

.card{
  padding:19px;
}

.card h3{
  margin:0 0 7px;
}

.home-hero{
  padding:27px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.9),
      rgba(233,243,255,.72)
    );
  overflow:hidden;
}

.home-hero h1{
  font-size:clamp(30px,5vw,48px);
  letter-spacing:-.055em;
  margin:0 0 10px;
}

.home-hero p{
  margin:0 0 20px;
  color:var(--muted);
  max-width:590px;
  line-height:1.5;
}

.home-orb{
  width:170px;
  height:170px;
  flex:0 0 auto;
  border-radius:50%;
  background:
    radial-gradient(
      circle at 30% 25%,
      #fff,
      rgba(0,122,255,.35) 35%,
      rgba(0,75,190,.85)
    );
  box-shadow:
    0 25px 55px rgba(0,122,255,.22);
}

.stat{
  padding:20px;
}

.stat strong{
  display:block;
  font-size:34px;
  letter-spacing:-.05em;
}

.stat span{
  color:var(--muted);
  font-size:13px;
}

.quick-grid{
  display:grid;
  grid-template-columns:
    repeat(3,1fr);
  gap:12px;
  margin-top:16px;
}

.quick{
  padding:17px;
  border:1px solid var(--line);
  border-radius:18px;
  background:rgba(255,255,255,.72);
  cursor:pointer;
}

.quick b{
  display:block;
  margin-bottom:5px;
}

.quick span{
  color:var(--muted);
  font-size:13px;
}

.search{
  display:flex;
  gap:9px;
  margin-bottom:17px;
}

.search input{
  flex:1;
  min-width:0;
  border:1px solid var(--line);
  outline:0;
  border-radius:14px;
  padding:13px;
  background:#f8fafc;
}

.user-list{
  display:grid;
  gap:9px;
}

.user-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  border:1px solid var(--line);
  border-radius:18px;
  background:rgba(255,255,255,.72);
}

.user-info{
  flex:1;
  min-width:0;
}

.user-info b,
.user-info span{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.user-actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.chat-shell{
  height:calc(100vh - 74px);
  display:grid;
  grid-template-columns:310px 1fr;
}

.chat-list{
  overflow:auto;
  padding:12px;
  border-right:1px solid var(--line);
  background:rgba(255,255,255,.48);
}

.chat-item{
  width:100%;
  display:flex;
  align-items:center;
  gap:10px;
  border:0;
  border-radius:17px;
  padding:11px;
  background:transparent;
  text-align:left;
}

.chat-item:hover,
.chat-item.active{
  background:rgba(0,122,255,.09);
}

.chat-preview{
  min-width:0;
  flex:1;
}

.chat-preview b,
.chat-preview span{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.chat-window{
  min-width:0;
  display:flex;
  flex-direction:column;
  background:rgba(248,250,253,.5);
  min-height:0;
}

.chat-header{
  height:70px;
  flex:0 0 70px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:10px 16px;
  border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.68);
  backdrop-filter:blur(24px);
}

.chat-header-info{
  min-width:0;
}

.chat-header-info b{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.chat-messages{
  flex:1;
  min-height:0;
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:5px;
  padding:15px 18px;
}

.message{
  align-self:flex-start;
  max-width:min(78%,560px);
}

.message.mine{
  align-self:flex-end;
}

.bubble{
  padding:8px 12px;
  border-radius:22px 22px 22px 6px;
  background:#fff;
  border:1px solid rgba(15,23,42,.06);
  box-shadow:
    0 3px 12px rgba(15,23,42,.045);
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  line-height:1.38;
}

.message.mine .bubble{
  color:#fff;
  border:0;
  border-radius:22px 22px 6px 22px;
  background:
    linear-gradient(
      145deg,
      #168fff,
      #0071e3
    );
}

.message-meta{
  margin:3px 6px;
  color:var(--muted);
  font-size:10px;
}

.message.mine .message-meta{
  text-align:right;
}

.chat-input{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px 12px;
  border-top:1px solid var(--line);
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(25px);
  padding-bottom:
    max(
      9px,
      env(safe-area-inset-bottom)
    );
}

.chat-input textarea{
  flex:1;
  height:42px;
  max-height:120px;
  resize:none;
  border:1px solid var(--line);
  outline:0;
  border-radius:21px;
  padding:10px 14px;
  background:#f8fafc;
}

.mobile-back{
  display:none;
  border:0;
  background:none;
  font-size:30px;
  color:#111;
}

.profile-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.profile-head{
  display:flex;
  align-items:center;
  gap:16px;
  margin-bottom:18px;
}

.file-button{
  display:inline-block;
  padding:9px 12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
  cursor:pointer;
  font-size:13px;
}

.file-button input{
  display:none;
}

.mobile-nav{
  display:none;
}

@media(max-width:800px){

  .layout{
    grid-template-columns:1fr;
  }

  .sidebar{
    display:none;
  }

  .topbar{
    height:62px;
    padding:0 17px;
  }

  .content{
    padding:
      15px
      15px
      calc(
        var(--nav) + 18px
      );
  }

  .grid,
  .profile-grid{
    grid-template-columns:1fr;
  }

  .quick-grid{
    grid-template-columns:1fr;
  }

  .home-hero{
    padding:22px;
  }

  .home-orb{
    width:105px;
    height:105px;
  }

  .mobile-nav{
    position:fixed;
    z-index:100;
    left:0;
    right:0;
    bottom:0;
    height:var(--nav);
    display:grid;
    grid-template-columns:
      repeat(4,1fr);
    padding-bottom:
      env(safe-area-inset-bottom);
    background:rgba(255,255,255,.9);
    border-top:1px solid var(--line);
    backdrop-filter:blur(25px);
  }

  .mobile-nav button{
    border:0;
    background:none;
    color:#667085;
    font-size:11px;
  }

  .mobile-nav button.active{
    color:#007aff;
  }

  .mobile-nav span{
    display:block;
    font-size:20px;
    margin-bottom:2px;
  }

  .chat-shell{
    height:
      calc(
        100dvh - 62px
      );
    display:block;
  }

  .chat-list{
    height:100%;
    border:0;
    padding-bottom:
      calc(
        var(--nav) + 10px
      );
  }

  .chat-window{
    display:none;
    height:
      calc(
        100dvh -
        62px -
        var(--nav)
      );
    min-height:0;
  }

  .chat-shell.show-chat
  .chat-list{
    display:none;
  }

  .chat-shell.show-chat
  .chat-window{
    display:flex;
  }

  .mobile-back{
    display:block;
  }

  .message{
    max-width:84%;
  }

  .chat-messages{
    padding:
      12px 10px;
  }

  .chat-input{
    padding:
      7px 9px
      max(
        7px,
        env(safe-area-inset-bottom)
      );
  }

  .chat-input textarea{
    height:42px;
  }

  .chat-input .primary{
    padding:
      10px;
  }

  .image-picker,
  .chat-input .send-button{
    width:42px;
    height:42px;
    flex-basis:42px;
  }

  .user-row{
    flex-wrap:wrap;
  }

  .user-actions{
    width:100%;
  }

  .user-actions button{
    flex:1;
  }

  .hero h1{
    font-size:43px;
  }

  .hero p{
    font-size:16px;
  }

  .chat-image{
    width:min(230px,72vw);
    max-height:250px;
  }
}
</style>
</head>

<body>

<div id="app"></div>

<div id="toast" class="toast hidden"></div>

<script>

const SUPABASE_URL =
  "https://cfcwsazbnsklqgsgdwea.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_e2qODCX9-2UILTL5ibZ8Lg_NGtR8-t8";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
      }
    }
  );


const state = {
  session:null,
  user:null,
  profile:null,
  page:"home",
  friends:[],
  requests:[],
  notifications:[],
  chats:[],
  activeChat:null,
  activeConversation:null,
  activeChatProfile:null,
  messageChannel:null,
  requestChannel:null,
  notificationChannel:null,
  unreadTotal:0,
  unreadByConversation:{},
  requestProfiles:{}
};


const $ =
  selector =>
    document.querySelector(selector);


function esc(value){
  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    char => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[char])
  );
}


function avatar(
  profile,
  className="avatar"
){

  if(profile?.avatar_url){

    return `
      <div class="${className}">
        <img
          src="${esc(profile.avatar_url)}"
          alt="">
      </div>
    `;

  }

  return `
    <div class="${className}">
      ${
        esc(
          (
            profile?.display_name ||
            profile?.username ||
            "?"
          )
          .trim()
          .charAt(0)
          .toUpperCase()
        )
      }
    </div>
  `;

}


function ago(date){

  if(!date)
    return "";

  const seconds =
    Math.floor(
      (
        Date.now() -
        new Date(date).getTime()
      ) / 1000
    );

  if(seconds < 60)
    return "just now";

  if(seconds < 3600)
    return Math.floor(
      seconds / 60
    ) + "m ago";

  if(seconds < 86400)
    return Math.floor(
      seconds / 3600
    ) + "h ago";

  return Math.floor(
    seconds / 86400
  ) + "d ago";

}


function clock(date){

  return new Date(
    date
  ).toLocaleTimeString(
    [],
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


function toast(
  message,
  type=""
){

  const element =
    $("#toast");

  element.innerHTML =
    message;

  element.className =
    "toast " + type;

  clearTimeout(
    window._toast
  );

  window._toast =
    setTimeout(
      () =>
        element.classList.add(
          "hidden"
        ),
      3500
    );

}


function err(e){

  let m =
    e?.message ||
    String(
      e ||
      "Something went wrong."
    );

  if(
    /duplicate|unique/i
      .test(m)
  )
    return "That username is already taken.";

  if(
    /row-level|permission denied/i
      .test(m)
  )
    return "Supabase security rules rejected this action.";

  if(
    /blocked/i.test(m)
  )
    return "This user is blocked.";

  return m;

}

async function doAuth(
  event,
  mode
){

  event.preventDefault();

  const username =
    $("#username")
      .value
      .trim()
      .toLowerCase();

  const password =
    $("#password")
      .value;

  const errorBox =
    $("#authError");

  const button =
    $("#authBtn");

  errorBox.textContent =
    "";

  if(
    !/^[a-z0-9_.]{3,20}$/
      .test(username)
  ){

    errorBox.textContent =
      "Username must be 3–20 characters using letters, numbers, underscores or periods.";

    return;

  }

  if(
    password.length < 8
  ){

    errorBox.textContent =
      "Password must contain at least 8 characters.";

    return;

  }

  button.disabled =
    true;

  button.textContent =
    "Please wait…";

  try{

    if(
      mode === "register"
    ){

      const {
        data:available,
        error:validateError
      } =
        await db.rpc(
          "validate_username",
          {
            requested_username:
              username
          }
        );

      if(validateError)
        throw validateError;

      if(!available){

        throw new Error(
          "Username is already taken or unavailable."
        );

      }

      const {
        data,
        error
      } =
        await db.auth.signUp({

          email:
            authEmail(
              username
            ),

          password,

          options:{
            data:{
              username
            }
          }

        });

      if(error)
        throw error;

      if(!data.session){

        throw new Error(
          "Account created, but email confirmation is enabled. Disable Confirm email in Supabase Authentication settings."
        );

      }

      await start(
        data.session
      );

    }else{

      const {
        data,
        error
      } =
        await db.auth
          .signInWithPassword({

            email:
              authEmail(
                username
              ),

            password

          });

      if(error)
        throw error;

      await start(
        data.session
      );

    }

  }catch(error){

    console.error(
      "AUTH ERROR:",
      error
    );

    errorBox.textContent =
      err(
        error
      );

  }finally{

    button.disabled =
      false;

    button.textContent =
      mode === "login"
      ? "Login"
      : "Create Account";

  }

}

async function presence(
  online
){

    return;

  const {
    data
  } =
    await db
      .from("profiles")
      .update({

        online_status:
          online,

        last_seen:
          new Date()
            .toISOString()

      )
      .select()
      .single();

  if(data)
    state.profile =

}

async function loadData(){

    loadFriends(),
    loadRequests(),
    loadNotifications()

  await loadChats();

}


async function loadFriends(){

  const {
    data,
    error
  } =
    await db
      .from("friendships")
      .select(
        "id,user_id,friend_id,created_at"
      )
      .or(
        `user_id.eq.${state.user.id},friend_id.eq.${state.user.id}`
      );

  if(error)
    throw error;

  const ids =
    (data || [])
      .map(
        row =>
          row.user_id ===
          state.user.id
          ? row.friend_id
          : row.user_id
      );

  if(!ids.length){

    state.friends =
      [];

    return;

  }

  const result =
    await db
      .from("profiles")
      .select("*")
      .in(
        "id",
        ids
      );

  if(result.error)
    throw result.error;

  state.friends =
    result.data || [];

}


async function loadRequests(){

  const result =
    await db
      .from("friend_requests")
      .select("*")
      .or(
        `sender_id.eq.${state.user.id},receiver_id.eq.${state.user.id}`
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );

  if(result.error)
    throw result.error;

  state.requests =
    result.data || [];

}


async function loadNotifications(){

  let q =
    await db
      .from("notifications")
      .select("*")
      .eq(
        "user_id",
        state.user.id
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      )
      .limit(50);

  if(q.error){

    state.notifications =
      [];

    return;

  }

  state.notifications =
    q.data || [];

}


async function loadUnreadCounts(){

  state.unreadTotal =
    0;

  state.unreadByConversation =
    {};

  const conversations =
    state.chats.map(
      x =>
        x.conversation_id
    );

  if(!conversations.length)
    return;

  const result =
    await db
      .from("messages")
      .select(
        "conversation_id,sender_id"
      )
      .in(
        "conversation_id",
        conversations
      )
      .neq(
        "sender_id",
        state.user.id
      )
      .is(
        "read_at",
        null
      );

  if(result.error)
    return;

  for(
    const message of
    (
      result.data ||
      []
    )
  ){

    state.unreadTotal++;

    state.unreadByConversation[
      message.conversation_id
    ] =
      (
        state.unreadByConversation[
          message.conversation_id
        ] || 0
      ) + 1;

  }

}


function updateUnreadUI(){

  const total =
    state.unreadTotal ||

  document
    .querySelectorAll(
      "[data-message-badge]"

        el.textContent =
          total > 99
          ? "99+"
          : total;

        el.classList.toggle(
          "hidden",
          total === 0
        );

      }
    );

  document
    .querySelectorAll(
      "[data-chat-unread]"

    .forEach(
      el => {

        const id =
          el.getAttribute(

          );

        const count =
          state.unreadByConversation[

        el.textContent =
          count > 99

          : count;

        el.classList.toggle(
          "hidden",
          count === 0
        );

      }
    );

}

function browserNotification(
  name,
  preview
){

  if(
    !("Notification" in window)
  )
    return;

  if(
    Notification.permission !==
    "granted"
  )
    return;

  if(
    document.visibilityState ===
    "visible"
  )
    return;

  try{

    new Notification(
      name,
      {
        body:
          preview,
        icon:
          ""
      }
    );

  }catch{}

}

/* REALTIME */

function subscribe(){

  if(
    state.messageChannel
  )
    db.removeChannel(
      state.messageChannel
    );

  if(
    state.requestChannel
  )
    db.removeChannel(
      state.requestChannel
    );

  state.messageChannel =
    db
      .channel(
        "msg-" +
        state.user.id
      )
      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"messages"
        },
        async payload => {

          const message =
            payload.new ||
            {};

          const conversationId =
            message.conversation_id;

          if(
            message.sender_id ===
            state.user.id
          ){

            if(
              state.activeConversation ===
              conversationId
            ){

              await loadMessages(
                true
              );

            }

            return;

          }

          if(
            state.activeConversation ===
            conversationId
          ){

            await loadMessages(
              true
            );

            return;

          }

          await loadUnreadCounts();

          updateUnreadUI();

          const other =
            state.chats.find(
              x =>
                x.conversation_id ===
                conversationId
            )?.profile;

          const name =
            other?.display_name ||
            other?.username ||
            "New message";

          const preview =
            String(
              message.message ||
              ""
            ).startsWith(
              "__IMG__:"
            )
            ?
            "Sent an image"
            :
            (
              message.message ||
              "You received a new message."
            );

          showNewMessage(
            name,
            preview
          );

          browserNotification(
            name,
            preview
          );

        }
      )
      .subscribe();


  state.requestChannel =
    db
      .channel(
        "requests-" +
        state.user.id
      )
      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"friend_requests"
        },
        async () => {

          await loadData();

          render();

        }
      )
      .subscribe();

}

async function doSearch(){

  const query =
    $("#searchInput")
      .value
      .trim()
      .toLowerCase();

  const box =
    $("#results");

  if(!query){

    box.innerHTML = `
      <div class="empty">
        Enter a username.
      </div>
    `;

    return;

  }

  box.innerHTML = `
    <div class="empty">
      Searching…
    </div>
  `;

  const result =
    await db
      .from("profiles")
      .select("*")
      .ilike(
        "username",
        `%${query}%`
      )
      .neq(
        "id",
        state.user.id
      )
      .limit(30);

  if(result.error){

    box.innerHTML = `
      <div class="empty">
        ${esc(
          err(
            result.error
          )
        )}
      </div>
    `;

    return;

  }

  if(
    !result.data?.length
  ){

    box.innerHTML = `
      <div class="empty">
        No users found.
      </div>
    `;

    return;

  }

  box.innerHTML =
    result.data
      .map(
        userRow
      )
      .join("");

}

/* FRIEND REQUESTS */

async function sendRequest(
  userId
){

  try{

    const result =
      await db.rpc(
        "send_friend_request",
        {
          target_user:
            userId
        }
      );

    if(result.error)
      throw result.error;

    await loadData();

    toast(
      "Friend request sent."
    );

    if(
      state.page ===
      "search"
    )
      await doSearch();

  }catch(error){

    toast(
      err(error)
    );

  }

}


async function cancelRequest(
  requestId
){

  const result =
    await db
      .from("friend_requests")
      .delete()
      .eq(
        "id",
        requestId
      )
      .eq(
        "sender_id",
        state.user.id
      );

  if(result.error){

    toast(
      err(
        result.error
      )
    );

    return;

  }

  await loadData();

  render();

}


async function acceptRequest(
  requestId
){

  try{

    const result =
      await db.rpc(
        "accept_friend_request",
        {
          request_uuid:
            requestId
        }
      );

    if(result.error)
      throw result.error;

    await loadData();

    toast(
      "Friend request accepted."
    );

    render();

  }catch(error){

    toast(
      err(error)
    );

  }

}


async function rejectRequest(
  requestId
){

  const result =
    await db
      .from("friend_requests")
      .update({
        status:"rejected"
      })
      .eq(
        "id",
        requestId
      )
      .eq(
        "receiver_id",
        state.user.id
      );

  if(result.error){

    toast(
      err(
        result.error
      )
    );

    return;

  }

  await loadData();

  render();

}

/* CHAT */

async function chatWithFriend(
  id
){

  const friend =
    state.friends.find(
      x =>
        x.id ===
        id
    );

  if(!friend){

    toast(
      "This user is no longer in your friends list."
    );

    return;

  }

  state.activeChat =
    id;

  state.activeChatProfile =
    friend;

  state.activeConversation =
    null;

  state.page =
    "messages";

  render();

  try{

    const result =
      await db.rpc(
        "create_private_conversation",
        {
          other_user:
            id
        }
      );

    if(result.error)
      throw result.error;

    if(!result.data)
      throw new Error(
        "Supabase did not return a conversation ID."
      );

    state.activeConversation =
      result.data;

    await loadChats();

    await loadUnreadCounts();

    render();

    await loadMessages(
      true
    );

  }catch(error){

    console.error(
      "CHAT ERROR:",
      error
    );

    state.activeChat =
      null;

    state.activeConversation =
      null;

    state.activeChatProfile =
      null;

    render();

    toast(
      err(error)
    );

  }

}

/* MESSAGES */

async function loadMessages(
  scroll=false
){

  if(
    !state.activeConversation
  )
    return;

  const box =
    $("#chatMessages");

  if(!box)
    return;

  const r =
    await db
      .from("messages")
      .select("*")
      .eq(
        "conversation_id",
        state.activeConversation
      )
      .order(
        "created_at",
        {
          ascending:true
        }
      );

  if(r.error){

    box.innerHTML = `
      <div class="empty">

        Unable to load messages.

        <br>

        <span class="small">

          ${esc(
            err(
              r.error
            )
          )}

        </span>

      </div>
    `;

    return;

  }

  if(
    !r.data?.length
  ){

    box.innerHTML = `

      <div
        class="empty"
        style="margin:auto">

        <div
          style="
            color:#007aff;
            display:grid;
            place-items:center">

          ${icon(
            "chat",
            42
          )}

        </div>

        <b>
          Start the conversation
        </b>

        <p>
          Send your first message.
        </p>

      </div>

    `;

  }else{

    box.innerHTML =
      r.data
        .map(
          m => {

            const mine =
              m.sender_id ===
              state.user.id;

            const isImage =
              String(
                m.message ||
                ""
              ).startsWith(
                "__IMG__:"
              );

            const imageUrl =
              isImage
              ?
              String(
                m.message
              ).slice(
                8
              )
              :
              "";

            const content =
              m.deleted_at
              ?
              `
                <div class="bubble">
                  <i>
                    Message deleted
                  </i>
                </div>
              `
              :
              isImage
              ?
              `
                <div
                  class="
                    bubble
                    image-bubble
                  ">

                  <img
                    class="chat-image"
                    src="${esc(
                      imageUrl
                    )}"
                    alt="Image"
                    onclick="
                      window.open(
                        '${esc(
                          imageUrl
                        )}',
                        '_blank'
                      )
                    ">

                </div>
              `
              :
              `
                <div class="bubble">
                  ${esc(
                    m.message
                  )}
                </div>
              `;

            return `

              <div
                class="
                  message
                  ${
                    mine
                    ? "mine"
                    : ""
                  }
                ">

                ${content}

                <div
                  class="message-meta">

                  ${clock(
                    m.created_at
                  )}

                  ${
                    mine
                    ?
                    (
                      m.read_at
                      ?
                      " · Read"
                      :
                      " · Sent"
                    )
                    :
                    ""
                  }

                </div>

              </div>

            `;

          }
        )
        .join("");

  }

  if(
    scroll ||
    box.dataset.initial !==
    "1"
  ){

    box.scrollTop =
      box.scrollHeight;

    box.dataset.initial =
      "1";

  }

  await markConversationRead(
    state.activeConversation
  );

}


/* IMAGE MESSAGE */

async function uploadChatImage(
  file
){

  if(
    !file ||
    !state.activeConversation
  )
    return;

  if(
    file.size >
    5 * 1024 * 1024
  ){

    toast(
      "Images must be smaller than 5 MB."
    );

    return;

  }

  if(
    !/^image\/(jpeg|png|webp)$/
      .test(
        file.type
      )
  ){

    toast(
      "Use JPG, PNG or WebP images."
    );

    return;

  }

  const ext =
    file.type ===
      "image/png"
      ?
      "png"
      :
      file.type ===
        "image/webp"
      ?
      "webp"
      :
      "jpg";

  const path =
    `${state.user.id}/chat-${Date.now()}.${ext}`;

  toast(
    "Uploading image…"
  );

  const upload =
    await db
      .storage
      .from("avatars")
      .upload(
        path,
        file,
        {
          upsert:false,
          contentType:
            file.type
        }
      );

  if(upload.error){

    toast(
      err(
        upload.error
      )
    );

    return;

  }

  const url =
    db
      .storage
      .from("avatars")
      .getPublicUrl(
        path
      )
      .data
      .publicUrl;

  const result =
    await db
      .from("messages")
      .insert({

        conversation_id:
          state.activeConversation,

        sender_id:
          state.user.id,

        message:
          "__IMG__:" +
          url

      });

  if(result.error){

    toast(
      err(
        result.error
      )
    );

    return;

  }

  await loadMessages(
    true
  );

}

  input.disabled =

  try{

        .from("messages")
        .insert({

          conversation_id:

          sender_id:
            state.user.id,

          message:
            text

        });

    if(r.error)
      throw r.error;

    input.value =
      "";

    await loadMessages(
      true
    );

  }catch(x){

    toast(
      err(x)
    );

  }finally{

    input.disabled =
      false;

    input.focus();

  }

}


function closeChat(){

  state.activeChat =
    null;

  state.activeConversation =
    null;

  state.activeChatProfile =
    null;

  render();

}


/* PROFILE */

function profile(){

  return `

    <div class="content">

      <div class="profile-grid">

        <div class="card">

          <div class="profile-head">

            ${avatar(
              state.profile,
              "big-avatar"
            )}

            <div>

              <b>
                @${esc(
                  state.profile.username
                )}
              </b>

              <div class="muted">

                Joined
                ${
                  new Date(
                    state.profile.created_at
                  )
                  .toLocaleDateString()
                }

              </div>

            </div>

          </div>

          <label
            class="file-button">

            Change avatar

            <input
              id="avatarInput"
              type="file"
              accept="
                image/jpeg,
                image/png,
                image/webp
              ">

          </label>

        </div>

        <div class="card">

          <form id="profileForm">

            <div class="field">

              <label>
                Display name
              </label>

              <input
                id="displayName"
                maxlength="50"
                value="${esc(
                  state.profile.display_name ||
                  ""
                )}">

            </div>

            <div class="field">

              <label>
                Bio
              </label>

              <textarea
                id="bio"
                maxlength="250">${esc(
                  state.profile.bio ||
                  ""
                )}</textarea>

            </div>

            <button
              class="primary">

              Save profile

            </button>

          </form>

        </div>

      </div>

    </div>

  `;

}


async function saveProfile(
  e
){

  e.preventDefault();

  const r =
    await db
      .from("profiles")
      .update({

        display_name:
          $("#displayName")
            .value
            .trim(),

        bio:
          $("#bio")
            .value
            .trim()

      })
      .eq(
        "id",
        state.user.id
      )
      .select()
      .single();

  if(r.error){

    toast(
      err(
        r.error
      )
    );

    return;

  }

  state.profile =
    r.data;

  toast(
    "Profile updated."
  );

  render();

}


async function uploadAvatar(
  e
){

  const f =
    e.target.files[0];

  if(!f)
    return;

  if(
    f.size >
    2 * 1024 * 1024
  ){

    toast(
      "Avatar must be smaller than 2 MB."
    );

    return;

  }

  const ext =
    (
      f.name
        .split(".")
        .pop() ||
      "jpg"
    ).toLowerCase();

  const path =
    `${state.user.id}/avatar.${ext}`;

  const r =
    await db
      .storage
      .from("avatars")
      .upload(
        path,
        f,
        {
          upsert:true,
          contentType:
            f.type
        }
      );

  if(r.error){

    toast(
      err(
        r.error
      )
    );

    return;

  }

  const u =
    db
      .storage
      .from("avatars")
      .getPublicUrl(
        path
      )
      .data
      .publicUrl +
    "?v=" +
    Date.now();

  const p =
    await db
      .from("profiles")
      .update({
        avatar_url:u
      })
      .eq(
        "id",
        state.user.id
      )
      .select()
      .single();

  if(p.error){

    toast(
      err(
        p.error
      )
    );

    return;

  }

  state.profile =
    p.data;

  toast(
    "Avatar updated."
  );

  render();

}


/* SETTINGS */

function settings(){

  const unread =
    state.notifications
      .filter(
        x =>
          !x.is_read
      )
      .length;

  return `

    <div class="content">

      <div class="grid">

        <div class="card">

          <h3>
            Notifications
          </h3>

          ${
            unread
            ?
            `
              <p>

                You have
                <b>
                  ${unread}
                </b>
                unread notifications.

              </p>

              <button
                class="secondary"
                onclick="
                  markRead()
                ">

                Mark all as read

              </button>
            `
            :
            `
              <div class="empty">
                No unread notifications.
              </div>
            `
          }

        </div>

        <div class="card">

          <h3>
            Account
          </h3>

          <p class="muted">

            Logged in as

            <b>
              @${esc(
                state.profile.username
              )}
            </b>

          </p>

          <button
            class="danger"
            onclick="
              logout()
            ">

            Log out

          </button>

        </div>

      </div>

    </div>

  `;

}


async function markRead(){

  const r =
    await db
      .from("notifications")
      .update({
        is_read:true
      })
      .eq(
        "user_id",
        state.user.id
      )
      .eq(
        "is_read",
        false
      );

  if(r.error){

    toast(
      err(
        r.error
      )
    );

    return;

  }

  await loadNotifications();

  render();

}


async function viewUser(
  id
){

  const r =
    await db
      .from("profiles")
      .select("*")
      .eq(
        "id",
        id
      )
      .single();

  if(r.error){

    toast(
      err(
        r.error
      )
    );

    return;

  }

  const p =
    r.data;

  const m =
    document.createElement(
      "div"
    );

  m.className =
    "profile-modal";

  m.style.cssText = `
    position:fixed;
    inset:0;
    z-index:500;
    display:grid;
    place-items:center;
    padding:20px;
    background:rgba(0,0,0,.42);
    backdrop-filter:blur(12px);
  `;

  m.innerHTML = `

    <div
      class="card"
      style="
        width:min(430px,100%);
      ">

      <div
        style="
          display:flex;
          gap:15px;
          align-items:center">

        ${avatar(
          p,
          "big-avatar"
        )}

        <div>

          <h3
            style="margin:0">

            ${esc(
              p.display_name ||
              p.username
            )}

          </h3>

          <div class="muted">

            @${esc(
              p.username
            )}

          </div>

          <div
            class="
              status
              ${
                p.online_status
                ? "online"
                : ""
              }
            ">

            ${
              p.online_status
              ? "Online"
              : "Offline"
            }

          </div>

        </div>

      </div>

      <p
        class="muted"
        style="margin:20px 0">

        ${esc(
          p.bio ||
          "No bio yet."
        )}

      </p>

      <div class="user-actions">

        <button
          class="secondary"
          onclick="
            this.closest(
              '.profile-modal'
            ).remove()
          ">

          Close

        </button>

        <button
          class="primary"
          onclick="
            this.closest(
              '.profile-modal'
            ).remove();

            ${
              state.friends.some(
                x =>
                  x.id ===
                  id
              )
              ?
              `chatWithFriend('${id}')`
              :
              `sendRequest('${id}')`
            }

          ">

          ${
            state.friends.some(
              x =>
                x.id ===
                id
            )
            ?
            "Chat"
            :
            "Add Friend"
          }

        </button>

      </div>

    </div>

  `;

  document.body.appendChild(
    m
  );

}


/* EVENTS */

function bind(){

  if(
    state.page ===
    "search"
  ){

    if(
      $("#searchBtn")
    )
      $("#searchBtn")
        .onclick =
          doSearch;

    if(
      $("#searchInput")
    )
      $("#searchInput")
        .onkeydown =
          e => {

            if(
              e.key ===
              "Enter"
            ){

              e.preventDefault();

              doSearch();

            }

          };

  }

  if(
    state.page ===
    "messages"
  ){

    if(
      $("#chatForm")
    )
      $("#chatForm")
        .onsubmit =
          sendMessage;

    if(
      $("#chatInput")
    )
      $("#chatInput")
        .onkeydown =
          e => {

            if(
              e.key ===
                "Enter" &&
              !e.shiftKey
            ){

              e.preventDefault();

              sendMessage(
                e
              );

            }

          };

    if(
      $("#imageInput")
    )
      $("#imageInput")
        .onchange =
          e => {

            const file =
              e.target.files[0];

            if(file)
              uploadChatImage(
                file
              );

            e.target.value =
              "";

          };

    if(
      state.activeConversation
    )
      loadMessages(
        false
      );

  }

  if(
    state.page ===
    "profile"
  ){

    if(
      $("#profileForm")
    )
      $("#profileForm")
        .onsubmit =
          saveProfile;

    if(
      $("#avatarInput")
    )
      $("#avatarInput")
        .onchange =
          uploadAvatar;

  }

}


/* LOGOUT */

async function logout(){

  try{
    await presence(
      false
    );
  }catch{}

  if(
    state.messageChannel
  )
    db.removeChannel(
      state.messageChannel
    );

  if(
    state.requestChannel
  )
    db.removeChannel(
      state.requestChannel
    );

  await db.auth.signOut();

  state.session =
    null;

  state.user =
    null;

  state.profile =
    null;

  landing();

}


/* AUTH STATE */

db.auth.onAuthStateChange(
  (
    event,
    session
  ) => {

    if(
      event ===
      "SIGNED_OUT"
    ){

      state.session =
        null;

      state.user =
        null;

      state.profile =
        null;

      landing();

    }

  }
);


/* PRESENCE */

document.addEventListener(
  "visibilitychange",
  () => {

    if(
      state.user &&
      document.visibilityState ===
      "visible"
    )
      presence(
        true
      );

  }
);

window.addEventListener(
  "beforeunload",
  () => {

    if(state.user)
      presence(
        false
      );

  }
);


/* BOOT */

async function boot(){

  try{

    const result =
      await db.auth
        .getSession();

    if(result.error)
      throw result.error;

    if(
      result.data.session
    ){

      await start(
        result.data.session
      );

    }else{

      landing();

    }

  }catch(error){

    console.error(
      "BOOT ERROR:",
      error
    );

    landing();

    toast(
      err(error)
    );

  }

}

boot();

</script>
